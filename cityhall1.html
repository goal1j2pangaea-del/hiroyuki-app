<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市役所クエスト 〜生活保護申請〜</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a18; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    min-height:100vh; font-family:'Courier New',monospace; padding-top:10px; }
  canvas { width:96vw; height:auto; max-height:58vh; border:3px solid #b06cff; box-shadow:0 0 24px #b06cff88;
    image-rendering:auto; touch-action:none; }
  .pad { margin-top:12px; width:96vw; display:flex; justify-content:space-between; align-items:flex-end; }
  .dpad { display:grid; grid-template-columns:repeat(3,58px); grid-template-rows:repeat(3,58px); gap:6px; }
  .dpad button, .act { background:#14081a; color:#b06cff; border:3px solid #b06cff; border-radius:14px;
    font-size:1.4rem; font-weight:bold; cursor:pointer;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:manipulation;
    box-shadow:0 0 10px #b06cff55; }
  .dpad button:active, .act:active { background:#b06cff; color:#0a0a18; }
  .dpad .empty { visibility:hidden; border:none; box-shadow:none; background:none; }
  .act { width:96px; height:96px; font-size:1rem; color:#ff9a3c; border-color:#ff9a3c; box-shadow:0 0 10px #ff9a3c55; }
  .act:active { background:#ff9a3c; color:#0a0a18; }
  .hint { color:#888; font-size:0.7rem; margin-top:10px; text-align:center; }
</style>
</head>
<body>
<canvas id="c" width="480" height="360"></canvas>
<div class="pad">
  <div class="dpad">
    <button class="empty"></button><button id="up">▲</button><button class="empty"></button>
    <button id="left">◀</button><button class="empty"></button><button id="right">▶</button>
    <button class="empty"></button><button id="down">▼</button><button class="empty"></button>
  </div>
  <button id="talk" class="act">はなす</button>
</div>
<div class="hint">十字ボタンで移動・窓口に近づいて「はなす」</div>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const W=480,H=360,TILE=40;

const FLOOR_COLOR='#ffffff';
const BATTLE_COLOR='#ffffff';

function loadImg(url){
  const im=new Image(); im.ready=false;
  im.onload=()=>{ im.ready=true; };
  im.onerror=()=>{ im.ready=false; };
  im.src=url; return im;
}
const charaBack = loadImg('chara_back.jpg');
const charaFront= loadImg('chara_front.jpg');
const charaSide = loadImg('chara_side.jpg');
const enemyMapImg = loadImg('enemy_map.jpg');
const enemyBossImg= loadImg('enemy_boss.jpg');

let frame=0;
let mode='walk';

// ===== 音（Web Audio API・ファイル不要） =====
let actx=null, bgmTimer=null, bgmStep=0, currentBgm='';
function initAudio(){
  if(actx) return;
  try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
}
function tone(freq,dur,type,vol,when){
  if(!actx) return;
  const t=when||actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(vol||0.08,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur);
}
const walkBass=[130.8,146.8,164.8,146.8];
const walkLead=[392.0,440.0,523.2,440.0,392.0,349.2,392.0,440.0];
const battleBass=[82.4,82.4,92.5,82.4,110.0,110.0,98.0,82.4];
const battleLead=[220.0,246.9,220.0,196.0,220.0,246.9,261.6,246.9];

function startBgm(kind){
  if(currentBgm===kind) return;
  currentBgm=kind; bgmStep=0;
  if(bgmTimer) clearInterval(bgmTimer);
  const interval = kind==='battle' ? 150 : 260;
  bgmTimer=setInterval(()=>{
    if(!actx) return;
    const t=actx.currentTime;
    if(kind==='walk'){
      tone(walkBass[bgmStep%walkBass.length],0.45,'triangle',0.06,t);
      tone(walkLead[bgmStep%walkLead.length],0.22,'sine',0.05,t);
    } else if(kind==='battle'){
      tone(battleBass[bgmStep%battleBass.length],0.16,'sawtooth',0.09,t);
      tone(battleLead[bgmStep%battleLead.length],0.1,'square',0.05,t);
    }
    bgmStep++;
  }, interval);
}
function unlockAudioAndStart(){
  initAudio();
  if(actx && actx.state==='suspended') actx.resume();
  startBgm('walk');
}
canvas.addEventListener('pointerdown', unlockAudioAndStart, { once:true });
document.addEventListener('keydown', unlockAudioAndStart, { once:true });

const player={ x:W/2, y:H-70, w:56, h:96, dir:'up', speed:2.4, moving:false, step:0, stepTimer:0 };
const clerk={ x:W/2, y:70, w:60, h:84 };

const dialogLines=[
  '窓口の人「本日はどのようなご用件ですか？」',
  'あなた「生活保護の……申請に来ました」',
  '窓口の人「ああ、ご相談ですね」',
  'あなた「いえ……申請です」',
  '窓口の人「まずは、ご相談からということで……」',
];
let dialogIndex=0;

const keys={up:false,down:false,left:false,right:false};
function bind(id,key){
  const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault(); keys[key]=true;});
  b.addEventListener('pointerup',e=>{e.preventDefault(); keys[key]=false;});
  b.addEventListener('pointerleave',()=>keys[key]=false);
}
bind('up','up'); bind('down','down'); bind('left','left'); bind('right','right');
document.getElementById('talk').addEventListener('pointerdown',e=>{ e.preventDefault(); onTalk(); });
canvas.addEventListener('pointerdown',()=>{ if(mode==='dialog'||mode==='battleIntro') onTalk(); });

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp') keys.up=true;
  if(e.key==='ArrowDown') keys.down=true;
  if(e.key==='ArrowLeft') keys.left=true;
  if(e.key==='ArrowRight') keys.right=true;
  if(e.key===' '||e.key==='Enter') onTalk();
  if(e.key.startsWith('Arrow')) e.preventDefault();
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowUp') keys.up=false;
  if(e.key==='ArrowDown') keys.down=false;
  if(e.key==='ArrowLeft') keys.left=false;
  if(e.key==='ArrowRight') keys.right=false;
});

function nearClerk(){
  const dx=Math.abs(player.x-clerk.x);
  const dy=Math.abs(player.y-(clerk.y+clerk.h+34));
  return dx<70 && dy<86;
}
function onTalk(){
  if(mode==='walk'){ if(nearClerk()){ mode='dialog'; dialogIndex=0; } }
  else if(mode==='dialog'){ dialogIndex++; if(dialogIndex>=dialogLines.length){ mode='battleIntro'; frame=0; startBgm('battle'); } }
  else if(mode==='battleIntro'){ mode='battle'; frame=0; }
}

function update(){
  frame++;
  if(mode!=='walk') return;
  let dx=0,dy=0;
  if(keys.up){ dy=-player.speed; player.dir='up'; }
  if(keys.down){ dy=player.speed; player.dir='down'; }
  if(keys.left){ dx=-player.speed; player.dir='left'; }
  if(keys.right){ dx=player.speed; player.dir='right'; }
  player.moving=(dx!==0||dy!==0);
  player.x+=dx; player.y+=dy;
  player.x=Math.max(30,Math.min(W-30,player.x));
  player.y=Math.max(176,Math.min(H-30,player.y));
  if(player.moving){ player.stepTimer++; if(player.stepTimer>8){ player.step=(player.step+1)%2; player.stepTimer=0; } }
}

function drawFloor(){
  ctx.fillStyle=FLOOR_COLOR; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(0,0,0,0.06)'; ctx.lineWidth=1;
  for(let x=0;x<=W;x+=TILE){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0;y<=H;y+=TILE){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
}
function drawHall(){
  ctx.fillStyle='#5a6a80'; ctx.fillRect(0,0,W,44);
  ctx.fillStyle='#48566a'; ctx.fillRect(0,40,W,4);
  ctx.fillStyle='#fff'; ctx.font='bold 15px Courier New'; ctx.textAlign='center';
  ctx.fillText('キタ区役所  生活支援課  生活保護窓口',W/2,28); ctx.textAlign='left';
  ctx.strokeStyle='#a06a3c'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(50,176); ctx.lineTo(W-50,176); ctx.stroke();
  ctx.fillStyle='#a06a3c'; ctx.font='bold 12px Courier New'; ctx.textAlign='center';
  ctx.fillText('― 生活支援課 ―',W/2,196); ctx.textAlign='left';
}
function drawClerkMap(){
  const c=clerk;
  ctx.fillStyle='rgba(0,0,0,0.22)'; ctx.beginPath(); ctx.ellipse(c.x,c.y+c.h,22,6,0,0,Math.PI*2); ctx.fill();
  if(enemyMapImg.ready){ ctx.drawImage(enemyMapImg,c.x-c.w/2,c.y,c.w,c.h); }
  else { ctx.fillStyle='#2a2a40'; ctx.fillRect(c.x-c.w/2,c.y,c.w,c.h); }
  if(nearClerk() && mode==='walk'){
    ctx.fillStyle='#e04a2a'; ctx.font='bold 26px Courier New'; ctx.textAlign='center';
    if(frame%40<26) ctx.fillText('!',c.x,c.y-22);
    ctx.textAlign='left';
  }
}
function drawPlayer(){
  const p=player;
  const bob=p.moving?(p.step===1?-2:0):0;
  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(0,4,20,5,0,0,Math.PI*2); ctx.fill();
  let im=charaFront, flip=false;
  if(p.dir==='up') im=charaBack;
  else if(p.dir==='down') im=charaFront;
  else if(p.dir==='left'){ im=charaSide; flip=false; }
  else if(p.dir==='right'){ im=charaSide; flip=true; }
  if(im && im.ready){
    if(flip){ ctx.scale(-1,1); }
    ctx.drawImage(im,-p.w/2,-p.h+bob,p.w,p.h);
  } else {
    ctx.fillStyle='#8a3ce0'; ctx.fillRect(-p.w/2,-p.h+bob,p.w,p.h);
  }
  ctx.restore();
}
function wrapText(text,x,y,maxW,lh){
  const chars=[...text]; let line='',yy=y;
  for(const ch of chars){
    if(ctx.measureText(line+ch).width>maxW){ ctx.fillText(line,x,yy); line=ch; yy+=lh; }
    else line+=ch;
  }
  ctx.fillText(line,x,yy);
}
function drawDialog(){
  ctx.fillStyle='rgba(10,10,30,0.92)'; ctx.fillRect(20,H-96,W-40,76);
  ctx.strokeStyle='#b06cff'; ctx.lineWidth=3; ctx.strokeRect(20,H-96,W-40,76);
  ctx.fillStyle='#fff'; ctx.font='bold 14px Courier New';
  wrapText(dialogLines[dialogIndex],34,H-66,W-68,20);
  ctx.fillStyle='#ff9a3c'; ctx.font='bold 11px Courier New'; ctx.textAlign='right';
  ctx.fillText('▶ タップで次へ',W-34,H-28); ctx.textAlign='left';
}

function drawBattleBG(){
  ctx.fillStyle=BATTLE_COLOR; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(0,0,0,0.05)'; ctx.fillRect(0,H-60,W,60);
}
function drawBossBattle(scale,shakeY){
  const bh=250*scale, bw=bh*0.95;
  const bx=W/2-bw/2, by=H-40-bh+(shakeY||0);
  ctx.fillStyle='rgba(0,0,0,0.16)'; ctx.beginPath(); ctx.ellipse(W/2,H-40,bw*0.42,12*scale,0,0,Math.PI*2); ctx.fill();
  if(enemyBossImg.ready){ ctx.drawImage(enemyBossImg,bx,by,bw,bh); }
  else { ctx.fillStyle='#888'; ctx.fillRect(bx,by,bw,bh); }
}

function draw(){
  if(mode==='walk' || mode==='dialog'){
    drawFloor(); drawHall(); drawClerkMap(); drawPlayer();
    if(mode==='dialog') drawDialog();
    return;
  }
  if(mode==='battleIntro'){
    drawBattleBG();
    const p=Math.min(1,frame/40);
    drawBossBattle(0.5+0.5*p,(1-p)*40);
    ctx.textAlign='center';
    if(frame<40){
      ctx.fillStyle='#333'; ctx.font='bold 16px Courier New';
      if(frame%20<14) ctx.fillText('窓口の人 が たちはだかった！',W/2,40);
    } else {
      ctx.fillStyle='#c0304a'; ctx.font='bold 30px Courier New';
      if(frame%20<14) ctx.fillText('⚔ バトル開始！ ⚔',W/2,44);
      ctx.fillStyle='#a06a20'; ctx.font='bold 12px Courier New';
      ctx.fillText('タップで つづく…（デモはここまで）',W/2,H-14);
    }
    ctx.textAlign='left';
    return;
  }
  if(mode==='battle'){
    drawBattleBG();
    drawBossBattle(1,0);
    ctx.fillStyle='rgba(20,8,26,0.92)'; ctx.fillRect(0,H-64,W,64);
    ctx.strokeStyle='#b06cff'; ctx.lineWidth=2; ctx.strokeRect(0,H-64,W,64);
    ctx.fillStyle='#fff'; ctx.font='bold 13px Courier New';
    ctx.fillText('窓口の人「まずは、ご相談から……」',14,H-38);
    ctx.fillStyle='#aaa'; ctx.font='bold 11px Courier New';
    ctx.fillText('（コマンドバトルは次の回で実装します）',14,H-16);
  }
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
