
<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KOUROU QUEST</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:#06060e;color:#f5f5f0;font-family:'DotGothic16','Hiragino Kaku Gothic ProN',monospace;display:flex;justify-content:center;min-height:100vh;overflow-y:auto;}
#game{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;padding:10px 10px 24px;position:relative;}
#scan{position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);}
.hidden{display:none!important;}
.win{background:#06060e;border:3px solid #f5f5f0;border-radius:6px;box-shadow:0 0 0 3px #06060e,0 0 0 5px #f5f5f0;padding:12px 14px;}
#title{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:26px;text-align:center;min-height:80vh;}
#title h1{font-size:34px;letter-spacing:4px;line-height:1.4;color:#0d9488;text-shadow:3px 3px 0 #065f46,6px 6px 0 #000;}
#title .sub{font-size:14px;color:#9aa0c0;letter-spacing:2px;}
#startBtn{font-family:inherit;font-size:18px;letter-spacing:3px;color:#f5f5f0;background:#06060e;border:3px solid #f5f5f0;border-radius:6px;padding:14px 34px;cursor:pointer;box-shadow:0 0 0 3px #06060e,0 0 0 5px #f5f5f0;animation:blink 1.2s steps(2) infinite;}
@keyframes blink{50%{opacity:.35;}}
#title .note{font-size:11px;color:#666c8f;line-height:1.9;}
#battle{flex:1;display:flex;flex-direction:column;gap:10px;}
#bossArea{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0 6px;background:radial-gradient(ellipse at 50% 80%,#042f2e 0%,#06060e 70%);border-radius:8px;}
#bossName{font-size:15px;letter-spacing:2px;color:#6ee7b7;}
#bossSprite{image-rendering:pixelated;position:relative;}
#bossSprite .px{position:absolute;width:1px;height:1px;}
.bossbar{width:200px;}
.hpRow{display:flex;align-items:center;gap:8px;font-size:12px;}
.hpShell{flex:1;height:12px;border:2px solid #f5f5f0;border-radius:3px;background:#111;overflow:hidden;}
.hpFill{height:100%;transition:width .45s steps(8);}
#bossHpFill{background:linear-gradient(#f87171,#b91c1c);width:100%;}
#plHpFill{background:linear-gradient(#86efac,#15803d);width:100%;}
.hpNum{min-width:64px;text-align:right;font-size:12px;}
#playerBar{display:flex;flex-direction:column;gap:6px;padding:10px 12px;position:relative;}
#playerBar .who{font-size:13px;color:#fbbf24;letter-spacing:1px;margin-bottom:2px;}
#playerBar .statRow{display:flex;align-items:center;gap:8px;}
#playerBar .barLbl{font-size:12px;letter-spacing:1px;width:24px;}
#playerBar .hpShell{flex:1;}
#playerBar .hpNum{min-width:74px;font-size:12px;}
#plMpFill{background:linear-gradient(#7dd3fc,#2563eb);width:100%;}
#mpToast{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%) scale(0);z-index:72;background:#06060e;border:3px solid #f87171;border-radius:6px;box-shadow:0 0 0 3px #06060e,0 0 0 5px #f87171;color:#fecaca;font-size:18px;letter-spacing:3px;padding:14px 26px;pointer-events:none;}
.toastIn{animation:toast 1.1s ease-out forwards;}
@keyframes toast{0%{transform:translate(-50%,-50%) scale(0)}15%{transform:translate(-50%,-50%) scale(1.1)}30%{transform:translate(-50%,-50%) scale(1)}80%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.cmd .mpcost{color:#7dd3fc;font-size:12px;}
#msgWin{min-height:110px;font-size:15px;line-height:1.8;letter-spacing:1px;position:relative;cursor:pointer;user-select:none;}
#msgText{white-space:pre-wrap;}
#nextCursor{position:absolute;right:12px;bottom:6px;font-size:14px;color:#0d9488;animation:blink 1s steps(2) infinite;}
#noteWin{border-color:#6ee7b7;box-shadow:0 0 0 3px #06060e,0 0 0 5px #6ee7b7;font-size:13px;line-height:1.8;color:#ccfbf1;}
#noteWin .tag{color:#6ee7b7;font-size:12px;letter-spacing:2px;display:block;margin-bottom:4px;}
#cmds{display:flex;flex-direction:column;gap:8px;}
.cmdLabel{font-size:12px;color:#9aa0c0;letter-spacing:2px;padding-left:4px;}
.cmd{font-family:inherit;text-align:left;font-size:13.5px;line-height:1.55;letter-spacing:.5px;color:#f5f5f0;background:#0c0c1c;border:2px solid #f5f5f0;border-radius:5px;padding:10px 12px 10px 30px;cursor:pointer;position:relative;}
.cmd::before{content:"▶";position:absolute;left:10px;color:#0d9488;opacity:0;}
.cmd:active{background:#04312e;}
.cmd:active::before{opacity:1;}
.cmd:disabled{opacity:.45;}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-7px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-5px,1px)}80%{transform:translate(4px,-1px)}}
.shake{animation:shake .35s linear;}
@keyframes bossflash{0%,100%{filter:none}50%{filter:brightness(8) saturate(0)}}
.bossHit{animation:bossflash .18s linear 2;}
#flash{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:0;}
.flashWhite{background:#fff;animation:fl .25s linear;}
.flashGold{background:#0d9488;animation:fl .6s linear;}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
#critStamp{position:fixed;top:32%;left:50%;z-index:70;transform:translate(-50%,-50%) rotate(-8deg) scale(0);font-size:42px;letter-spacing:6px;color:#0d9488;text-shadow:3px 3px 0 #065f46,6px 6px 0 #000;pointer-events:none;}
.stampIn{animation:stamp .9s cubic-bezier(.2,2.4,.4,1) forwards;}
@keyframes stamp{0%{transform:translate(-50%,-50%) rotate(-8deg) scale(0)}60%{transform:translate(-50%,-50%) rotate(-8deg) scale(1.25)}100%{transform:translate(-50%,-50%) rotate(-8deg) scale(1)}}
.dmgPop{position:absolute;z-index:40;font-size:27px;color:#ffffff;font-weight:bold;letter-spacing:1px;text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 4px 0 #000;pointer-events:none;animation:pop 1.1s ease-out forwards;}
.dmgPop.crit{color:#0d9488;font-size:34px;}
@keyframes pop{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-36px)}}
@media(prefers-reduced-motion:reduce){.shake,.bossHit,.stampIn,.flashWhite,.flashGold,.dmgPop,#startBtn,#nextCursor{animation:none!important;}}
</style>
</head>
<body>
<div id="game">
  <div id="title">
    <div>
      <div class="sub">— 完全版 —</div>
      <h1>KOUROU<br>QUEST</h1>
      <div class="sub" style="margin-top:10px">魔王・厚生労働省を 論破せよ</div>
    </div>
    <button id="startBtn">▶ 戦闘開始</button>
    <div class="note">※ボタンを押すとBGMが流れます<br>※強い反論はLP（ロジックポイント）を消費</div>
  </div>
  <div id="battle" class="hidden">
    <div id="bossArea">
      <div id="bossName">魔王 厚生労働省（第一形態）</div>
      <div id="bossSub" style="font-size:12px;color:#6ee7b7;letter-spacing:1px;margin-top:-2px">— 保険料という名の迷宮 —</div>
      <div id="bossSprite"></div>
      <div class="hpRow bossbar">
        <div class="hpShell"><div id="bossHpFill" class="hpFill"></div></div>
        <div class="hpNum" id="bossHpNum"></div>
      </div>
    </div>
    <div id="playerBar" class="win">
      <div class="who">納税者（勇者）</div>
      <div class="statRow">
        <span class="barLbl" style="color:#fbbf24">HP</span>
        <div class="hpShell"><div id="plHpFill" class="hpFill"></div></div>
        <span class="hpNum" id="plHpNum"></span>
      </div>
      <div class="statRow">
        <span class="barLbl" style="color:#7dd3fc">LP</span>
        <div class="hpShell"><div id="plMpFill" class="hpFill"></div></div>
        <span class="hpNum" id="plMpNum"></span>
      </div>
    </div>
    <div id="msgWin" class="win">
      <div id="msgText"></div>
      <div id="nextCursor" class="hidden">▼</div>
    </div>
    <div id="noteWin" class="win hidden">
      <span class="tag">▼ かいせつ</span>
      <div id="noteText"></div>
    </div>
    <div id="cmds" class="hidden">
      <div class="cmdLabel">▼ どう はんろんする？（すべて正解。威力がちがう）</div>
      <div id="cmdBtns"></div>
    </div>
  </div>
  <div id="scan"></div>
  <div id="flash"></div>
  <div id="critStamp">はんろんふのう！</div>
  <div id="mpToast">LPが たりない！</div>
</div>
<script>
“use strict”;
const PAL={T:”#0d9488”,C:”#bbf7d0”,W:”#f5f5f0”,K:”#000”,R:”#ef4444”,G:”#fbbf24”,F:”#374151”};
const SPRITE=[”..R……….R..”,”.RT……….TR.”,”..TTTTTTTTTTTT..”,”.TTTFFTTTTTFFTT.”,”.TTFFWWTTWWFFTT.”,”.TTFGWWTTWWGFTT.”,”.TTTTTTTTTTTTTT.”,”..TTTKKKKKKTTT..”,”…TTTTTTTTTT…”,”..CCCCCWWCCCCC..”,”.CCCCCWRRWCCCCC.”,”.CCCCCWRRWCCCCC.”,”.CCCCCCRRCCCCCC.”,”.CCCCCCRRCCCCCC.”,”.CCC.CCCCCC.CCC.”,”…………….”];
function drawBoss(scale){const host=document.getElementById(“bossSprite”);host.style.width=16scale+“px”;host.style.height=16scale+“px”;let shadows=[];SPRITE.forEach((row,y)=>{[…row].forEach((c,x)=>{if(PAL[c])shadows.push(${x*scale}px ${y*scale}px 0 ${scale/2}px ${PAL[c]});});});const px=document.createElement(“div”);px.className=“px”;px.style.boxShadow=shadows.join(”,”);host.appendChild(px);}
drawBoss(7);
let AC=null,bgmTimer=null,master=null;
function audioInit(){AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);}
function beep(type,freq,t0,dur,vol){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(freq,t0);g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.02);}
const N={A2:110,C3:130.8,D3:146.8,E3:164.8,F3:174.6,G3:196,A3:220,C4:261.6,D4:293.7,E4:329.6,F4:349.2,G4:392,A4:440,B4:493.9,C5:523.3,D5:587.3,E5:659.3,F5:698.5,B3:246.9,G2:98,R:0};
const LEAD=[“E4”,“R”,“G4”,“E4”,“A4”,“R”,“G4”,“F4”,“E4”,“R”,“G4”,“E4”,“B4”,“R”,“A4”,“R”,“E4”,“R”,“G4”,“E4”,“C5”,“R”,“B4”,“A4”,“G4”,“F4”,“E4”,“D4”,“E4”,“R”,“R”,“R”];
const BASS=[“A2”,“A2”,“A2”,“A2”,“F3”,“F3”,“F3”,“F3”,“E3”,“E3”,“E3”,“E3”,“A2”,“A2”,“A2”,“A2”,“A2”,“A2”,“A2”,“A2”,“F3”,“F3”,“F3”,“F3”,“C3”,“C3”,“E3”,“E3”,“A2”,“A2”,“A2”,“A2”];
function startBGM(){stopBGM();const s=.15;let i=0;bgmTimer=setInterval(()=>{const t=AC.currentTime+.02;const l=LEAD[i%LEAD.length],b=BASS[i%BASS.length];if(N[l])beep(“square”,N[l],t,s*.9,.045);if(N[b]&&i%2===0)beep(“triangle”,N[b],t,s1.7,.07);i++;},s1000);}
const FLEAD=[“E5”,“D5”,“C5”,“B4”,“A4”,“G4”,“F4”,“E4”,“E5”,“D5”,“C5”,“B4”,“A4”,“B4”,“C5”,“D5”];
const FBASS=[“A2”,“A2”,“A2”,“A2”,“F3”,“F3”,“F3”,“F3”,“E3”,“E3”,“E3”,“E3”,“A2”,“A2”,“A2”,“A2”];
function startBGMFinal(){stopBGM();const s=.11;let i=0;bgmTimer=setInterval(()=>{const t=AC.currentTime+.02;const l=FLEAD[i%FLEAD.length],b=FBASS[i%FBASS.length];if(N[l])beep(“square”,N[l],t,s*.85,.05);if(N[b])beep(“sawtooth”,N[b],t,s1.3,.06);i++;},s1000);}
const SLEAD=[“E4”,“R”,“D4”,“R”,“C4”,“R”,“B3”,“R”,“A3”,“R”,“B3”,“C4”,“B3”,“R”,“R”,“R”,“G3”,“R”,“A3”,“R”,“B3”,“R”,“C4”,“R”,“B3”,“R”,“A3”,“R”,“G3”,“R”,“R”,“R”];
const SBASS=[“A2”,“R”,“R”,“R”,“F3”,“R”,“R”,“R”,“E3”,“R”,“R”,“R”,“A2”,“R”,“R”,“R”,“G2”,“R”,“R”,“R”,“C3”,“R”,“R”,“R”,“E3”,“R”,“R”,“R”,“A2”,“R”,“R”,“R”];
function startBGMSad(){stopBGM();const s=.34;let i=0;bgmTimer=setInterval(()=>{const t=AC.currentTime+.02;const l=SLEAD[i%SLEAD.length],b=SBASS[i%SBASS.length];if(N[l])beep(“triangle”,N[l],t,s1.6,.06);if(N[b])beep(“sine”,N[b],t,s2.2,.07);i++;},s1000);}
function stopBGM(){if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null;}}
const SFX={hit(){const t=AC.currentTime;beep(“square”,520,t,.07,.12);beep(“square”,260,t+.07,.1,.12);},weak(){const t=AC.currentTime;beep(“square”,330,t,.08,.1);},crit(){const t=AC.currentTime;[660,880,1175,1568].forEach((f,i)=>beep(“square”,f,t+i.07,.12,.13));beep(“sawtooth”,80,t,.4,.12);},hurt(){const t=AC.currentTime;beep(“sawtooth”,120,t,.18,.14);beep(“sawtooth”,90,t+.1,.2,.12);},select(){const t=AC.currentTime;beep(“square”,880,t,.05,.08);}};
let plHP=200,plMax=200,plMP=20,plMpMax=20,bossHP,bossMax,phaseIndex=0;
const SET_HOKEN=[{label:“保険料なんて税金と同じだ！名前を変えてるだけだろう！”,dmg:20,mp:0,crit:false,counter:“厚労省「保険料は 給付と対価関係に\n あります。税とは 別物です」”,counterDmg:8,note:“方向は正しいが「名前の問題」と返されると逃げられる。より鋭い突き方は、OECDが社会保険料を税として分類しているという国際基準を使うこと。区役所が「税金ではない」と言うのは国内法の定義にすぎない。感情論では切られる——数字と国際基準で攻めると同じ主張が何倍も刺さる。”},{label:“国民負担率はほぼ50%。税率だけ報じて保険料増を報じないメディアと同じ構造だ”,dmg:40,mp:3,crit:false,counter:“厚労省「国民負担率には\n 将来の給付も 含まれます…」”,counterDmg:6,note:“令和5年度の国民負担率は46.8%。そのうち社会保険料の占める割合が税よりも大きい。「税率が上がっていない」という説明は、保険料という名の負担増を隠した話だ。可処分所得が毎年確実に削られているのに、増税と言われないために「保険料」という言葉が使われる。五公五民という言葉は決して大げさではない。”},{label:“保険料率変更に国会審議が不要。可決否決なしで毎年上げられるチート構造だ”,dmg:55,mp:4,crit:false,counter:“厚労省「政令・省令の範囲での\n 適切な 運営です…」”,counterDmg:5,note:“健康保険料率や介護保険料率は、国会での可決なしに政令・省令レベルで改定できる仕組みになっている。毎年自動的に上がっても誰も止められない構造だ。源泉徴収（天引き）で引かれるため、実感しにくいまま可処分所得が削られ続ける。財務省の特別会計と同様、民主的統制が効きにくい聖域だ。”},{label:“可処分所得を削れば婚姻率が下がり少子化が加速する。保険料増がその原因だ”,dmg:45,mp:3,crit:false,counter:“厚労省「少子化は 多様な要因が\n ございます。一概には…」”,counterDmg:6,note:“婚姻件数と可処分所得には相関がある。20〜30代の手取りが毎年削られ続ける中で「子どもを産む余裕がない」という判断は合理的だ。「少子化は個人の価値観の問題」と言うのは、保険料増による可処分所得低下という構造的要因から目をそらす答弁にすぎない。少子化対策と言いながら少子化の原因を作り続けている矛盾がある。”},{label:“OECDは社会保険料を税と分類する。「税金ではない」は国内法の言葉遊びだ”,dmg:99,mp:6,crit:true,counter:null,counterDmg:0,note:“OECDの統計では社会保険料（Social Security Contributions）は税収に含めて集計される。だから日本の国民負担率にも保険料が含まれる——含めざるを得ないからだ。「税金ではない」は国内の法律上の定義にすぎず、経済的実態は強制徴収・拒否不能・使途選択不可の負担だ。財務省の意見書と同様、相手の論理が自己矛盾する反論不能のクリティカル。”}];
const SET_ENMEI=[{label:“なんで高齢者ばかり優遇して現役世代から搾取するんだ！”,dmg:20,mp:0,crit:false,counter:“厚労省「高齢者の命も\n 等しく 守られるべきです」”,counterDmg:8,note:“感情的には正しいが「高齢者の命も大切です」と返されると詰まる。より鋭い突き方は、患者を責めるのではなく「やめさせない仕組み」を突くことだ。欧州では85歳以上で自然に腎機能が衰えた場合、緩和ケアを優先するガイドラインが存在する。日本との違いはシステムの設計思想にある——誰かが悪人なのではなく、構造がそう設計されている。”},{label:“日本の透析患者数は人口100万人あたり約2,700人。肥満率が2倍のアメリカの倍近い。これはビジネスの数字だ”,dmg:55,mp:4,crit:false,counter:“厚労省「日本の 医療アクセスが\n 優れている 証拠です…」”,counterDmg:5,note:“国際統計によると日本の透析患者数は人口100万人あたり約2,700人、アメリカは約1,400人。肥満率・糖尿病率はアメリカが圧倒的に高いのに、なぜ日本の方が透析患者が多いのか。一度始めたら法的・商業的に止められない構造と、透析クリニックへの月40万円以上の診療報酬収益が組み合わさった結果だ。医療アクセスの問題ではなく、ビジネスモデルの問題だ。”},{label:“出来高払い診療報酬が延命治療を経済的に有利にしている。治すより長引かせる方が儲かる構造だ”,dmg:45,mp:3,crit:false,counter:“厚労省「診療報酬は\n 適切な医療への 対価です…」”,counterDmg:6,note:“出来高払い制度では、患者が回復するより長期間治療を続けた方が医療機関の収入が増える。年間2兆円規模の特定医療費が保険組合から医療機関へ毎月自動的に振り込まれる安定収益になっている。システムが「人を健康にするため」ではなく「病人をストックして現役世代の財布から合法的に吸い上げるため」に機能しているとさえ言える——これは個人の悪意ではなく、制度の設計の問題だ。”},{label:“医師会への政治献金と診療報酬改定の連動関係を説明しろ。天下りと同じ構造だ”,dmg:50,mp:4,crit:false,counter:“厚労省「献金と 行政判断は\n 別のものです…（目をそらす）」”,counterDmg:5,note:“日本医師会は自民党への組織献金の上位に長年名を連ねてきた。診療報酬改定では医師会の意向が強く反映される構造がある。財務省・特別会計の天下り構造と本質的に同じ「政治献金→政策誘導」のサイクルが、医療費膨張の背景にある。聖域化された領域に切り込む政治家を選ぶことが、この構造を変える唯一の方法だ。”},{label:“現役世代の可処分所得を削り少子化を引き起こしながら少子化対策を語る。原因を作った者が対策を語る二重の欺瞞だ”,dmg:99,mp:6,crit:true,counter:null,counterDmg:0,note:“現役世代の手取りを削る保険料増→婚姻率低下→少子化加速という因果関係は経済データが示している。その一方で、少子化対策として子育て支援金（保険料に上乗せ）を導入する——少子化を引き起こした保険料をさらに増やして少子化対策とする構造だ。財務省の「ハイパーインフレ警告」と同様、相手の論理が自己矛盾している。これが反論不能のクリティカル。”}];
const MAGIC=[{label:”【直接行動】医療費の情報開示を求める市民運動に参加！”,dmg:30,mp:0,crit:false,magic:true,counter:“厚労省「ご意見は\n 真摯に 受け止めます（定型文）」”,counterDmg:10,note:“情報開示請求や市民運動は、問題の可視化に一定の効果がある。ただし厚労省の人事や医師会の利権構造は、選挙で選ばれない人々によって守られている。声を上げることは大切だが、構造を変えるには選挙を通じて政治家への選択圧をかけるしかない——財務省と同じ結論にたどり着く。”}];
const PHASES=[{name:“魔王 厚生労働省（第一形態）”,sub:“保険料という名の迷宮”,hp:160,intro:“魔王・厚生労働省が あらわれた！\n「国民の 健康を 守ります！」”,attacks:[{line:“厚労省のこうげき！\n「保険料は 税金では ありません。\n 社会保険で ございます！」”,dmg:14,set:()=>SET_HOKEN},{line:“厚労省のこうげき！\n「標準治療は 国際的エビデンスに\n 基づいています！」”,dmg:12,set:()=>SET_HOKEN},{line:“厚労省のこうげき！\n「皆保険制度は 日本の誇り！\n 守らなければ なりません！」”,dmg:16,set:()=>SET_HOKEN}],defeat:“魔王・厚生労働省 第一形態は\nくだけちった…！”,next:“奥から ただならぬ気配——\n最終形態「五公五民の砦」が\nたちはだかる！”},{name:“魔王 厚生労働省（最終形態）”,sub:“五公五民の砦”,hp:240,intro:“ゆうしゃは さけんだ——\n「延命ビジネスの 構造を 暴け！」\n厚労省「それは 適切な 医療です。\n 文句があれば 医師会に どうぞ」\n最終決戦の はじまりだ！\n（ここから 直接行動も とれる）”,final:true,attacks:[{line:“厚労省のこうげき！\n「高齢者の命は 等しく\n 守られるべきです！」”,dmg:16,set:()=>SET_ENMEI.concat(MAGIC)},{line:“厚労省のこうげき！\n「医療の進歩により\n 多くの方が 救われています！」”,dmg:15,set:()=>SET_ENMEI.concat(MAGIC)},{line:“厚労省のこうげき！\n「少子化対策を\n 強化して まいります！」”,dmg:18,set:()=>SET_ENMEI.concat(MAGIC)},{line:“厚労省のこうげき！\n「持続可能な 社会保障のために\n 現役世代の ご理解が 必要です！」”,dmg:18,set:()=>SET_ENMEI.concat(MAGIC)},{line:“厚労省のこうげき！\n「社会保障費は\n 財源の 確保が 重要です！」”,dmg:20,set:()=>SET_ENMEI.concat(MAGIC)},{line:“厚労省のこうげき！\n「国民の 健康増進のため\n 全力で 取り組んでいます！」”,dmg:19,set:()=>SET_ENMEI.concat(MAGIC)}]}];

async function playerTurn(c){if(busy)return;if(plMP<c.mp){mpToast();return;}busy=true;SFX.select();if(c.mp>0){plMP-=c.mp;setHP();}cmdsEnabled(false);￼(“msgWin”).scrollIntoView({behavior:“smooth”,block:“start”});const verb=c.magic?“ゆうしゃは 直接行動に でた！\n「”:“ゆうしゃの はんろん！\n「”;await typeText(verb+c.label+”」”);if(c.crit){flash(“flashGold”);SFX.crit();const st=￼(“bossSprite”).classList.add(“bossHit”);￼(“bossSprite”).classList.add(“bossHit”);popDamage(“boss”,String(c.dmg),false);await sleep(450);}￼(“game”).classList.remove(“shake”);bossHP-=c.dmg;setHP();await typeText(c.crit?“クリティカル！ 厚労省は こうべをたれて だまりこんだ…！\n反論の余地が ない！”:“厚労省に “+c.dmg+” のダメージ！”);const pNow=PHASES[phaseIndex];if(pNow.final){if(bossHP<=0){await finalSequence();busy=false;return;}}else if(bossHP<=0){await typeText(pNow.defeat);if(pNow.next)await typeText(pNow.next);if(phaseIndex+1<PHASES.length){startPhase(phaseIndex+1);plMP=Math.min(plMpMax,plMP+15);setHP();await typeText(“形態を 突破した！\n論拠（LP）を 補給した！”);const np=PHASES[phaseIndex];if(np.final)startBGMFinal();await typeText(np.intro);await bossTurn();busy=false;return;}}if(c.counter){await typeText(c.counter+”\nゆうしゃに “+c.counterDmg+” のダメージ！”);plHP-=c.counterDmg;if(pNow.final&&plHP<1)plHP=1;setHP();SFX.hurt();￼(“game”).classList.remove(“shake”);if(plHP<=0){await gameover();busy=false;return;}}showNote(c.note);await bossTurn();busy=false;}
async function bossTurn(){if(plHP<=0){await gameover();return;}const ph=PHASES[phaseIndex];const atks=ph.attacks;currentAttack=atks[Math.floor(Math.random()*atks.length)];await typeText(currentAttack.line);plHP-=currentAttack.dmg;if(ph.final&&plHP<1)plHP=1;setHP();SFX.hurt();flash(“flashWhite”);￼(“game”).classList.remove(“shake”);await typeText(“ゆうしゃは “+currentAttack.dmg+” のダメージを うけた！\n（きれいごとで 攻撃してくる…）”);if(plHP<=0){await gameover();return;}buildCmds(currentAttack.set());cmdsEnabled(true);}
async function finalSequence(){await typeText(“厚労省の HPが ゼロに——！\nやったか……！？”);await sleep(300);await typeText(”……だが 厚労省は たおれない。\n「国民の ために」と つぶやいた——”);await typeText(“厚労省は 呪文\n『国民の 健康のため』を となえた！”);flash(“flashGold”);SFX.crit();let st=￼(“bossSprite”).classList.add(“bossHit”);await sleep(800);st.classList.remove(“stampIn”);bossHP=bossMax;setHP();￼(“game”).classList.add(“shake”);popDamage(“player”,String(x.d),false);await sleep(320);￼(“game”).classList.add(“shake”);await sleep(700);st.classList.remove(“stampIn”);await typeText(“厚労省「——財源が 足りないので\n ご負担を お願いします」”);popDamage(“player”,“9999”,true);flash(“flashWhite”);SFX.hurt();￼(“game”).classList.remove(“shake”);await typeText(“ゆうしゃに 9999の ダメージ！\nゆうしゃは ふらついた……！”);await typeText(“厚労省は とどめの ひとことを\n放った——！”);flash(“flashGold”);SFX.crit();st.textContent=“ひっさつ技”;st.classList.remove(“stampIn”);void st.offsetWidth;st.classList.add(“stampIn”);￼(“game”).classList.add(“shake”);plHP=0;setHP();await sleep(900);$(“game”).classList.remove(“shake”);await typeText(“ゆうしゃに 9999の ダメージ！\nゆうしゃは たおれた……！”);await loseEnding();}
async function loseEnding(){startBGMSad();await typeText(“どんな正論で 殴っても\n官僚機構は たおれなかった。”);await typeText(“医師会も 厚労省も\n選挙では 直接 倒せない。”);await typeText(“変えられるのは\nただ一つ——\n選挙で この構造と 戦う\n政治家を 選ぶことだけ。”);await typeText(“召喚した 政治家が\n裏切っても、\n次の選挙で また\n別の政治家を 召喚すればいい。”);await typeText(“勇者の 本当の武器は\n反論ではなく——\n一票だった。”);showNote(”【結末】医師会・厚労省の利権構造は正論では倒せない。選挙で選ばれない者たちが設計した制度は、選挙でしか変えられない。社会保険料という名の強制徴収は、国会審議を経ずに毎年増やせる設計になっている。変えるには、この構造に切り込む政治家を選挙で選び続けるしかない。\n\nただし、政権交代を一度起こしただけでは緊張感は生まれない。交代が「いつでも起こりうる脅威」として存在し続けて初めて、政治家に規律が働く。大事なのはその脅威が本物であり続ける政権交代の連続性だ。”);const box=￼(“cmds”).classList.remove(“hidden”);}
