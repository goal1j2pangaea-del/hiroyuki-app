lang\")'>"+t("changeLang")+"</button></div>";return}if(screen==="nativeWelcome"){app.innerHTML="<div class='card'><div class='logo'>日本語人</div><div class='by'>by Hiroyuki</div><div class='native-box' style='margin-top:20px'><div style='font-size:22px;margin-bottom:10px'>あれ、日本人？</div><div style='font-size:14px;line-height:2'>このテストは外国人向けだよ。<br>でもせっかくだから1問だけ付き合って。</div></div><button class='btn-primary' onclick='startNativeQuiz()'>1問だけやってみる</button><button class='btn-outline' onclick='alert(\"近日実装予定\")'>スキップ</button></div>";return}if(screen==="nativeQuiz"&&nativeQ){const q=nativeQ;app.innerHTML="<div class='card'><div style='font-size:12px;color:rgba(232,224,240,.4);margin-bottom:16px'>日本語を外国語で説明しよう</div><div class='question'>"+q.q+"</div>"+q.options.map((opt,i)=>"<button class='opt-btn"+(nativeSel===i?(i===q.answer?" correct":" wrong"):"")+"' onclick='pickNative("+i+")' "+(nativeShowEx?"disabled":"")+">"+"<span class='opt-icon'>"+(nativeShowEx?(i===q.answer?"✅":nativeSel===i?"❌":"　"):"　")+"</span>"+opt+"</button>").join("")+(nativeShowEx?"<div class='hint-box'>"+q.hint+"</div><button class='btn-primary' onclick='alert(\"近日実装予定\")'>"+(nativeSel===q.answer?"さすが！":"なるほど！")+"プロフィールへ</button>":"")+"</div>";return}if(screen==="quiz"&&questions.length>0){const q=questions[qIdx];const pct=((qIdx+1)/questions.length)*100;app.innerHTML="<div class='card'><div class='q-header'><span class='q-counter'>"+(qIdx+1)+" / "+questions.length+"</span><div style='display:flex;gap:8px;align-items:center'><span class='level-tag'>"+q.level+"</span><button class='ruby-toggle"+(showRuby?"":" off")+"' onclick='toggleRuby()'>"+(showRuby?t("rubyOn"):t("rubyOff"))+"</button></div></div><div class='progress-bar'><div class='progress-fill' style='width:"+pct+"%'></div></div><div class='question'>"+rubyHTML(q.parts)+"</div>"+q.options.map((opt,i)=>"<button class='opt-btn"+(selected===i?(i===q.answer?" correct":" wrong"):(showEx&&i===q.answer?" correct":""))+"' onclick='pick("+i+")' "+(showEx?"disabled":"")+">"+"<span class='opt-icon'>"+(showEx?(i===q.answer?"✅":selected===i?"❌":"　"):"　")+"</span>"+opt+"</button>").join("")+(showEx?"<div class='explain-box'>"+t("tip")+"  "+(q.ex[lang]||q.ex.en)+"</div><button class='btn-primary' onclick='next()'>"+(qIdx+1>=questions.length?t("seeResult"):t("nextQ"))+"</button>":"")+"</div>";return}if(screen==="result"&&result){app.innerHTML="<div class='card'><div class='result-icon'>"+(result.passed?"🎉":"📚")+"</div><div class='result-label'>"+t("result")+"</div><div class='result-level' style='background:"+(result.passed?"linear-gradient(135deg,#f0a500,#e040fb)":"linear-gradient(135deg,#ff5252,#ff1744)")+";-webkit-background-clip:text;-webkit-text-fill-color:transparent'>"+result.level+"</div><div class='result-score'>"+result.score+" / "+result.total+" "+t("correctWord")+"</div><div class='result-box "+(result.passed?"pass":"fail")+"'>"+(result.passed?t("passed"):t("rejected"))+"</div>"+(result.passed?"<button class='btn-primary' onclick='alert(\"近日実装予定\")'>プロフィール設定へ</button>":"")+"<button class='btn-outline' onclick='startQuiz()'>"+t("retake")+"</button><button class='btn-outline' onclick='go(\"lang\")'>"+t("changeLang")+"</button></div>";return}}function setLang(code){lang=code;render()}function toggleRuby(){showRuby=!showRuby;render()}render();</script></body></html>
