<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KOUROU QUEST</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background:#06060e;
    color:#f5f5f0;
    font-family:'DotGothic16','Hiragino Kaku Gothic ProN',monospace;
    display:flex; justify-content:center;
    min-height:100vh;
    overflow-y:auto;
  }
  #game {
    width:100%; max-width:430px;
    min-height:100vh;
    display:flex; flex-direction:column;
    padding:10px 10px 24px;
    position:relative;
  }
  #scan {
    position:fixed; inset:0; pointer-events:none; z-index:50;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
  }
  .hidden { display:none !important; }
  .win {
    background:#06060e;
    border:3px solid #f5f5f0;
    border-radius:6px;
    box-shadow:0 0 0 3px #06060e, 0 0 0 5px #f5f5f0;
    padding:12px 14px;
  }
  #title {
    flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:26px;
    text-align:center; min-height:80vh;
  }
  #title h1 {
    font-size:34px; letter-spacing:4px; line-height:1.4;
    color:#0d9488;
    text-shadow:3px 3px 0 #065f46, 6px 6px 0 #000;
  }
  #title .sub { font-size:14px; color:#9aa0c0; letter-spacing:2px; }
  #startBtn {
    font-family:inherit; font-size:18px; letter-spacing:3px;
    color:#f5f5f0; background:#06060e; border:3px solid #f5f5f0; border-radius:6px;
    padding:14px 34px; cursor:pointer;
    box-shadow:0 0 0 3px #06060e,0 0 0 5px #f5f5f0;
    animation:blink 1.2s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity:.35; } }
  #title .note { font-size:11px; color:#666c8f; line-height:1.9; }
  #battle { flex:1; display:flex; flex-direction:column; gap:10px; }
  #bossArea {
    position:relative;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:14px 0 6px;
    background:radial-gradient(ellipse at 50% 80%, #042f2e 0%, #06060e 70%);
    border-radius:8px;
  }
  #bossName { font-size:15px; letter-spacing:2px; color:#6ee7b7; }
  #bossSprite { image-rendering:pixelated; position:relative; }
  #bossSprite .px { position:absolute; width:1px; height:1px; }
  .bossbar { width:200px; }
  .hpRow { display:flex; align-items:center; gap:8px; font-size:12px; }
  .hpShell { flex:1; height:12px; border:2px solid #f5f5f0; border-radius:3px; background:#111; overflow:hidden; }
  .hpFill { height:100%; transition:width .45s steps(8); }
  #bossHpFill { background:linear-gradient(#f87171,#b91c1c); width:100%; }
  #plHpFill { background:linear-gradient(#86efac,#15803d); width:100%; }
  .hpNum { min-width:64px; text-align:right; font-size:12px; }
  #playerBar { display:flex; flex-direction:column; gap:6px; padding:10px 12px; position:relative; }
  #playerBar .who { font-size:13px; color:#fbbf24; letter-spacing:1px; margin-bottom:2px; }
  #playerBar .statRow { display:flex; align-items:center; gap:8px; }
  #playerBar .barLbl { font-size:12px; letter-spacing:1px; width:24px; }
  #playerBar .hpShell { flex:1; }
  #playerBar .hpNum { min-width:74px; font-size:12px; }
  #plMpFill { background:linear-gradient(#7dd3fc,#2563eb); width:100%; }
  #mpToast {
    position:fixed; top:42%; left:50%; transform:translate(-50%,-50%) scale(0);
    z-index:72; background:#06060e; border:3px solid #f87171; border-radius:6px;
    box-shadow:0 0 0 3px #06060e,0 0 0 5px #f87171;
    color:#fecaca; font-size:18px; letter-spacing:3px; padding:14px 26px; pointer-events:none;
  }
  .toastIn { animation:toast 1.1s ease-out forwards; }
  @keyframes toast { 0%{transform:translate(-50%,-50%) scale(0)} 15%{transform:translate(-50%,-50%) scale(1.1)} 30%{transform:translate(-50%,-50%) scale(1)} 80%{transform:translate(-50%,-50%) scale(1); opacity:1} 100%{transform:translate(-50%,-50%) scale(1); opacity:0} }
  .cmd .mpcost { color:#7dd3fc; font-size:12px; }
  #msgWin { min-height:110px; font-size:15px; line-height:1.8; letter-spacing:1px; position:relative; cursor:pointer; user-select:none; }
  #msgText { white-space:pre-wrap; }
  #nextCursor {
    position:absolute; right:12px; bottom:6px; font-size:14px; color:#ffd23f;
    animation:blink 1s steps(2) infinite;
  }
  #noteWin {
    border-color:#6ee7b7;
    box-shadow:0 0 0 3px #06060e,0 0 0 5px #6ee7b7;
    font-size:13px; line-height:1.8; color:#ccfbf1;
  }
  #noteWin .tag { color:#6ee7b7; font-size:12px; letter-spacing:2px; display:block; margin-bottom:4px; }
  #cmds { display:flex; flex-direction:column; gap:8px; }
  .cmdLabel { font-size:12px; color:#9aa0c0; letter-spacing:2px; padding-left:4px; }
  .cmd {
    font-family:inherit; text-align:left;
    font-size:13.5px; line-height:1.55; letter-spacing:.5px;
    color:#f5f5f0; background:#0c0c1c;
    border:2px solid #f5f5f0; border-radius:5px;
    padding:10px 12px 10px 30px; cursor:pointer; position:relative;
  }
  .cmd::before { content:"▶"; position:absolute; left:10px; color:#ffd23f; opacity:0; }
  .cmd:active { background:#04312e; }
  .cmd:active::before { opacity:1; }
  .cmd:disabled { opacity:.45; }
  @keyframes shake { 0%,100%{transform:translate(0)} 20%{transform:translate(-7px,2px)} 40%{transform:translate(6px,-2px)} 60%{transform:translate(-5px,1px)} 80%{transform:translate(4px,-1px)} }
  .shake { animation:shake .35s linear; }
  @keyframes bossflash { 0%,100%{filter:none} 50%{filter:brightness(8) saturate(0)} }
  .bossHit { animation:bossflash .18s linear 2; }
  #flash { position:fixed; inset:0; pointer-events:none; z-index:60; opacity:0; }
  .flashWhite { background:#fff; animation:fl .25s linear; }
  .flashGold  { background:#0d9488; animation:fl .6s linear; }
  @keyframes fl { 0%{opacity:.9} 100%{opacity:0} }
  #critStamp {
    position:fixed; top:32%; left:50%; z-index:70;
    transform:translate(-50%,-50%) rotate(-8deg) scale(0);
    font-size:42px; letter-spacing:6px; color:#ffd23f;
    text-shadow:3px 3px 0 #065f46, 6px 6px 0 #000;
    pointer-events:none;
  }
  .stampIn { animation:stamp .9s cubic-bezier(.2,2.4,.4,1) forwards; }
  @keyframes stamp { 0%{transform:translate(-50%,-50%) rotate(-8deg) scale(0)} 60%{transform:translate(-50%,-50%) rotate(-8deg) scale(1.25)} 100%{transform:translate(-50%,-50%) rotate(-8deg) scale(1)} }
  .dmgPop {
    position:absolute; z-index:40;
    font-size:27px; color:#ffffff; font-weight:bold; letter-spacing:1px;
    text-shadow:-2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 4px 0 #000;
    pointer-events:none;
    animation:pop 1.1s ease-out forwards;
  }
  .dmgPop.crit { color:#ffd23f; font-size:34px; }
  @keyframes pop { 0%{opacity:0; transform:translateY(8px)} 20%{opacity:1} 100%{opacity:0; transform:translateY(-36px)} }
  @media (prefers-reduced-motion: reduce){
    .shake,.bossHit,.stampIn,.flashWhite,.flashGold,.dmgPop,#startBtn,#nextCursor { animation:none !important; }
  }
</style>
</head>
<body>
<div id="game">
  <div id="title">
    <div>
      <div class="sub">— 完全版 —</div>
      <h1>KOUROU<br>QUEST</h1>
      <div class="sub" style="margin-top:10px">妖怪・厚生労働省を 論破せよ</div>
    </div>
    <button id="startBtn">▶ 戦闘開始</button>
    <div class="note">※ボタンを押すとBGMが流れます<br>※強い反論はLP（ロジックポイント）を消費</div>
  </div>
  <div id="battle" class="hidden">
    <div id="bossArea">
      <div id="bossName">妖怪 厚生労働省（第一形態）</div>
      <div id="bossSub" style="font-size:12px;color:#6ee7b7;letter-spacing:1px;margin-top:-2px">— 保険料という名の迷宮 —</div>
      <div id="bossSprite"></div>
      <div class="hpRow bossbar">
        <div class="hpShell"><div id="bossHpFill" class="hpFill"></div></div>
        <div class="hpNum" id="bossHpNum"></div>
      </div>
    </div>
    <div id="playerBar" class="win">
      <div class="who">納税者（勇者）</div>
      <div class="statRow">
        <span class="barLbl" style="color:#fbbf24">HP</span>
        <div class="hpShell"><div id="plHpFill" class="hpFill"></div></div>
        <span class="hpNum" id="plHpNum"></span>
      </div>
      <div class="statRow">
        <span class="barLbl" style="color:#7dd3fc">LP</span>
        <div class="hpShell"><div id="plMpFill" class="hpFill"></div></div>
        <span class="hpNum" id="plMpNum"></span>
      </div>
    </div>
    <div id="msgWin" class="win">
      <div id="msgText"></div>
      <div id="nextCursor" class="hidden">▼</div>
    </div>
    <div id="noteWin" class="win hidden">
      <span class="tag">▼ かいせつ</span>
      <div id="noteText"></div>
    </div>
    <div id="cmds" class="hidden">
      <div class="cmdLabel" id="cmdLabel">▼ どう はんろんする？（すべて正解。威力がちがう）</div>
      <div id="cmdBtns"></div>
    </div>
  </div>
  <div id="scan"></div>
  <div id="flash"></div>
  <div id="critStamp">はんろんふのう！</div>
  <div id="mpToast">LPが たりない！</div>
</div>
<script>
"use strict";
const PAL = { T:"#0d9488", C:"#bbf7d0", F:"#374151", W:"#f5f5f0", K:"#000",
              R:"#ef4444", G:"#fbbf24" };
const SPRITE = [
"..R..........R..",
".RT..........TR.",
"..TTTTTTTTTTTT..",
".TTTFFTTTTTFFTT.",
".TTFFWWTTWWFFTT.",
".TTFGWWTTWWGFTT.",
".TTTTTTTTTTTTTT.",
"..TTTKKKKKKTTT..",
"...TTTTTTTTTT...",
"..CCCCCWWCCCCC..",
".CCCCCWRRWCCCCC.",
".CCCCCWRRWCCCCC.",
".CCCCCCRRCCCCCC.",
".CCCCCCRRCCCCCC.",
".CCC.CCCCCC.CCC.",
"................" ];
function drawBoss(scale){
  const host = document.getElementById("bossSprite");
  host.style.width  = 16*scale+"px";
  host.style.height = 16*scale+"px";
  let shadows = [];
  SPRITE.forEach((row,y)=>{
    [...row].forEach((c,x)=>{
      if(PAL[c]) shadows.push(`${x*scale}px ${y*scale}px 0 ${scale/2}px ${PAL[c]}`);
    });
  });
  const px = document.createElement("div");
  px.className="px";
  px.style.boxShadow = shadows.join(",");
  host.appendChild(px);
}
drawBoss(7);

let AC=null, bgmTimer=null, master=null;
function audioInit(){
  AC = new (window.AudioContext||window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value=.9; master.connect(AC.destination);
}
function beep(type,freq,t0,dur,vol){
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t0);
  g.gain.setValueAtTime(vol,t0);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0+dur+.02);
}
const N={A2:110,C3:130.8,D3:146.8,E3:164.8,F3:174.6,G3:196,
         A3:220,C4:261.6,D4:293.7,E4:329.6,F4:349.2,G4:392,
         A4:440,B4:493.9,C5:523.3,D5:587.3,E5:659.3,B3:246.9,G2:98,R:0};
const LEAD=["E4","R","G4","E4","A4","R","G4","F4","E4","R","G4","E4","B4","R","A4","R",
            "E4","R","G4","E4","C5","R","B4","A4","G4","F4","E4","D4","E4","R","R","R"];
const BASS=["A2","A2","A2","A2","F3","F3","F3","F3","E3","E3","E3","E3","A2","A2","A2","A2",
            "A2","A2","A2","A2","F3","F3","F3","F3","C3","C3","E3","E3","A2","A2","A2","A2"];
function startBGM(){
  stopBGM();
  const stepDur = .15; let step=0;
  bgmTimer = setInterval(()=>{
    const t = AC.currentTime+.02;
    const l = LEAD[step%LEAD.length], b = BASS[step%BASS.length];
    if(N[l]) beep("square",  N[l], t, stepDur*.9, .045);
    if(N[b] && step%2===0) beep("triangle",N[b], t, stepDur*1.7, .07);
    step++;
  }, stepDur*1000);
}
const FLEAD=["E5","D5","C5","B4","A4","G4","F4","E4","E5","D5","C5","B4","A4","B4","C5","D5"];
const FBASS=["A2","A2","A2","A2","F3","F3","F3","F3","E3","E3","E3","E3","A2","A2","A2","A2"];
const Nx={F5:698.5}; Object.assign(N,Nx);
function startBGMFinal(){
  stopBGM();
  const stepDur=.11; let step=0;
  bgmTimer=setInterval(()=>{
    const t=AC.currentTime+.02;
    const l=FLEAD[step%FLEAD.length], b=FBASS[step%FBASS.length];
    if(N[l]) beep("square",N[l],t,stepDur*.85,.05);
    if(N[b]) beep("sawtooth",N[b],t,stepDur*1.3,.06);
    step++;
  }, stepDur*1000);
}
const SLEAD=["E4","R","D4","R","C4","R","B3","R","A3","R","B3","C4","B3","R","R","R",
             "G3","R","A3","R","B3","R","C4","R","B3","R","A3","R","G3","R","R","R"];
const SBASS=["A2","R","R","R","F3","R","R","R","E3","R","R","R","A2","R","R","R",
             "G2","R","R","R","C3","R","R","R","E3","R","R","R","A2","R","R","R"];
function startBGMSad(){
  stopBGM();
  const stepDur=.34; let step=0;
  bgmTimer=setInterval(()=>{
    const t=AC.currentTime+.02;
    const l=SLEAD[step%SLEAD.length], b=SBASS[step%SBASS.length];
    if(N[l]) beep("triangle",N[l],t,stepDur*1.6,.06);
    if(N[b]) beep("sine",N[b],t,stepDur*2.2,.07);
    step++;
  }, stepDur*1000);
}
function stopBGM(){ if(bgmTimer){clearInterval(bgmTimer); bgmTimer=null;} }
const SFX = {
  hit(){    const t=AC.currentTime; beep("square",520,t,.07,.12); beep("square",260,t+.07,.1,.12); },
  weak(){   const t=AC.currentTime; beep("square",330,t,.08,.1); },
  crit(){   const t=AC.currentTime;
            [660,880,1175,1568].forEach((f,i)=>beep("square",f,t+i*.07,.12,.13));
            beep("sawtooth",80,t,.4,.12); },
  hurt(){   const t=AC.currentTime; beep("sawtooth",120,t,.18,.14); beep("sawtooth",90,t+.1,.2,.12); },
  win(){    stopBGM(); const t=AC.currentTime;
            [523,659,784,1047,784,1047].forEach((f,i)=>beep("square",f,t+i*.13,.18,.12)); },
  select(){ const t=AC.currentTime; beep("square",880,t,.05,.08); }
};

let plHP=200, plMax=200, plMP=20, plMpMax=20;
let bossHP, bossMax;
let phaseIndex=0;

const SET_HOKEN = [
 { label:"保険料なんて税金と同じだ！名前を変えてるだけだろう！",
   dmg:20, mp:0, crit:false,
   counter:"厚労省「保険料は 給付と対価関係に\n あります。税とは 別物です」",
   counterDmg:8,
   note:"方向は正しいが「名前の問題」と返されると逃げられる。より鋭い突き方は、OECDが社会保険料を税として分類しているという国際基準を使うこと。区役所が「税金ではない」と言うのは国内法の定義にすぎない。感情論では切られる——数字と国際基準で攻めると同じ主張が何倍も刺さる。" },
 { label:"国民負担率はほぼ50%。税率だけ報じて保険料増を報じないメディアと同じ構造だ",
   dmg:40, mp:3, crit:false,
   counter:"厚労省「国民負担率には\n 将来の給付も 含まれます…」",
   counterDmg:6,
   note:"令和5年度の国民負担率は46.8%。そのうち社会保険料の占める割合が税よりも大きい。「税率が上がっていない」という説明は、保険料という名の負担増を隠した話だ。可処分所得が毎年確実に削られているのに、増税と言われないために「保険料」という言葉が使われる。五公五民という言葉は決して大げさではない。" },
 { label:"控除の撤廃や縮小も実質増税だ。税率を上げずに負担だけ増やす手口だ",
   dmg:40, mp:3, crit:false,
   counter:"厚労省「税制改正は\n 財務省の所管でして…」",
   counterDmg:6,
   note:"基礎控除や配偶者控除などの縮小は、税率を一切上げなくても課税対象額を増やすので実質的な増税になる。メディアは「税率据え置き」とだけ報じがちで、控除縮小による負担増は見えにくい。保険料増と同じく、痛みを感じさせずに搾り取る設計の一部だ。" },
 { label:"保険料率変更に国会審議が不要。可決否決なしで毎年上げられるチート構造だ",
   dmg:55, mp:4, crit:false,
   counter:"厚労省「政令・省令の範囲での\n 適切な 運営です…！」",
   counterDmg:5,
   note:"健康保険料率や介護保険料率は、国会での可決なしに政令・省令レベルで改定できる仕組みになっている。毎年自動的に上がっても誰も止められない構造だ。源泉徴収（天引き）で引かれるため、実感しにくいまま可処分所得が削られ続ける。財務省の特別会計と同様、民主的統制が効きにくい聖域だ。" },
 { label:"OECDは社会保険料を税と分類する。「税金ではない」は国内法の言葉遊びだ",
   dmg:99, mp:6, crit:true,
   counter:null, counterDmg:0,
   note:"OECDの統計では社会保険料（Social Security Contributions）は税収に含めて集計される。だから日本の国民負担率にも保険料が含まれる——含めざるを得ないからだ。「税金ではない」は国内の法律上の定義にすぎず、経済的実態は強制徴収・拒否不能・使途選択不可の負担だ。財務省の意見書と同様、相手の論理が自己矛盾する反論不能のクリティカル。" },
];

const SET_TOKUBETSU = [
 { label:"なんで高齢者ばかり優遇して現役世代から搾取するんだ！",
   dmg:30, mp:0, crit:false,
   counter:"厚労省「高齢者の命も\n 等しく 守られるべきです」",
   counterDmg:6,
   note:"感情的には正しいが「高齢者の命も大切です」と返されると詰まる。怒りの矛先は患者ではなくシステムに向けるべきだ。欧州では高齢で自然に臓器が衰えた場合、無理な延命より緩和ケアを優先するガイドラインがある。日本との違いは医療制度の設計思想にある——誰かが悪人なのではなく、構造がそう設計されている。ここを突くと相手は防御に回る。" },
 { label:"80代以上の特定疾病認定で患者負担は月1〜2万円。残り数百万円は現役世代の保険料だ。受益者と負担者が完全に分離している",
   dmg:55, mp:4, crit:false,
   counter:"厚労省「高額療養費制度は\n セーフティネットです…！」",
   counterDmg:5,
   note:"批判の本丸はここ。特定疾病療養（人工透析・血友病等）の認定を受けると患者の自己負担上限は月1〜2万円に抑えられる。一方で年間数百万円かかる医療費の大半は現役世代の保険料で穴埋めされる。延命の受益者と費用の負担者が完全に分離した構造だ。『老人優遇』という感情論ではなく『負担者と受益者の分離』を突けば逃げ場がない。厚労省が最も触れられたくない論点。" },
 { label:"出来高払い診療報酬が延命治療を経済的に有利にしている。治すより長引かせる方が儲かる構造だ",
   dmg:45, mp:3, crit:false,
   counter:"厚労省「診療報酬は\n 適切な医療への 対価です…！」",

   attacks:[

     {line:"厚労省のこうげき！\n「標準治療は 国際的エビデンスに\n 基づいています！」", dmg:12, set:()=>SET_HOKEN},
     {line:"厚労省のこうげき！\n「皆保険制度は 日本の誇り！\n 守らなければ なりません！」", dmg:16, set:()=>SET_HOKEN},

   final:true,

     {line:"厚労省のこうげき！\n「医療の進歩により\n 多くの方が 救われています！」", dmg:15, set:()=>SET_TOKUBETSU.concat(MAGIC)},
     {line:"厚労省のこうげき！\n「少子化対策を\n 強化して まいります！」", dmg:18, set:()=>SET_TOKUBETSU.concat(MAGIC)},

     {line:"厚労省のこうげき！\n「社会保障費は\n 財源の 確保が 重要です！」", dmg:20, set:()=>SET_TOKUBETSU.concat(MAGIC)},
     {line:"厚労省のこうげき！\n「国民の 健康増進のため\n 全力で 取り組んでいます！」", dmg:19, set:()=>SET_TOKUBETSU.concat(MAGIC)},

const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function setHP(){
  $("bossHpFill").style.width = Math.max(0,bossHP/bossMax*100)+"%";
  $("plHpFill").style.width   = Math.max(0,plHP/plMax*100)+"%";
  $("bossHpNum").textContent = `${Math.max(0,bossHP)}/${bossMax}`;
  $("plHpNum").textContent   = `HP ${Math.max(0,plHP)}/${plMax}`;
  $("plMpFill").style.width   = Math.max(0,plMP/plMpMax*100)+"%";
  $("plMpNum").textContent   = `LP ${Math.max(0,plMP)}/${plMpMax}`;
}

let typing=false, skipReq=false, tapResolver=null;
$("msgWin").addEventListener("pointerdown",()=>{
  if(typing){ skipReq=true; }
  else if(tapResolver){ const r=tapResolver; tapResolver=null; r(); }
});
async function typeText(str){
  $("nextCursor").classList.add("hidden");
  typing=true; skipReq=false;
  const el=$("msgText"); el.textContent="";
  for(const ch of str){ if(skipReq){ el.textContent=str; break; } el.textContent+=ch; await sleep(24); }
  typing=false;
  $("nextCursor").classList.remove("hidden");
  if(AC) SFX.select();
  await new Promise(r=>{ tapResolver=r; });
  $("nextCursor").classList.add("hidden");
}

function flash(cls){ const f=$("flash"); f.className=""; void f.offsetWidth; f.classList.add(cls); }
function popDamage(target,text,isCrit){
  const host=target==="boss"?$("bossArea"):$("playerBar");
  const d=document.createElement("div");
  d.className="dmgPop"+(isCrit?" crit":""); d.textContent=text;
  d.style.left=(38+Math.random()*26)+"%"; d.style.top=target==="boss"?"38%":"-30px";
  host.appendChild(d); setTimeout(()=>d.remove(),1250);
}
function buildCmds(set){
  const box=$("cmdBtns"); box.innerHTML="";
  set.forEach(c=>{
    const b=document.createElement("button"); b.className="cmd";
    const tag = c.mp>0 ? `　<span class="mpcost">［LP${c.mp}］</span>` : "";
    b.innerHTML=c.label+tag; b.onclick=()=>playerTurn(c); box.appendChild(b);
  });
  box.style.display="flex"; box.style.flexDirection="column"; box.style.gap="8px";
}
function cmdsEnabled(on){
  $("cmds").classList.toggle("hidden",!on);
  document.querySelectorAll(".cmd").forEach(b=>b.disabled=!on);
  if(on) setTimeout(()=>$("cmds").scrollIntoView({behavior:"smooth",block:"end"}),60);
}
function showNote(text){ $("noteText").textContent=text; $("noteWin").classList.remove("hidden"); }
function mpToast(){
  const t=$("mpToast"); t.classList.remove("toastIn"); void t.offsetWidth; t.classList.add("toastIn");
  if(AC){ const n=AC.currentTime; beep("square",180,n,.12,.12); beep("square",140,n+.1,.14,.12); }
}

let busy=false, currentAttack=null;

function startPhase(idx){
  phaseIndex=idx; const p=PHASES[idx];
  bossHP=p.hp; bossMax=p.hp;
  $("bossName").textContent=p.name;
  if($("bossSub")) $("bossSub").textContent="— "+p.sub+" —";
  setHP();
}

async function playerTurn(c){
  if(busy) return;
  if(plMP<c.mp){ mpToast(); return; }
  busy=true; SFX.select();
  if(c.mp>0){ plMP-=c.mp; setHP(); }
  cmdsEnabled(false); $("noteWin").classList.add("hidden");
  $("msgWin").scrollIntoView({behavior:"smooth",block:"start"});
  const verb = c.magic ? "ゆうしゃは 直接行動に でた！\n「" : "ゆうしゃの はんろん！\n「";
  await typeText(verb+c.label+"」");
  if(c.crit){
    flash("flashGold"); SFX.crit();
    const st=$("critStamp"); st.classList.remove("stampIn"); void st.offsetWidth; st.classList.add("stampIn");
    $("bossSprite").classList.add("bossHit"); $("game").classList.add("shake");
    popDamage("boss",c.dmg+"!!",true); await sleep(950); st.classList.remove("stampIn");
  }else{
    flash("flashWhite"); (c.dmg>=45?SFX.hit:SFX.weak)();
    $("bossSprite").classList.add("bossHit"); popDamage("boss",String(c.dmg),false); await sleep(450);
  }
  $("bossSprite").classList.remove("bossHit"); $("game").classList.remove("shake");
  bossHP-=c.dmg; setHP();
  await typeText(c.crit?"クリティカル！ 厚労省は こうべをたれて だまりこんだ…！\n反論の余地が ない！":"厚労省に "+c.dmg+" のダメージ！");
  const pNow=PHASES[phaseIndex];
  if(pNow.final){
    if(bossHP<=0){ await finalSequence(); busy=false; return; }
  }else if(bossHP<=0){
    await typeText(pNow.defeat);
    if(pNow.next) await typeText(pNow.next);
    if(phaseIndex+1<PHASES.length){
      startPhase(phaseIndex+1);
      plMP=Math.min(plMpMax,plMP+15); setHP();
      await typeText("形態を 突破した！\n論拠（LP）を 補給した！");
      const np=PHASES[phaseIndex];
      if(np.final) startBGMFinal();
      await typeText(np.intro); await bossTurn(); busy=false; return;
    }
  }
  if(c.counter){
    await typeText(c.counter+"\nゆうしゃに "+c.counterDmg+" のダメージ！");
    plHP-=c.counterDmg;
    if(pNow.final&&plHP<1) plHP=1;
    setHP(); SFX.hurt(); $("game").classList.add("shake"); popDamage("player",String(c.counterDmg),false);
    await sleep(400); $("game").classList.remove("shake");
    if(plHP<=0){ await gameover(); busy=false; return; }
  }
  showNote(c.note); await bossTurn(); busy=false;
}

async function bossTurn(){
  if(plHP<=0){ await gameover(); return; }
  const ph=PHASES[phaseIndex]; const atks=ph.attacks;
  currentAttack=atks[Math.floor(Math.random()*atks.length)];
  await typeText(currentAttack.line);
  plHP-=currentAttack.dmg;
  if(ph.final&&plHP<1) plHP=1;
  setHP(); SFX.hurt(); flash("flashWhite"); $("game").classList.add("shake");
  popDamage("player",String(currentAttack.dmg),false);
  await sleep(420); $("game").classList.remove("shake");
  await typeText("ゆうしゃは "+currentAttack.dmg+" のダメージを うけた！\n（きれいごとで 攻撃してくる…）");
  if(plHP<=0){ await gameover(); return; }
  buildCmds(currentAttack.set()); cmdsEnabled(true);
}

async function finalSequence(){
  await typeText("厚労省の HPが ゼロに——！\nやったか……！？");
  await sleep(300);
  await typeText("……だが 厚労省は たおれない。\n「国民の ために」と つぶやいた——");
  await typeText("厚労省は 呪文\n『国民の 健康のため』を となえた！");
  flash("flashGold"); SFX.crit();
  let st=$("critStamp"); st.textContent="国民の健康"; st.classList.remove("stampIn"); void st.offsetWidth; st.classList.add("stampIn");
  $("bossSprite").classList.add("bossHit");
  await sleep(800); st.classList.remove("stampIn");
  bossHP=bossMax; setHP();
  $("bossSprite").classList.remove("bossHit");
  await typeText("厚労省の HPが 全回復した！\n（正論では 倒せない……！）");
  await typeText("厚労省は 本性を あらわした！\nテンプレ答弁の 猛攻——！");
  const temps=[
    {t:"厚労省「財源が 足りません！」", d:22},
    {t:"厚労省「高齢化が 進んでいます！」", d:24},
    {t:"厚労省「国際水準の 医療です！」", d:23},
    {t:"厚労省「持続可能な 制度のために！」", d:25},
    {t:"厚労省「国民皆保険を 守ります！」", d:26},
  ];
  for(const x of temps){
    await typeText(x.t);
    plHP-=x.d; if(plHP<1) plHP=1; setHP();
    SFX.hurt(); flash("flashWhite"); $("game").classList.add("shake");
    popDamage("player",String(x.d),false);
    await sleep(320); $("game").classList.remove("shake");
  }
  await typeText("ゆうしゃは ぼろぼろだ……！\nもう 立っているのが やっと——");
  await typeText("厚労省は 切り札を 抜いた——！");
  flash("flashGold"); SFX.crit();
  st.textContent="ひっさつ技"; st.classList.remove("stampIn"); void st.offsetWidth; st.classList.add("stampIn");
  $("game").classList.add("shake");
  await sleep(700); st.classList.remove("stampIn");
  await typeText("厚労省「——財源が 足りないので\n ご負担を お願いします」");
  popDamage("player","9999",true);
  flash("flashWhite"); SFX.hurt(); $("game").classList.add("shake");
  plHP=1; setHP();
  await sleep(900); $("game").classList.remove("shake");
  await typeText("ゆうしゃに 9999の ダメージ！\nゆうしゃは ふらついた……！");
  await typeText("厚労省は とどめの ひとことを\n放った——！");
  flash("flashGold"); SFX.crit();
  st.textContent="ひっさつ技"; st.classList.remove("stampIn"); void st.offsetWidth; st.classList.add("stampIn");
  $("game").classList.add("shake");
  await sleep(700); st.classList.remove("stampIn");
  await typeText("厚労省「——これは すべて\n 持続可能な 社会保障の\n ためです」");
  popDamage("player","9999",true);
  flash("flashWhite"); SFX.hurt(); $("game").classList.add("shake");
  plHP=0; setHP();
  await sleep(900); $("game").classList.remove("shake");
  await typeText("ゆうしゃに 9999の ダメージ！\nゆうしゃは たおれた……！");
  await loseEnding();
}

async function loseEnding(){
  startBGMSad();
  await typeText("どんな正論で 殴っても\n官僚機構は たおれなかった。");
  await typeText("医師会も 厚労省も\n選挙では 直接 倒せない。");
  await typeText("変えられるのは\nただ一つ——\n選挙で この構造と 戦う\n政治家を 選ぶことだけ。");
  await typeText("召喚した 政治家が\n裏切っても、\n次の選挙で また\n別の政治家を 召喚すればいい。");
  await typeText("勇者の 本当の武器は\n反論ではなく——\n一票だった。");
  showNote("【結末】医師会・厚労省の利権構造は正論では倒せない。選挙で選ばれない者たちが設計した制度は、選挙でしか変えられない。社会保険料という名の強制徴収は、国会審議を経ずに毎年増やせる設計になっている。変えるには、この構造に切り込む政治家を選挙で選び続けるしかない。\n\nカギは、政権交代の『連続性』だ。多くの人が見落としているのはここだ。野党は政権を取るまでは威勢のいい公約を掲げ、いざ与党になると果たさない。かつての与党も、下野すれば同じことを言い出す。そしてそれを監視しない国民。だからこそ、政権交代が『いつでも起こりうる』状態が続くことに意味がある。一度きりの交代では誰も緊張しない。交代が連続して起こりうるという脅威だけが、与党と野党の両方に規律を強いる。『支持する政党がない』のではない——政権交代が起こり続けること自体が目的なのだ。");
  const box=$("cmdBtns"); box.innerHTML="";
  const b=document.createElement("button");
  b.className="cmd"; b.style.textAlign="center"; b.style.paddingLeft="12px";
  b.textContent="▶ もう一度 挑戦する（投票に行く）";
  b.onclick=()=>location.reload();
  box.appendChild(b);
  $("cmds").classList.remove("hidden");
}

async function gameover(){
  stopBGM();
  await typeText("ゆうしゃは ちからつきた…\n保険料の 重さに つぶされた…");
  showNote("ゲームオーバー。だが本当の戦いは投票所にある。下のボタンで再挑戦できます。");
  const box=$("cmdBtns"); box.innerHTML="";
  const b=document.createElement("button");
  b.className="cmd"; b.style.textAlign="center"; b.style.paddingLeft="12px";
  b.textContent="▶ もう一度 挑戦する";
  b.onclick=()=>location.reload();
  box.appendChild(b);
  $("cmds").classList.remove("hidden");
}

$("startBtn").onclick=async()=>{
  audioInit();
  if(AC.state==="suspended") await AC.resume();
  startBGM();
  $("title").classList.add("hidden");
  $("battle").classList.remove("hidden");
  startPhase(0);
  await typeText(PHASES[0].intro);
  await bossTurn();
};
</script>
