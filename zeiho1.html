
<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"><title>資本家検定3級 by Hiroyuki</title><link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet"><style>:root{--green:#059669;--dark:#030a05;--cream:#f0fff4;--gold:#c8a84b;--gray:#111a13;--light-gray:#1a2e1c;}*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}body{background:var(--dark);min-height:100vh;font-family:'Zen Kaku Gothic New',sans-serif;color:var(--cream);overflow-x:hidden;}#splash{position:fixed;inset:0;background:var(--dark);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity 0.8s;}.splash-icon{font-size:4rem;margin-bottom:1rem;animation:bounce 1s ease-in-out infinite alternate;}@keyframes bounce{from{transform:translateY(0);}to{transform:translateY(-12px);}}.splash-title{font-family:'Noto Serif JP',serif;font-size:clamp(1.8rem,8vw,3.5rem);font-weight:700;color:#fff;text-align:center;line-height:1.3;}.splash-title span{color:#34d399;}.splash-warning{margin-top:1rem;padding:0.6rem 1.2rem;background:rgba(5,150,105,0.15);border:1px solid rgba(52,211,153,0.3);border-radius:6px;font-size:0.72rem;color:#34d399;letter-spacing:0.15em;text-align:center;}.splash-credit{font-size:0.7rem;color:rgba(240,255,244,0.35);letter-spacing:0.2em;margin-top:0.8rem;text-align:center;line-height:1.8;}.splash-credit strong{color:var(--gold);}.splash-bar{width:200px;height:2px;background:rgba(255,255,255,0.1);border-radius:2px;margin-top:2rem;overflow:hidden;}.splash-fill{height:100%;width:0%;background:var(--green);border-radius:2px;animation:loadBar 2s ease forwards;}@keyframes loadBar{to{width:100%;}}#main{display:none;min-height:100vh;padding:0 0 4rem;background:var(--dark);}.header{background:var(--green);padding:1.2rem 1.5rem;position:sticky;top:0;z-index:50;}.header-title{font-family:'Noto Serif JP',serif;font-size:1.1rem;font-weight:700;color:#fff;}.header-sub{font-size:0.62rem;color:rgba(255,255,255,0.85);letter-spacing:0.15em;margin-top:0.2rem;}.progress-wrap{padding:1rem 1.5rem 0;background:var(--dark);}.progress-bar{height:3px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;}.progress-fill{height:100%;background:var(--green);border-radius:2px;transition:width 0.4s ease;}.progress-label{font-size:0.68rem;color:rgba(240,255,244,0.4);letter-spacing:0.2em;margin-top:0.5rem;text-align:right;}.question-card{padding:1.5rem;background:var(--dark);}.q-number{font-size:0.65rem;color:#34d399;letter-spacing:0.35em;margin-bottom:0.6rem;}.q-level{display:inline-block;background:rgba(5,150,105,0.2);border:1px solid rgba(52,211,153,0.3);color:#34d399;font-size:0.6rem;padding:0.2em 0.8em;border-radius:20px;letter-spacing:0.15em;margin-bottom:1rem;}.q-scene{background:var(--light-gray);border-radius:10px;padding:1.2rem;margin-bottom:1.2rem;font-size:0.88rem;line-height:1.9;color:#fff;border-left:3px solid var(--green);}.q-text{font-size:0.95rem;font-weight:700;line-height:1.6;margin-bottom:1.4rem;color:#fff;}.options{display:flex;flex-direction:column;gap:0.7rem;}.opt-btn{background:var(--light-gray);border:2px solid rgba(255,255,255,0.07);border-radius:10px;padding:1rem 1.1rem;cursor:pointer;text-align:left;font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.88rem;color:#fff;line-height:1.6;transition:all 0.15s;position:relative;}.opt-btn:active{transform:scale(0.98);}.opt-label{font-size:0.62rem;color:rgba(240,255,244,0.3);margin-bottom:0.3rem;letter-spacing:0.1em;}.opt-btn.correct{background:rgba(5,150,105,0.15);border-color:#059669;}.opt-btn.correct::after{content:'⭕ 正解';position:absolute;top:8px;right:10px;color:#34d399;font-size:0.7rem;font-weight:700;}.opt-btn.wrong{background:rgba(239,68,68,0.08);border-color:rgba(239,68,68,0.35);}.opt-btn.wrong::after{content:'✖ 不正解';position:absolute;top:8px;right:10px;color:#f87171;font-size:0.7rem;font-weight:700;}.opt-btn.answer-reveal{background:rgba(5,150,105,0.07);border-color:rgba(5,150,105,0.3);}.opt-btn.answer-reveal::after{content:'⭕ 正解はこれ';position:absolute;top:8px;right:10px;color:#34d399;font-size:0.7rem;font-weight:700;}.shock-box{margin-top:1.2rem;padding:1.2rem;border-radius:10px;background:rgba(234,179,8,0.08);border:1px solid rgba(234,179,8,0.25);display:none;}.shock-emoji{font-size:2rem;text-align:center;display:block;margin-bottom:0.5rem;}.shock-title{font-size:0.7rem;color:#fbbf24;letter-spacing:0.3em;text-align:center;margin-bottom:0.8rem;}.shock-text{font-size:0.88rem;color:#fff;line-height:1.95;}.shock-text strong{color:#fcd34d;}.shock-text .highlight{background:rgba(234,179,8,0.15);border-radius:4px;padding:0.1em 0.4em;color:#fcd34d;font-weight:700;}.feedback-box{margin-top:0.8rem;padding:1rem 1.2rem;border-radius:10px;background:rgba(200,168,75,0.07);border:1px solid rgba(200,168,75,0.2);font-size:0.85rem;color:#fde68a;line-height:1.9;display:none;}.feedback-box .fb-title{font-size:0.62rem;color:var(--gold);letter-spacing:0.25em;margin-bottom:0.5rem;}.next-btn{width:100%;padding:1rem;background:var(--green);border:none;border-radius:10px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:700;color:#fff;cursor:pointer;margin-top:1.2rem;letter-spacing:0.1em;display:none;}#result{display:none;min-height:100vh;background:var(--dark);}.result-header{background:var(--green);padding:2rem 1.5rem 1.8rem;text-align:center;}.result-label{font-size:0.68rem;letter-spacing:0.4em;color:rgba(255,255,255,0.7);margin-bottom:0.5rem;}.result-score{font-family:'Noto Serif JP',serif;font-size:clamp(4rem,18vw,8rem);font-weight:700;color:#fff;line-height:1;}.result-score span{font-size:clamp(1rem,4vw,2rem);opacity:0.7;}.result-grade{font-size:clamp(1.1rem,5vw,2rem);font-weight:700;color:#fff;margin-top:0.4rem;}.result-body{padding:1.5rem;background:var(--dark);}.verdict-box{background:var(--light-gray);border-left:4px solid var(--green);border-radius:0 10px 10px 0;padding:1.3rem;margin-bottom:1.2rem;}.verdict-title{font-size:0.62rem;letter-spacing:0.35em;color:#34d399;margin-bottom:0.7rem;}.verdict-text{font-size:0.88rem;line-height:2;color:#fff;}.score-detail{background:var(--light-gray);border-radius:10px;padding:1.2rem;margin-bottom:1.2rem;}.score-detail-title{font-size:0.62rem;letter-spacing:0.3em;color:rgba(240,255,244,0.3);margin-bottom:1rem;}.score-row{display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:0.78rem;}.score-row:last-child{border-bottom:none;}.score-row-q{color:rgba(240,255,244,0.7);flex:1;padding-right:0.5rem;}.score-row-pt.full{color:#34d399;font-weight:700;}.score-row-pt.zero{color:rgba(240,255,244,0.2);font-weight:700;}.retry-btn{width:100%;padding:1rem;background:transparent;border:1px solid rgba(255,255,255,0.1);border-radius:10px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.85rem;color:rgba(240,255,244,0.35);cursor:pointer;margin-top:0.7rem;}.by-line{text-align:center;font-size:0.65rem;color:rgba(240,255,244,0.18);letter-spacing:0.2em;margin-top:1.5rem;line-height:1.8;}</style></head><body><div id="splash"><div class="splash-icon">💴</div><div class="splash-title">資本家<span>検定</span>3級</div><div class="splash-warning">⚠️ 労働者が知らない税の真実</div><div class="splash-credit">資本家と労働者の差を知れ<br><strong>by Hiroyuki先生</strong></div><div class="splash-bar"><div class="splash-fill"></div></div></div><div id="main"><div class="header"><div class="header-title">資本家検定3級</div><div class="header-sub">知らないと一生損する　by Hiroyuki先生</div></div><div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div><div class="progress-label" id="progressLabel">0 / 5</div></div><div class="question-card" id="questionCard"></div></div><div id="result"><div class="result-header"><div class="result-label">資本家検定3級　総合スコア</div><div class="result-score" id="resScore">0<span>/100</span></div><div class="result-grade" id="resGrade"></div></div><div class="result-body"><div class="verdict-box"><div class="verdict-title">✦ 総括</div><div class="verdict-text" id="resVerdict"></div></div><div class="score-detail"><div class="score-detail-title">✦ 問題別スコア</div><div id="scoreRows"></div></div><button class="retry-btn" onclick="retry()">↺ もう一度受ける</button><div class="by-line">資本家検定3級<br>by Hiroyuki先生</div></div></div><script>const QUESTIONS=[{level:"経費の基本",scene:"社長が100万円の車を「会社の経費」で買った。同じ車を会社員が買う場合と何が違うのか？",q:"正しいのはどれか？",opts:[{text:"社長も同じ税率で課税される。違いは申告方法だけだ",score:0},{text:"社長は税金を払う前のお金で買える。会社員は税金を引かれた手取りから買う",score:20},{text:"社長は法人税があるので会社員より多く税金を取られる",score:0}],answer:1,shock:"💥",shockTitle:"これが「経費」の本質",shockText:"年収500万の会社員が100万円の車を買うとき、まず約100万円分の税金・社会保険料が引かれている。つまり<strong>稼いだ約400万円を使って</strong>100万円の車を買っている。\n\n一方、売上500万の社長は<strong>税金を払う前の500万円から</strong>100万円の経費を引ける。課税対象が400万円になる。\n\nこれが「<span class='highlight'>経費で落とす</span>」の正体だ。",feedback:"経費とは「税金を払う前のお金で買うこと」。会社員には原則この仕組みがない。給料は経費を差し引く前に課税される。"},{level:"源泉徴収の正体",scene:"毎月の給料から、会社が自動的に税金を国に納めている。この仕組みを何というか？",q:"正しいのはどれか？",opts:[{text:"確定申告（自分で税額を計算して国に申告する制度）",score:0},{text:"源泉徴収",score:20},{text:"年末調整（年末に会社が税額を精算する手続き）",score:0}],answer:1,shock:"🏦",shockTitle:"労働者は「逃げられない」",shockText:"源泉徴収とは、給料が振り込まれる前に会社が税金を天引きして国に納める仕組みだ。\n\n<strong>労働者は税金を「自分で考える」機会すらない。</strong>\n\n社長や自営業者は確定申告で「いくら税金を払うか」を自分で計算できる。だから節税の余地がある。会社員は<span class='highlight'>源泉徴収で自動的に取られる</span>ため、節税の手段がほぼない。",feedback:"源泉徴収は国にとって確実に税金を回収できる仕組み。会社員は「税金を考える前に引かれている」状態。"},{level:"節税の壁",scene:"「節税したい」と思っている会社員がいる。しかし会社員が節税できない根本的な理由がある。",q:"それは何か？",opts:[{text:"給与所得控除があるので会社員は十分に節税できている",score:0},{text:"給料は「経費」を引く前に課税されるから",score:20},{text:"確定申告をすれば会社員も自由に経費を計上できる",score:0}],answer:1,shock:"⛓️",shockTitle:"構造的に節税できない",shockText:"社長：売上 − <span class='highlight'>経費</span> ＝ 利益　→　利益に課税\n会社員：給料　→　そのまま課税　→　手取り\n\n<strong>会社員には「経費」という概念がそもそも存在しない。</strong>\n\n唯一できる節税はiDeCoやNISAなどの制度を使うことだけ。それも「課税を後回しにする・非課税にする」だけで、経費とは根本的に異なる。",feedback:"会社員の給料は「収入＝課税対象」。社長の利益は「収入−経費＝課税対象」。この差が全てだ。"},{level:"経費の範囲",scene:"社長が取引先と食事をした。1万円の飲食代を「経費」にしようとしている。",q:"これは経費になるか？",opts:[{text:"飲食代は金額に関係なく全額経費として認められる",score:0},{text:"事業に関係する飲食なら「交際費」として経費になる",score:20},{text:"領収書さえあれば食事代はすべて経費にできる",score:0}],answer:1,shock:"🍽️",shockTitle:"「仕事の食事」は経費になる",shockText:"取引先との接待、打ち合わせ、従業員への慰労など<strong>事業目的の飲食は経費（交際費）</strong>として認められる。\n\n会社員が同じ食事をしても、当然ながら自腹だ。\n\n重要なのは「事業との関連性」。<span class='highlight'>領収書には必ず「誰と・何のために」を記録</span>しておく必要がある。何でもかんでも経費にすると税務調査で否認される。",feedback:"経費の要件は「事業に必要な支出かどうか」。プライベートはNG。領収書の保管と目的の記録が必須。"},{level:"衝撃の事実",scene:"年収500万円の会社員Aと、利益500万円の社長B。同じ「500万円」でも手元に残るお金に差がある。",q:"一般的に手元に残るお金が多いのはどちらか？",opts:[{text:"会社員A（源泉徴収で確実に納税しており信頼性が高い）",score:0},{text:"どちらも同じ（課税所得が同じなら税額も同じはず）",score:0},{text:"社長B（経費・役員報酬の最適化ができる）",score:20}],answer:2,shock:"🤑",shockTitle:"これが最大の格差",shockText:"会社員500万円：税金・社会保険で約100〜130万円引かれ、手取り約370〜400万円。<strong>節税の余地はほぼゼロ。</strong><br><br>社長500万円には複数の合法的な手段がある。<br><br>①<strong>役員報酬を低く設定</strong>することで、社会保険料（健康保険・厚生年金）の負担を減らせる。<br>②余った利益は<strong>配当金</strong>として受け取ることができ、給与より税率が低い場合がある。<br>③車・パソコン・自宅の一部も<span class='highlight'>事業目的なら経費</span>にできる。<br><br><strong>これは脱税ではない。制度を知っているかどうかの差だ。</strong>",feedback:"「同じ500万円」でも会社員と社長では手元に残る額が全く違う。制度を知ることが最大の節税だ。"}];let currentQ=0,scores=[],answered=false;function renderQuestion(){const q=QUESTIONS[currentQ];const pct=(currentQ/QUESTIONS.length)*100;document.getElementById('progressFill').style.width=pct+'%';document.getElementById('progressLabel').textContent=currentQ+' / '+QUESTIONS.length;let html='<div class="q-number">Q'+(currentQ+1)+' / '+QUESTIONS.length+'</div>';html+='<div class="q-level">'+q.level+'</div>';html+='<div class="q-scene">'+q.scene+'</div>';html+='<div class="q-text">'+q.q+'</div>';html+='<div class="options">';q.opts.forEach((opt,i)=>{html+='<button class="opt-btn" id="opt'+i+'" onclick="answer('+i+')">';html+='<div class="opt-label">選択肢 '+'ABC'[i]+'</div>';html+=opt.text;html+='</button>';});html+='</div>';html+='<div class="shock-box" id="shockBox"><span class="shock-emoji">'+q.shock+'</span><div class="shock-title">⚡ '+q.shockTitle+'</div><div class="shock-text">'+q.shockText.replace(/\n/g,'<br>')+'</div></div>';html+='<div class="feedback-box" id="feedbackBox"><div class="fb-title">✦ ポイント</div>'+q.feedback+'</div>';html+='<button class="next-btn" id="nextBtn" onclick="nextQuestion()">';html+=(currentQ+1>=QUESTIONS.length)?'結果を見る →':'次の問題 →';html+='</button>';document.getElementById('questionCard').innerHTML=html;answered=false;}function answer(idx){if(answered)return;answered=true;const q=QUESTIONS[currentQ];scores.push({q:'Q'+(currentQ+1),score:q.opts[idx].score,label:q.level});q.opts.forEach((opt,i)=>{const btn=document.getElementById('opt'+i);btn.disabled=true;if(i===q.answer){if(i===idx){btn.classList.add('correct');}else{btn.classList.add('answer-reveal');}}else if(i===idx){btn.classList.add('wrong');}});document.getElementById('shockBox').style.display='block';document.getElementById('feedbackBox').style.display='block';document.getElementById('nextBtn').style.display='block';}function nextQuestion(){currentQ++;if(currentQ>=QUESTIONS.length){showResult();}else{renderQuestion();}}function showResult(){const total=scores.reduce((a,b)=>a+b.score,0);let grade,verdict;if(total>=100){grade="満点！　税の真実を知っている";verdict="全問正解。あなたは既に「知っている側」の人間だ。この知識を周りに伝えろ。源泉徴収で何も考えずに生きている人間が大半だ。知っているだけで人生は変わる。";}else if(total>=80){grade="かなり鋭い";verdict="税の仕組みへの理解が高い。ミスした問題だけ復習すれば完璧だ。次は実際に税理士に相談して、自分の状況で何ができるかを確認しろ。";}else if(total>=60){grade="普通の会社員レベル";verdict="半分は知っていた。しかし半分は「知らないまま損していた」ということだ。源泉徴収という仕組みが自分に何をしているか、もう一度考えろ。";}else if(total>=20){grade="典型的な労働者思考";verdict="正直に言う。あなたはこれまで税の仕組みを考えたことがなかった。それは当然だ。学校では教えない。しかし知らないと一生損し続ける。今日から変われ。";}else{grade="完全に無知　今すぐ学べ";verdict="ゼロからのスタートだ。しかしこれを読んだ今日が転換点になれる。「源泉徴収」「経費」「確定申告」この3つを今すぐ調べろ。知識が最大の節税だ。";}document.getElementById('resScore').innerHTML=total+'<span>/100</span>';document.getElementById('resGrade').textContent=grade;document.getElementById('resVerdict').textContent=verdict;let rowsHTML='';scores.forEach(s=>{const cls=s.score>0?'full':'zero';const mark=s.score>0?'⭕':'✖';rowsHTML+='<div class="score-row"><div class="score-row-q">'+s.q+'　'+s.label+'</div><div class="score-row-pt '+cls+'">'+mark+' '+s.score+'/20</div></div>';});document.getElementById('scoreRows').innerHTML=rowsHTML;document.getElementById('main').style.display='none';document.getElementById('result').style.display='block';window.scrollTo(0,0);}function retry(){currentQ=0;scores=[];answered=false;document.getElementById('result').style.display='none';document.getElementById('main').style.display='block';document.getElementById('progressFill').style.width='0%';document.getElementById('progressLabel').textContent='0 / 5';renderQuestion();window.scrollTo(0,0);}renderQuestion();setTimeout(()=>{const s=document.getElementById('splash');s.style.opacity='0';setTimeout(()=>{s.style.display='none';document.getElementById('main').style.display='block';},800);},2200);</script></body></html>
