

<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"><title>占い by Hiroyuki</title><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300;1,600&display=swap" rel="stylesheet"><style>:root{--gold:#d4a843;--rose:#e8a0a8;--deep:#06030f;--cream:#f5e6d0;}*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}body{background:var(--deep);min-height:100vh;font-family:'Cormorant Garamond',serif;overflow-x:hidden;color:var(--cream);}#screenA{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;position:relative;background:linear-gradient(160deg,#0d0520 0%,#06030f 50%,#120818 100%);}#screenA::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 25%,rgba(140,80,220,0.25) 0%,transparent 60%);pointer-events:none;}.title-wrap{text-align:center;margin-bottom:2.5rem;}.title-en{font-family:'Cinzel',serif;color:var(--gold);font-size:0.78rem;letter-spacing:0.5em;opacity:1;display:block;margin-bottom:0.8rem;text-shadow:0 0 16px rgba(212,168,67,0.6);}.title-main{font-family:'Cinzel',serif;font-size:clamp(1.5rem,6vw,2.2rem);color:#ffffff;letter-spacing:0.12em;line-height:1.5;text-shadow:0 2px 20px rgba(180,140,255,0.5),0 0 40px rgba(120,60,200,0.3);}.title-sub{font-size:0.92rem;color:rgba(245,230,208,0.8);font-style:italic;margin-top:0.6rem;display:block;text-shadow:0 1px 8px rgba(0,0,0,0.8);}.title-by{font-family:"Cinzel",serif;font-size:0.68rem;color:rgba(212,168,67,0.85);letter-spacing:0.45em;margin-top:0.7rem;display:block;}.field-group{width:100%;max-width:340px;margin-bottom:1.4rem;}.field-label{display:block;color:rgba(212,168,67,0.9);font-size:0.72rem;letter-spacing:0.25em;text-transform:uppercase;margin-bottom:0.5rem;font-weight:600;}.field-input{width:100%;background:rgba(255,255,255,0.09);border:1px solid rgba(212,168,67,0.5);border-radius:3px;padding:0.85rem 1rem;color:#fff;font-family:'Cormorant Garamond',serif;font-size:1.15rem;outline:none;transition:border-color 0.3s;-webkit-appearance:none;}.field-input::placeholder{color:rgba(245,230,208,0.4);}.dob-row{display:flex;gap:0.5rem;width:100%;max-width:340px;margin-bottom:1.4rem;}.dob-select{flex:1;background:rgba(255,255,255,0.09);border:1px solid rgba(212,168,67,0.5);border-radius:3px;padding:0.85rem 0.5rem;color:#fff;font-family:'Cormorant Garamond',serif;font-size:1rem;outline:none;-webkit-appearance:none;appearance:none;text-align:center;cursor:pointer;}.dob-select option{background:#0a0518;color:#fff;}.lang-group{width:100%;max-width:340px;margin-bottom:2rem;}.lang-row{display:flex;gap:0.6rem;}.lang-btn{flex:1;background:rgba(255,255,255,0.07);border:1px solid rgba(212,168,67,0.4);border-radius:3px;padding:0.6rem;color:rgba(245,230,208,0.7);font-family:'Cormorant Garamond',serif;font-size:0.9rem;cursor:pointer;transition:all 0.2s;}.lang-btn.active{background:rgba(212,168,67,0.2);border-color:var(--gold);color:var(--gold);font-weight:600;}.go-btn{width:100%;max-width:340px;background:linear-gradient(135deg,#7b3fa0,#a060c8,#7b3fa0);border:none;border-radius:3px;padding:1rem;font-family:'Cinzel',serif;font-size:1rem;letter-spacing:0.3em;color:#fff;cursor:pointer;font-weight:700;box-shadow:0 4px 30px rgba(120,60,180,0.4);}#screenB{display:none;position:fixed;inset:0;background:var(--deep);z-index:100;flex-direction:column;align-items:center;justify-content:center;}.crystal-wrap{position:relative;width:160px;height:160px;margin-bottom:2rem;}.crystal{width:100%;height:100%;animation:crystalSpin 4s linear infinite;}.crystal-glow{position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,rgba(120,60,180,0.3) 0%,transparent 70%);animation:glowPulse 2s ease-in-out infinite;}@keyframes crystalSpin{to{transform:rotate(360deg);}}@keyframes glowPulse{0%,100%{transform:scale(1);opacity:0.7;}50%{transform:scale(1.15);opacity:1;}}.loading-name{font-family:'Cinzel',serif;color:var(--gold);font-size:1.2rem;letter-spacing:0.2em;margin-bottom:0.8rem;}.loading-status{color:rgba(212,168,67,0.5);font-size:0.7rem;letter-spacing:0.3em;animation:blink 1.2s ease-in-out infinite;}@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}.progress-bar{width:200px;height:2px;background:rgba(255,255,255,0.1);border-radius:2px;margin-top:1.5rem;overflow:hidden;}.progress-fill{height:100%;background:linear-gradient(90deg,#7b3fa0,var(--gold));width:0%;transition:width 0.3s;border-radius:2px;}#screenC{display:none;position:fixed;inset:0;background:var(--deep);z-index:200;overflow-y:auto;}#bgCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;}.result-wrap{position:relative;z-index:10;padding:3rem 1.8rem 5rem;max-width:480px;margin:0 auto;}.result-header{text-align:center;margin-bottom:2rem;}.result-name{font-family:'Cinzel',serif;font-size:clamp(2rem,9vw,3.5rem);font-weight:900;color:transparent;background:linear-gradient(135deg,#c8a0ff,#ffffff,#d4a843);-webkit-background-clip:text;background-clip:text;opacity:0;animation:fadeUp 1s ease forwards 0.3s;letter-spacing:0.1em;}.result-dob{color:rgba(212,168,67,0.5);font-size:0.75rem;letter-spacing:0.3em;margin-top:0.3rem;opacity:0;animation:fadeUp 0.8s ease forwards 0.7s;}.deco-line{display:flex;align-items:center;gap:0.8rem;margin:1.5rem 0;opacity:0;animation:fadeUp 0.8s ease forwards 0.9s;}.deco-line::before,.deco-line::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(212,168,67,0.4),transparent);}.deco-gem{color:var(--gold);font-size:0.8rem;letter-spacing:0.2em;white-space:nowrap;}.card{background:rgba(255,255,255,0.03);border:1px solid rgba(212,168,67,0.15);border-radius:4px;padding:1.4rem;margin-bottom:1.2rem;opacity:0;position:relative;overflow:hidden;}.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(212,168,67,0.4),transparent);}.card-label{font-family:'Cinzel',serif;font-size:0.6rem;letter-spacing:0.35em;color:var(--gold);opacity:0.7;margin-bottom:0.8rem;display:flex;align-items:center;gap:0.5rem;}.card-label::after{content:'';flex:1;height:1px;background:rgba(212,168,67,0.2);}.card-text{font-size:clamp(0.95rem,3vw,1.15rem);line-height:1.9;color:rgba(245,230,208,0.9);}.card-text em{color:#c8a0ff;font-style:normal;font-weight:600;}.card-text strong{color:var(--gold);}.card:nth-child(1){animation:slideIn 0.9s ease forwards 1.1s;}.card:nth-child(2){animation:slideIn 0.9s ease forwards 1.4s;}.card:nth-child(3){animation:slideIn 0.9s ease forwards 1.7s;}.card:nth-child(4){animation:slideIn 0.9s ease forwards 2.0s;}.card:nth-child(5){animation:slideIn 0.9s ease forwards 2.3s;}@keyframes fadeUp{from{opacity:0;transform:translateY(15px);}to{opacity:1;transform:translateY(0);}}@keyframes slideIn{from{opacity:0;transform:translateX(-20px);}to{opacity:1;transform:translateX(0);}}.final-msg{text-align:center;padding:1.8rem;border:1px solid rgba(212,168,67,0.3);border-radius:4px;background:rgba(212,168,67,0.05);margin-top:1.5rem;opacity:0;animation:fadeUp 1s ease forwards 2.8s;}.final-msg p{font-style:italic;font-size:clamp(1rem,3.5vw,1.25rem);line-height:2;color:var(--cream);}.final-msg .name-hl{color:var(--gold);font-style:normal;font-weight:600;}.final-by{font-family:'Cinzel',serif;font-size:0.65rem;color:rgba(212,168,67,0.6);letter-spacing:0.4em;margin-top:1rem;font-style:normal!important;}.reset-btn{display:block;margin:2rem auto 0;background:transparent;border:1px solid rgba(212,168,67,0.3);color:rgba(212,168,67,0.5);font-family:'Cinzel',serif;font-size:0.65rem;letter-spacing:0.3em;padding:0.7em 1.8em;cursor:pointer;border-radius:2px;opacity:0;animation:fadeUp 0.8s ease forwards 3.3s;}</style></head><body><div id="screenA"><div class="title-wrap"><span class="title-en">✦ DESTINY READING ✦</span><div class="title-main">あなたの本質を<br>解き明かす</div><span class="title-sub"> <option value="8">8月</option><option value="9">9月</option><option value="10">10月</option><option value="11">11月</option><option value="12">12月</option></select><select class="dob-select" id="selDay"><option value="">日</option><option value="1">1日</option><option value="2">2日</option><option value="3">3日</option><option value="4">4日</option><option value="5">5日</option><option value="6">6日</option><option value="7">7日</option><option value="8">8日</option><option value="9">9日</option><option value="10">10日</option><option value="11">11日</option><option value="12">12日</option><option value="13">13日</option><option value="14">14日</option><option value="15">15日</option><option value="16">16日</option><option value="17">17日</option><option value="18">18日</option><option value="19">19日</option><option value="20">20日</option><option value="21">21日</option><option value="22">22日</option><option value="23">23日</option><option value="24">24日</option><option value="25">25日</option><option value="26">26日</option><option value="27">27日</option><option value="28">28日</option><option value="29">29日</option><option value="30">30日</option><option value="31">31日</option></select></div><div class="lang-group" style="margin-top:1.4rem;"><label class="field-label">言語 / Language</label><div class="lang-row"><button class="lang-btn active" onclick="setLang('ja',this)">日本語</button><button class="lang-btn" onclick="setLang('en',this)">English</button><button class="lang-btn" onclick="setLang('tl',this)">Tagalog</button></div></div><button class="go-btn" onclick="startReading()">🔮 READING START</button></div><div id="screenB"><div class="crystal-wrap"><div class="crystal-glow"></div><svg class="crystal" viewBox="0 0 100 100"><defs><linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#c8a0ff"/><stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="100%" stop-color="#d4a843"/></linearGradient></defs><polygon points="50,5 90,30 90,70 50,95 10,70 10,30" fill="none" stroke="url(#cg)" stroke-width="1.5" opacity="0.8"/><polygon points="50,15 80,35 80,65 50,85 20,65 20,35" fill="none" stroke="url(#cg)" stroke-width="0.8" opacity="0.4"/><line x1="50" y1="5" x2="50" y2="95" stroke="url(#cg)" stroke-width="0.5" opacity="0.3"/><line x1="10" y1="30" x2="90" y2="70" stroke="url(#cg)" stroke-width="0.5" opacity="0.3"/><line x1="90" y1="30" x2="10" y2="70" stroke="url(#cg)" stroke-width="0.5" opacity="0.3"/><circle cx="50" cy="50" r="8" fill="rgba(200,160,255,0.3)" stroke="rgba(200,160,255,0.6)" stroke-width="1"/></svg></div><div class="loading-name" id="loadingName">---</div><div class="loading-status" id="loadingStatus">ANALYZING...</div><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></div><div id="screenC"><canvas id="bgCanvas"></canvas><div class="result-wrap"><div class="result-header"><div class="result-name" id="resultName">SALLY</div><div class="result-dob" id="resultDob"></div></div><div class="deco-line"><span class="deco-gem">✦ DESTINY READING ✦</span></div><div id="cardsWrap"></div><div class="final-msg" id="finalMsg"></div><button class="reset-btn" onclick="resetAll()">↺ もう一度読む</button></div></div><script>let selectedLang='ja';function setLang(l,btn){selectedLang=l;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}function lifeNumber(y,m,d){let s=String(y)+String(m)+String(d);let n=s.split('').reduce((a,c)=>a+parseInt(c),0);while(n>9&&n!==11&&n!==22)n=String(n).split('').reduce((a,c)=>a+parseInt(c),0);return n;}const cardData={essence:{ja:[{label:'本質',text:'<em>{name}</em>は、表には見せないが、内側に<strong>強い意志と誇り</strong>を持っている。誰にも頼らずひとりで立とうとする。その強さは、ときに自分自身を疲れさせる。'},{label:'本質',text:'<em>{name}</em>は、周りの感情に<strong>ひどく敏感</strong>だ。人が傷ついていると自分まで痛くなる。だからこそ、誰よりも人の気持ちがわかる。'},{label:'本質',text:'<em>{name}</em>の笑顔の裏には、<strong>誰にも言えない孤独</strong>がある。明るく振る舞うほど、本当の自分を隠している。'},{label:'本質',text:'<em>{name}</em>は、どんな状況でも<strong>諦めない人間</strong>だ。倒れても立ち上がることを、もう何度も経験してきた。'},{label:'本質',text:'<em>{name}</em>は、変化の中でこそ輝く。安定より<strong>自由を求める魂</strong>を持って生まれてきた。'},{label:'本質',text:'<em>{name}</em>の根本には<strong>家族への深い愛</strong>がある。大切な人を守るためなら、どんな苦労も厭わない。'},{label:'本質',text:'<em>{name}</em>は、表面だけで判断されることを嫌う。<strong>本当の自分を理解してくれる人</strong>を、ずっと探している。'},{label:'本質',text:'<em>{name}</em>は、強く見られがちだが、<strong>本当は誰よりも繊細</strong>だ。強さと弱さが同居している。'},{label:'本質',text:'<em>{name}</em>は、自分より他者を優先してしまう。<strong>与えることが自然</strong>にできる、稀有な魂だ。'},{label:'本質',text:'<em>{name}</em>は、普通の人には感じられないものを感じ取る。<strong>特別な直感と感受性</strong>を持って生まれた。'},{label:'本質',text:'<em>{name}</em>は、大きな夢を持ちながらも、<strong>現実の重さ</strong>も知っている。その両方を抱えて生きている。'}],en:[{label:'ESSENCE',text:'<em>{name}</em> carries a <strong>quiet strength</strong> that few can see.'},{label:'ESSENCE',text:'<em>{name}</em> feels the emotions of others <strong>as if they were her own</strong>.'},{label:'ESSENCE',text:'Behind <em>{name}</em>\'s smile hides a <strong>loneliness she rarely shares</strong>.'},{label:'ESSENCE',text:'<em>{name}</em> is someone who <strong>never truly gives up</strong>.'},{label:'ESSENCE',text:'<em>{name}</em> was born with a soul that <strong>craves freedom and change</strong>.'},{label:'ESSENCE',text:'At the core of <em>{name}</em> is a <strong>deep love for family</strong>.'},{label:'ESSENCE',text:'<em>{name}</em> longs to be truly <strong>understood</strong>, not just seen on the surface.'},{label:'ESSENCE',text:'<em>{name}</em> appears strong, but is <strong>far more sensitive</strong> than anyone realizes.'},{label:'ESSENCE',text:'<em>{name}</em> gives more than she takes. <strong>Generosity runs deep</strong> in her nature.'},{label:'ESSENCE',text:'<em>{name}</em> was born with <strong>rare intuition and sensitivity</strong>.'},{label:'ESSENCE',text:'<em>{name}</em> holds both <strong>big dreams and the weight of reality</strong> in the same heart.'}],tl:[{label:'KAKANYAHAN',text:'Si <em>{name}</em> ay may <strong>tahimik na lakas</strong> na hindi nakikita ng lahat.'},{label:'KAKANYAHAN',text:'Si <em>{name}</em> ay nakakaramdam ng damdamin ng iba <strong>na parang sa kanya mismo</strong>.'},{label:'KAKANYAHAN',text:'Sa likod ng ngiti ni <em>{name}</em> ay may <strong>kalungkutang bihirang ibinabahagi</strong>.'},{label:'KAKANYAHAN',text:'Si <em>{name}</em> ay <strong>hindi tumitigil</strong>. Babangon muli siya.'},{label:'KAKANYAHAN',text:'Si <em>{name}</em> ay ipinanganak na may kaluluwa na <strong>naghahanap ng kalayaan</strong>.'},{label:'KAKANYAHAN',text:'Sa kaibuturan ni <em>{name}</em> ay <strong>malalim na pagmamahal sa pamilya</strong>.'},{label:'KAKANYAHAN',text:'Lagi siyang naghahanap ng taong <strong>tunay na makakaunawa</strong> sa kanya.'},{label:'KAKANYAHAN',text:'Mukhang malakas si <em>{name}</em>, ngunit siya ay <strong>higit na sensitibo</strong>.'},{label:'KAKANYAHAN',text:'Si <em>{name}</em> ay nagbibigay nang higit. Ang <strong>pagmamahal ay natural</strong> para sa kanya.'},{label:'KAKANYAHAN',text:'Si <em>{name}</em> ay may <strong>natatanging intuisyon</strong>.'},{label:'KAKANYAHAN',text:'Hawak ni <em>{name}</em> ang <strong>malalaking pangarap at mabigat na katotohanan</strong>.'}]},situation:{ja:[{label:'今のあなた',text:'今の<em>{name}</em>は、<strong>誰かのために頑張っている</strong>。自分のためではなく。その重さを、誰も本当にはわかっていない。'},{label:'今のあなた',text:'<em>{name}</em>は今、<strong>疲れている</strong>。でもそれを簡単には言えない。心配をかけたくないからだ。'},{label:'今のあなた',text:'遠くにいる<strong>大切な人のことを、毎日思っている</strong>。会えない時間が長くなるほど、もっと頑張ろうと思う。'},{label:'今のあなた',text:'<em>{name}</em>は今、<strong>お金と気持ちのバランス</strong>を保つのに必死だ。数字には表れない消耗がある。'}],en:[{label:'RIGHT NOW',text:'<em>{name}</em> is <strong>working for someone she loves</strong>, not for herself.'},{label:'RIGHT NOW',text:'<em>{name}</em> is <strong>tired</strong> — not because she is weak, but because she has been strong too long.'},{label:'RIGHT NOW',text:'Every day, <em>{name}</em> thinks of the <strong>people she misses</strong>.'},{label:'RIGHT NOW',text:'<em>{name}</em> is balancing <strong>money and emotion</strong> — a weight numbers can never show.'}],tl:[{label:'NGAYON',text:'Si <em>{name}</em> ay nagtatrabaho para sa <strong>taong mahal niya</strong>, hindi para sa sarili.'},{label:'NGAYON',text:'Si <em>{name}</em> ay <strong>pagod na</strong> — hindi dahil mahina, kundi dahil matagal na siyang malakas.'},{label:'NGAYON',text:'Araw-araw, iniisip ni <em>{name}</em> ang mga <strong>taong nami-miss niya</strong>.'},{label:'NGAYON',text:'Sinisikap ni <em>{name}</em> na balansehin ang <strong>pera at damdamin</strong>.'}]},talent:{ja:[{label:'あなたの才能',text:'<em>{name}</em>には、<strong>人の心を一瞬で和ませる力</strong>がある。生まれながらの才能だ。'},{label:'あなたの才能',text:'<em>{name}</em>は<strong>空気を読む天才</strong>だ。言葉にならない感情を察知する。'},{label:'あなたの才能',text:'<em>{name}</em>の最大の才能は<strong>諦めない心</strong>だ。普通の人なら折れる場面で、まだ前を向いている。'}],en:[{label:'YOUR GIFT',text:'<em>{name}</em> has the rare ability to <strong>make people feel at ease</strong> instantly.'},{label:'YOUR GIFT',text:'<em>{name}</em> is a <strong>natural reader of unspoken feelings</strong>.'},{label:'YOUR GIFT',text:'<em>{name}</em>\'s greatest gift is her <strong>refusal to give up</strong>.'}],tl:[{label:'IYONG TALENTO',text:'Si <em>{name}</em> ay may kakayahang <strong>gawing komportable ang mga tao</strong> agad.'},{label:'IYONG TALENTO',text:'Si <em>{name}</em> ay natural na <strong>nakakabasa ng hindi sinasalitang damdamin</strong>.'},{label:'IYONG TALENTO',text:'Ang pinakadakilang talento ni <em>{name}</em> ay ang <strong>hindi sumuko</strong>.'}]},future:{ja:[{label:'近い未来',text:'もうすぐ、<em>{name}</em>の努力が<strong>形になる瞬間</strong>が来る。確実に近づいている。'},{label:'近い未来',text:'<em>{name}</em>には、<strong>穏やかで温かい時間</strong>が待っている。今の苦労は、そこへの道だ。'},{label:'近い未来',text:'<em>{name}</em>の周りに、<strong>本当に信頼できる人</strong>が現れる。もうすぐそこにいる。'}],en:[{label:'NEAR FUTURE',text:'Very soon, <em>{name}</em>\'s efforts will <strong>take visible shape</strong>.'},{label:'NEAR FUTURE',text:'A time of <strong>quiet warmth</strong> awaits <em>{name}</em>.'},{label:'NEAR FUTURE',text:'Someone <em>{name}</em> can <strong>truly trust</strong> will appear soon.'}],tl:[{label:'MALAPIT NA HINAHARAP',text:'Malapit na, <strong>makikita ang bunga ng pagsisikap</strong> ni <em>{name}</em>.'},{label:'MALAPIT NA HINAHARAP',text:'Isang panahon ng <strong>katahimikan at init</strong> ang naghihintay kay <em>{name}</em>.'},{label:'MALAPIT NA HINAHARAP',text:'Isang taong <strong>tunay na mapagkakatiwalaan</strong> ang darating kay <em>{name}</em>.'}]},tonight:{ja:[{label:'今夜のメッセージ',text:'今夜の<em>{name}</em>は、<strong>誰よりも特別な光</strong>を持っている。その光は消えていない。'},{label:'今夜のメッセージ',text:'今夜だけは、<em>{name}</em>が<strong>自分のために笑っていい</strong>。頑張ってきた自分を褒めてあげて。'}],en:[{label:'TONIGHT',text:'Tonight, <em>{name}</em> carries a <strong>light that outshines everyone</strong>. It has never gone out.'},{label:'TONIGHT',text:'Tonight, <em>{name}</em> is allowed to <strong>smile just for herself</strong>. She has earned it.'}],tl:[{label:'NGAYONG GABI',text:'Ngayong gabi, si <em>{name}</em> ay may <strong>liwanag na higit sa lahat</strong>.'},{label:'NGAYONG GABI',text:'Ngayong gabi, si <em>{name}</em> ay <strong>maaaring ngumiti para sa sarili niya</strong>.'}]}};const finalMessages={ja:['{name}、あなたがここにいる理由がある。今夜のあなたは、間違いなく美しい。','{name}、あなたの歩んできた道は、誰にも否定できない。その強さを誇っていい。','{name}、大切な人のために頑張るあなたを、宇宙は見ている。報われる日は必ず来る。'],en:['{name}, there is a reason you are here tonight. You are beautiful.','{name}, the path you have walked cannot be denied. Be proud of that strength.','{name}, the universe sees you. The day of reward will come.'],tl:['{name}, may dahilan kung bakit nandito ka. Ikaw ay maganda.','{name}, ang landas na nilakad mo ay hindi maaaring tanggihan. Ipagmalaki iyon.','{name}, nakikita ng sansinukob ang iyong pagsisikap. Darating ang gantimpala.']};function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}function applyName(t,n){return t.replace(/{name}/g,n);}function startReading(){const name=document.getElementById('inputName').value.trim();const y=document.getElementById('selYear').value;const m=document.getElementById('selMonth').value;const d=document.getElementById('selDay').value;if(!name||!y||!m||!d){alert('名前と生年月日を入力してください');return;}const B=document.getElementById('screenB');B.style.display='flex';document.getElementById('loadingName').textContent=name.toUpperCase();const statuses=['READING BIRTH DATA...','CALCULATING LIFE NUMBER...','DECODING YOUR ESSENCE...','ANALYZING YOUR AURA...','PREPARING YOUR READING...'];let si=0;const fill=document.getElementById('progressFill');const iv=setInterval(()=>{si++;document.getElementById('loadingStatus').textContent=statuses[Math.min(si,statuses.length-1)];fill.style.width=(si/statuses.length*100)+'%';},600);setTimeout(()=>{clearInterval(iv);fill.style.width='100%';setTimeout(()=>{B.style.display='none';showResult(name,parseInt(y),parseInt(m),parseInt(d));},400);},3200);}function showResult(name,y,m,d){const ln=lifeNumber(y,m,d);const lnIdx=ln===11?9:ln===22?10:ln-1;const lang=selectedLang;const essCard=cardData.essence[lang][lnIdx];const sitCard=pick(cardData.situation[lang]);const talCard=pick(cardData.talent[lang]);const futCard=pick(cardData.future[lang]);const tonCard=pick(cardData.tonight[lang]);const finalMsg=pick(finalMessages[lang]);const months=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];document.getElementById('resultName').textContent=name.toUpperCase();document.getElementById('resultDob').textContent=y+' / '+months[m]+' / '+d+'  ✦  Life Number : '+ln;const wrap=document.getElementById('cardsWrap');wrap.innerHTML='';[essCard,sitCard,talCard,futCard,tonCard].forEach(c=>{const div=document.createElement('div');div.className='card';div.innerHTML='<div class="card-label">✦ '+c.label+'</div><div class="card-text">'+applyName(c.text,name)+'</div>';wrap.appendChild(div);});const byLine=lang==='tl'?'ni Hiroyuki':'by Hiroyuki';const fm=document.getElementById('finalMsg');fm.innerHTML='<p>'+applyName(finalMsg,name).replace(name,'<span class="name-hl">'+name+'</span>')+'</p><p class="final-by">'+byLine+'</p>';document.getElementById('screenC').style.display='block';initBgCanvas();}function initBgCanvas(){const canvas=document.getElementById('bgCanvas');const ctx=canvas.getContext('2d');canvas.width=window.innerWidth;canvas.height=window.innerHeight;const W=canvas.width,H=canvas.height;const stars=[];for(let i=0;i<200;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+0.2,phase:Math.random()*Math.PI*2,speed:Math.random()*0.02+0.005});let t=0;function draw(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#03010a');g.addColorStop(1,'#060310');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);t+=0.016;stars.forEach(s=>{const a=0.3+Math.sin(t*s.speed*20+s.phase)*0.25;ctx.globalAlpha=a;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;requestAnimationFrame(draw);}draw();}function resetAll(){document.getElementById('screenC').style.display='none';document.getElementById('inputName').value='';document.getElementById('selYear').value='';document.getElementById('selMonth').value='';document.getElementById('selDay').value='';}</script></body></html>
