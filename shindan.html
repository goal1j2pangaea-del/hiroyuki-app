

<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"><title>ズバリ言うわよ by Hiroyuki</title><link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Oswald:wght@400;700&display=swap" rel="stylesheet"><style>:root{--red:#e8001a;--dark:#0d0d0d;--cream:#f5f0e8;--gold:#c8a84b;--gray:#2a2a2a;}*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}body{background:var(--dark);min-height:100vh;font-family:'Zen Kaku Gothic New',sans-serif;color:var(--cream);overflow-x:hidden;}#splash{position:fixed;inset:0;background:var(--dark);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity 0.8s;}.splash-title{font-family:'Oswald',sans-serif;font-size:clamp(2.5rem,10vw,5rem);font-weight:700;color:var(--cream);letter-spacing:0.05em;text-align:center;line-height:1;}.splash-title span{color:var(--red);}.splash-sub{font-size:0.75rem;color:rgba(245,240,232,0.4);letter-spacing:0.4em;margin-top:1rem;text-transform:uppercase;}.splash-by{font-size:0.8rem;color:var(--gold);letter-spacing:0.3em;margin-top:0.5rem;}.splash-bar{width:200px;height:2px;background:rgba(255,255,255,0.1);border-radius:2px;margin-top:2.5rem;overflow:hidden;}.splash-fill{height:100%;width:0%;background:var(--red);border-radius:2px;animation:loadBar 1.8s ease forwards;}@keyframes loadBar{to{width:100%;}}#main{display:none;min-height:100vh;padding:0 0 5rem;}.header{background:var(--red);padding:1.2rem 1.5rem;position:sticky;top:0;z-index:50;}.header-title{font-family:'Oswald',sans-serif;font-size:1.2rem;font-weight:700;letter-spacing:0.1em;color:#fff;}.header-sub{font-size:0.65rem;color:rgba(255,255,255,0.7);letter-spacing:0.2em;}.intro{padding:1.5rem;background:var(--gray);border-bottom:1px solid rgba(255,255,255,0.08);}.intro p{font-size:0.88rem;line-height:1.85;color:#fff;}.intro strong{color:var(--red);}.category{margin-top:0.5rem;}.cat-title{font-family:'Oswald',sans-serif;font-size:0.7rem;letter-spacing:0.35em;color:var(--red);padding:1rem 1.5rem 0.6rem;text-transform:uppercase;border-top:1px solid rgba(255,255,255,0.06);}.hobby-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;padding:0 1.2rem 0.5rem;}.hobby-btn{background:var(--gray);border:2px solid rgba(255,255,255,0.06);border-radius:8px;padding:0.9rem 0.7rem;cursor:pointer;text-align:left;transition:all 0.15s;position:relative;overflow:hidden;}.hobby-btn:active{transform:scale(0.97);}.hobby-btn.selected{background:rgba(232,0,26,0.15);border-color:var(--red);}.hobby-btn.selected::after{content:'✓';position:absolute;top:6px;right:8px;color:var(--red);font-size:0.75rem;font-weight:700;}.hobby-name{font-size:0.82rem;font-weight:700;color:var(--cream);line-height:1.3;}.judge-wrap{padding:1.5rem;position:sticky;bottom:0;background:linear-gradient(to top,var(--dark) 80%,transparent);}.judge-btn{width:100%;padding:1.1rem;background:var(--red);border:none;border-radius:8px;font-family:'Oswald',sans-serif;font-size:1.1rem;letter-spacing:0.2em;color:#fff;cursor:pointer;font-weight:700;transition:opacity 0.2s;}.judge-btn:disabled{opacity:0.35;}.selected-count{text-align:center;font-size:0.75rem;color:rgba(245,240,232,0.4);margin-bottom:0.8rem;letter-spacing:0.1em;}#result{display:none;min-height:100vh;background:var(--dark);}.result-header{background:var(--red);padding:2rem 1.5rem 1.5rem;text-align:center;}.result-label{font-size:0.7rem;letter-spacing:0.4em;color:rgba(255,255,255,0.7);margin-bottom:0.5rem;}.result-score{font-family:'Oswald',sans-serif;font-size:clamp(4rem,18vw,8rem);font-weight:700;color:#fff;line-height:1;}.result-score span{font-size:clamp(1.2rem,5vw,2.5rem);opacity:0.6;}.result-grade{font-family:'Oswald',sans-serif;font-size:clamp(1.5rem,6vw,3rem);font-weight:700;color:#fff;margin-top:0.3rem;letter-spacing:0.1em;}.result-body{padding:1.5rem;}.verdict-box{background:var(--gray);border-left:4px solid var(--red);border-radius:0 8px 8px 0;padding:1.2rem;margin-bottom:1.2rem;}.verdict-title{font-family:'Oswald',sans-serif;font-size:0.65rem;letter-spacing:0.35em;color:var(--red);margin-bottom:0.6rem;}.verdict-text{font-size:0.9rem;line-height:1.9;color:var(--cream);}.hobby-list-box{background:var(--gray);border-radius:8px;padding:1.2rem;margin-bottom:1.2rem;}.hobby-list-title{font-size:0.65rem;letter-spacing:0.3em;color:rgba(245,240,232,0.4);margin-bottom:0.8rem;}.hobby-tag{display:inline-block;background:rgba(255,255,255,0.07);border-radius:4px;padding:0.3em 0.7em;font-size:0.78rem;margin:0.2rem;color:var(--cream);}.hobby-tag.high{background:rgba(232,0,26,0.2);color:#ff6b7a;}.hobby-tag.mid{background:rgba(200,168,75,0.2);color:var(--gold);}.hobby-tag.low{background:rgba(255,255,255,0.05);color:rgba(245,240,232,0.4);}.by-line{text-align:center;font-size:0.7rem;color:rgba(245,240,232,0.25);letter-spacing:0.35em;margin-top:1.5rem;padding-bottom:1rem;}.retry-btn{width:100%;padding:1rem;background:transparent;border:1px solid rgba(255,255,255,0.2);border-radius:8px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.85rem;color:rgba(245,240,232,0.5);cursor:pointer;letter-spacing:0.1em;margin-top:0.5rem;}</style></head><body><div id="splash"><div class="splash-title">ズバリ<span>言う</span>わよ</div><div class="splash-sub">Life Activity Index</div><div class="splash-by">by Hiroyuki</div><div class="splash-bar"><div class="splash-fill"></div></div></div><div id="main"><div class="header"><div class="header-title">ズバリ言うわよ</div><div class="header-sub">あなたの趣味から人生の豊かさを採点する</div></div><div class="intro"><p>好きな趣味を<strong>全部選んでください</strong>。AIが勝手に採点します。<br>「仕事が趣味」「趣味なし」も正直に選ぶこと。何個選んでもOK。</p></div><div id="hobbyList"></div><div class="judge-wrap"><div class="selected-count" id="selectedCount">0個選択中</div><button class="judge-btn" id="judgeBtn" onclick="judge()" disabled>ズバリ採点する</button></div></div><div id="result"><div class="result-header"><div class="result-label">あなたの人生豊かさ指数</div><div class="result-score" id="resScore">0<span>/100</span></div><div class="result-grade" id="resGrade"></div></div><div class="result-body"><div class="verdict-box"><div class="verdict-title">診断結果</div><div class="verdict-text" id="resVerdict"></div></div><div class="hobby-list-box" id="resHobbies"></div><div class="by-line">by Hiroyuki</div><button class="retry-btn" onclick="retry()">もう一度診断する</button></div></div><script>const HOBBIES=[{cat:"体を動かす系",items:[{name:"登山・トレッキング",score:10},{name:"サイクリング",score:10},{name:"マラソン・ランニング",score:10},{name:"チームスポーツ(サッカー・バスケ等)",score:10},{name:"個人スポーツ(テニス・水泳・格闘技等)",score:9},{name:"ダンス",score:9},{name:"筋トレ・ジム",score:8},{name:"ハイキング・ウォーキング",score:8},{name:"サウナ",score:8},{name:"ヨガ・ストレッチ",score:6}]},{cat:"創る・発信する系",items:[{name:"楽器演奏",score:9},{name:"絵を描く・イラスト",score:8},{name:"DIY・ものづくり",score:8},{name:"ゲーム配信・実況",score:8},{name:"料理・お菓子作り",score:7},{name:"写真・動画撮影",score:7},{name:"ブログ・SNS発信",score:7}]},{cat:"インプット・外出系",items:[{name:"読書(ビジネス・自己啓発)",score:7},{name:"旅行",score:7},{name:"カラオケ",score:5},{name:"映画鑑賞",score:5},{name:"読書(小説・娯楽)",score:5},{name:"漫画",score:3}]},{cat:"デジタル系",items:[{name:"オンラインゲーム(人と協力・対戦)",score:7},{name:"テレビゲーム(一人)",score:4},{name:"YouTube・Netflix",score:2},{name:"脳トレアプリ",score:2},{name:"ソシャゲー",score:1}]},{cat:"正直に答えよ",items:[{name:"昼寝・ゴロゴロ",score:1},{name:"パチンコ・ギャンブル",score:1},{name:"自慰行為",score:1},{name:"子育てが趣味",score:0},{name:"仕事が趣味",score:0},{name:"趣味なし",score:0}]}];let selected=new Set();function renderList(){const container=document.getElementById('hobbyList');container.innerHTML='';HOBBIES.forEach(cat=>{const catDiv=document.createElement('div');catDiv.className='category';catDiv.innerHTML='<div class="cat-title">'+cat.cat+'</div><div class="hobby-grid" id="g'+cat.cat.slice(0,2)+'"></div>';container.appendChild(catDiv);const grid=catDiv.querySelector('.hobby-grid');cat.items.forEach(h=>{const btn=document.createElement('button');btn.className='hobby-btn';btn.dataset.name=h.name;btn.dataset.score=h.score;btn.innerHTML='<div class="hobby-name">'+h.name+'</div>';btn.onclick=()=>toggle(h.name,h.score,btn);grid.appendChild(btn);});});}function toggle(name,score,btn){if(selected.has(name)){selected.delete(name);btn.classList.remove('selected');}else{selected.add(name);btn.classList.add('selected');}const count=selected.size;document.getElementById('selectedCount').textContent=count+'個選択中';document.getElementById('judgeBtn').disabled=count===0;}function judge(){let total=0;let selectedItems=[];HOBBIES.forEach(cat=>{cat.items.forEach(h=>{if(selected.has(h.name)){total+=h.score;selectedItems.push({name:h.name,score:h.score});}});});const displayScore=Math.min(Math.round(total),100);let grade,verdict;if(displayScore>=80){grade="S級　人生充実人間";verdict="文句なし。体も動かし、創り、外にも出る。人生を能動的に生きている。こういう人間は話が面白い。人を惹きつける。自然とモテる。続けろ。";}else if(displayScore>=60){grade="A級　なかなかやる";verdict="悪くない。能動的な趣味がちゃんとある。ただ、受動的な時間がもう少し多い。YouTubeやソシャゲーに使っている時間を、体を動かすことに使えたらA+になれる。";}else if(displayScore>=40){grade="B級　普通以下";verdict="正直に言う。「普通」は褒め言葉ではない。消費する趣味が多すぎる。映画を見るより映像を作れ。音楽を聴くより楽器を弾け。受け取るだけの人生から脱出しろ。";}else if(displayScore>=20){grade="C級　やばいぞ";verdict="これは危ない。能動的な趣味がほとんどない。体も動かさない、創らない、発信しない。このまま10年経ったら何も残らない。今すぐ何か一つ、外に出る趣味を始めろ。";}else{grade="D級　論外";verdict="趣味なし、仕事が趣味、ゴロゴロ。これは人生の放棄だ。面白い話ができるか？初対面の人を惹きつけられるか？答えはNOだろう。何でもいい。今日から何か始めろ。";}if(displayScore===0){grade="論外　人生やり直せ";verdict="趣味なし、仕事が趣味、自慰行為のみ。これは人生の完全放棄だ。ズバリ言う。モテない。面白くない。今すぐスマホを置いて外に出ろ。";}const high=selectedItems.filter(i=>i.score>=8).map(i=>i.name);const mid=selectedItems.filter(i=>i.score>=4&&i.score<8).map(i=>i.name);const low=selectedItems.filter(i=>i.score<4).map(i=>i.name);document.getElementById('resScore').innerHTML=displayScore+'<span>/100</span>';document.getElementById('resGrade').textContent=grade;document.getElementById('resVerdict').textContent=verdict;let hobbyHTML='<div class="hobby-list-title">選んだ趣味</div>';if(high.length)hobbyHTML+=high.map(n=>'<span class="hobby-tag high">'+n+'</span>').join('');if(mid.length)hobbyHTML+=mid.map(n=>'<span class="hobby-tag mid">'+n+'</span>').join('');if(low.length)hobbyHTML+=low.map(n=>'<span class="hobby-tag low">'+n+'</span>').join('');document.getElementById('resHobbies').innerHTML=hobbyHTML;document.getElementById('main').style.display='none';document.getElementById('result').style.display='block';window.scrollTo(0,0);}function retry(){selected.clear();document.querySelectorAll('.hobby-btn').forEach(b=>b.classList.remove('selected'));document.getElementById('selectedCount').textContent='0個選択中';document.getElementById('judgeBtn').disabled=true;document.getElementById('result').style.display='none';document.getElementById('main').style.display='block';window.scrollTo(0,0);}renderList();setTimeout(()=>{const s=document.getElementById('splash');s.style.opacity='0';setTimeout(()=>{s.style.display='none';document.getElementById('main').style.display='block';},800);},2000);</script></body></html>
