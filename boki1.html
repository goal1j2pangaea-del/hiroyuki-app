
<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"><title>簿記検定3級 by Hiroyuki</title><link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet"><style>:root{--blue:#1a56db;--dark:#050810;--cream:#f0f4ff;--gold:#c8a84b;--gray:#111827;--light-gray:#1e2433;}*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}body{background:var(--dark);min-height:100vh;font-family:'Zen Kaku Gothic New',sans-serif;color:var(--cream);overflow-x:hidden;}#splash{position:fixed;inset:0;background:var(--dark);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity 0.8s;}.splash-icon{font-size:4rem;margin-bottom:1rem;animation:bounce 1s ease-in-out infinite alternate;}@keyframes bounce{from{transform:translateY(0);}to{transform:translateY(-12px);}}.splash-title{font-family:'Noto Serif JP',serif;font-size:clamp(1.8rem,8vw,3.5rem);font-weight:700;color:#fff;text-align:center;line-height:1.2;}.splash-title span{color:#60a5fa;}.splash-credit{font-size:0.72rem;color:rgba(240,244,255,0.4);letter-spacing:0.2em;margin-top:0.8rem;text-align:center;line-height:1.8;}.splash-credit strong{color:var(--gold);}.splash-bar{width:200px;height:2px;background:rgba(255,255,255,0.1);border-radius:2px;margin-top:2rem;overflow:hidden;}.splash-fill{height:100%;width:0%;background:var(--blue);border-radius:2px;animation:loadBar 2s ease forwards;}@keyframes loadBar{to{width:100%;}}#main{display:none;min-height:100vh;padding:0 0 4rem;background:var(--dark);}.header{background:var(--blue);padding:1.2rem 1.5rem;position:sticky;top:0;z-index:50;}.header-title{font-family:'Noto Serif JP',serif;font-size:1.1rem;font-weight:700;color:#fff;}.header-sub{font-size:0.62rem;color:rgba(255,255,255,0.8);letter-spacing:0.15em;margin-top:0.2rem;}.progress-wrap{padding:1rem 1.5rem 0;background:var(--dark);}.progress-bar{height:3px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;}.progress-fill{height:100%;background:var(--blue);border-radius:2px;transition:width 0.4s ease;}.progress-label{font-size:0.68rem;color:rgba(240,244,255,0.5);letter-spacing:0.2em;margin-top:0.5rem;text-align:right;}.question-card{padding:1.5rem;background:var(--dark);}.q-number{font-size:0.65rem;color:#60a5fa;letter-spacing:0.35em;margin-bottom:0.8rem;}.q-level{display:inline-block;background:rgba(26,86,219,0.2);border:1px solid rgba(96,165,250,0.3);color:#60a5fa;font-size:0.6rem;padding:0.2em 0.7em;border-radius:20px;letter-spacing:0.15em;margin-bottom:0.8rem;}.q-scene{background:var(--light-gray);border-radius:10px;padding:1.2rem;margin-bottom:1.2rem;font-size:0.88rem;line-height:1.9;color:#fff;border-left:3px solid var(--blue);}.q-text{font-size:0.95rem;font-weight:700;line-height:1.6;margin-bottom:1.4rem;color:#fff;}.options{display:flex;flex-direction:column;gap:0.7rem;}.opt-btn{background:var(--light-gray);border:2px solid rgba(255,255,255,0.08);border-radius:10px;padding:1rem 1.1rem;cursor:pointer;text-align:left;font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.82rem;color:#fff;line-height:1.6;transition:all 0.15s;position:relative;}.opt-btn:active{transform:scale(0.98);}.opt-label{font-size:0.62rem;color:rgba(240,244,255,0.35);margin-bottom:0.3rem;letter-spacing:0.1em;}.opt-btn.correct{background:rgba(0,200,100,0.12);border-color:#00c864;}.opt-btn.correct::after{content:'⭕ 正解';position:absolute;top:8px;right:10px;color:#00c864;font-size:0.7rem;font-weight:700;}.opt-btn.wrong{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.4);}.opt-btn.wrong::after{content:'✖ 不正解';position:absolute;top:8px;right:10px;color:#f87171;font-size:0.7rem;font-weight:700;}.opt-btn.answer-reveal{background:rgba(0,200,100,0.06);border-color:rgba(0,200,100,0.25);}.opt-btn.answer-reveal::after{content:'⭕ 正解はこれ';position:absolute;top:8px;right:10px;color:#00c864;font-size:0.7rem;font-weight:700;}.feedback-box{margin-top:1.2rem;padding:1.1rem 1.2rem;border-radius:10px;background:rgba(200,168,75,0.08);border:1px solid rgba(200,168,75,0.25);font-size:0.85rem;color:#fde68a;line-height:1.9;display:none;}.feedback-box .fb-title{font-size:0.62rem;color:var(--gold);letter-spacing:0.25em;margin-bottom:0.5rem;}.next-btn{width:100%;padding:1rem;background:var(--blue);border:none;border-radius:10px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:700;color:#fff;cursor:pointer;margin-top:1.2rem;letter-spacing:0.1em;display:none;}#result{display:none;min-height:100vh;background:var(--dark);}.result-header{background:var(--blue);padding:2rem 1.5rem 1.8rem;text-align:center;}.result-label{font-size:0.68rem;letter-spacing:0.4em;color:rgba(255,255,255,0.7);margin-bottom:0.5rem;}.result-score{font-family:'Noto Serif JP',serif;font-size:clamp(4rem,18vw,8rem);font-weight:700;color:#fff;line-height:1;}.result-score span{font-size:clamp(1rem,4vw,2rem);opacity:0.7;}.result-grade{font-size:clamp(1.1rem,5vw,2rem);font-weight:700;color:#fff;margin-top:0.4rem;}.result-body{padding:1.5rem;background:var(--dark);}.verdict-box{background:var(--light-gray);border-left:4px solid var(--blue);border-radius:0 10px 10px 0;padding:1.3rem;margin-bottom:1.2rem;}.verdict-title{font-size:0.62rem;letter-spacing:0.35em;color:#60a5fa;margin-bottom:0.7rem;}.verdict-text{font-size:0.88rem;line-height:2;color:#fff;}.score-detail{background:var(--light-gray);border-radius:10px;padding:1.2rem;margin-bottom:1.2rem;}.score-detail-title{font-size:0.62rem;letter-spacing:0.3em;color:rgba(240,244,255,0.35);margin-bottom:1rem;}.score-row{display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:0.78rem;}.score-row:last-child{border-bottom:none;}.score-row-q{color:rgba(240,244,255,0.7);flex:1;padding-right:0.5rem;}.score-row-pt.full{color:#00c864;font-weight:700;}.score-row-pt.zero{color:rgba(240,244,255,0.25);font-weight:700;}.sensei-btn{width:100%;padding:1.1rem;background:linear-gradient(135deg,#1a56db,#3b82f6);border:none;border-radius:10px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:700;color:#fff;cursor:pointer;margin-top:0.5rem;letter-spacing:0.05em;box-shadow:0 4px 20px rgba(26,86,219,0.4);}.retry-btn{width:100%;padding:1rem;background:transparent;border:1px solid rgba(255,255,255,0.12);border-radius:10px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.85rem;color:rgba(240,244,255,0.4);cursor:pointer;margin-top:0.7rem;}.by-line{text-align:center;font-size:0.65rem;color:rgba(240,244,255,0.2);letter-spacing:0.2em;margin-top:1.5rem;line-height:1.8;}#senseiScreen{display:none;position:fixed;inset:0;background:var(--dark);z-index:200;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;}.sensei-icon{font-size:5rem;margin-bottom:1.5rem;}.sensei-title{font-family:'Noto Serif JP',serif;font-size:clamp(1.5rem,7vw,3rem);font-weight:700;color:#fff;margin-bottom:1rem;line-height:1.3;}.sensei-title span{color:#60a5fa;}.sensei-book{font-size:6rem;margin:1.5rem 0;display:block;}.sensei-msg{font-size:0.9rem;line-height:2;color:rgba(240,244,255,0.7);margin-bottom:2rem;max-width:320px;}.sensei-msg strong{color:#fff;}.sensei-close{padding:0.9rem 2.5rem;background:var(--blue);border:none;border-radius:10px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.9rem;font-weight:700;color:#fff;cursor:pointer;letter-spacing:0.1em;}</style></head><body><div id="splash"><div class="splash-icon">📒</div><div class="splash-title">簿記検定<span>3級</span></div><div class="splash-credit">仕訳の基礎を問う<br><strong>by Hiroyuki先生</strong></div><div class="splash-bar"><div class="splash-fill"></div></div></div><div id="main"><div class="header"><div class="header-title">簿記検定3級</div><div class="header-sub">by Hiroyuki先生</div></div><div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div><div class="progress-label" id="progressLabel">0 / 5</div></div><div class="question-card" id="questionCard"></div></div><div id="result"><div class="result-header"><div class="result-label">簿記検定3級　総合スコア</div><div class="result-score" id="resScore">0<span>/100</span></div><div class="result-grade" id="resGrade"></div></div><div class="result-body"><div class="verdict-box"><div class="verdict-title">✦ 総括</div><div class="verdict-text" id="resVerdict"></div></div><div class="score-detail"><div class="score-detail-title">✦ 問題別スコア</div><div id="scoreRows"></div></div><button class="sensei-btn" onclick="showSensei()">📚 ひろゆき先生に習う</button><button class="retry-btn" onclick="retry()">↺ もう一度受ける</button><div class="by-line">簿記検定3級<br>by Hiroyuki先生</div></div></div><div id="senseiScreen"><div class="sensei-icon">👨‍🏫</div><div class="sensei-title">ひろゆき<span>先生</span>の<br>特別授業</div><span class="sensei-book">📗</span><div class="sensei-msg"><strong>「自分で勉強しろ！」</strong><br><br>まず『スッキリわかる 簿記3級』を買え。<br>読め。問題を解け。<br>それだけで受かる。<br><br><strong>先生に頼るな。テキストに頼れ。</strong></div><button class="sensei-close" onclick="closeSensei()">わかりました先生 🫡</button></div><script>const QUESTIONS=[{level:"仕訳・基本",scene:"商品10,000円を現金で仕入れた。",q:"正しい仕訳はどれか？",opts:[{text:"借方：仕入 10,000\n貸方：現金 10,000",score:20},{text:"借方：現金 10,000\n貸方：仕入 10,000",score:0},{text:"借方：売上 10,000\n貸方：現金 10,000",score:0}],answer:0,feedback:"仕入は費用。費用は借方に記入する。現金が出ていくので貸方に現金を記入する。「商品を買う＝仕入（借方）、現金が減る＝現金（貸方）」と覚えよう。"},{level:"仕訳・売掛金",scene:"商品20,000円を掛けで売り上げた。",q:"正しい仕訳はどれか？",opts:[{text:"借方：現金 20,000\n貸方：売上 20,000",score:0},{text:"借方：買掛金 20,000\n貸方：売上 20,000",score:0},{text:"借方：売掛金 20,000\n貸方：売上 20,000",score:20}],answer:2,feedback:"「掛けで売る」＝後払いで売ること。代金はまだ受け取っていないので「売掛金（資産）」が増える。売上は収益なので貸方に記入する。買掛金は「掛けで買った」時に使う勘定科目。"},{level:"仕訳・費用",scene:"事務所の家賃50,000円を現金で支払った。",q:"正しい仕訳はどれか？",opts:[{text:"借方：受取家賃 50,000\n貸方：現金 50,000",score:0},{text:"借方：支払家賃 50,000\n貸方：現金 50,000",score:20},{text:"借方：現金 50,000\n貸方：支払家賃 50,000",score:0}],answer:1,feedback:"家賃を「払う側」は支払家賃（費用）、「受け取る側」は受取家賃（収益）。費用は借方。現金が減るので貸方に現金を記入する。混同しやすいので注意。"},{level:"仕訳・負債の決済",scene:"先日の買掛金30,000円を現金で支払った。",q:"正しい仕訳はどれか？",opts:[{text:"借方：買掛金 30,000\n貸方：現金 30,000",score:20},{text:"借方：売掛金 30,000\n貸方：現金 30,000",score:0},{text:"借方：現金 30,000\n貸方：買掛金 30,000",score:0}],answer:0,feedback:"買掛金は負債（貸方残高）。支払うことで買掛金が減る＝借方に記入して消す。現金が出ていく＝貸方に現金。負債は「増えたら貸方、減ったら借方」が基本ルール。"},{level:"概念問題",scene:"簿記の基本的な分類に関する問題。",q:"「資産」に該当するものはどれか？",opts:[{text:"借入金",score:0},{text:"資本金",score:0},{text:"売掛金",score:20}],answer:2,feedback:"売掛金は「将来受け取る権利（資産）」。借入金は「将来返す義務（負債）」。資本金は「出資された元手（純資産）」。資産・負債・純資産・収益・費用の5要素を覚えることが簿記の第一歩。"}];let currentQ=0,scores=[],answered=false;function renderQuestion(){const q=QUESTIONS[currentQ];const pct=(currentQ/QUESTIONS.length)*100;document.getElementById('progressFill').style.width=pct+'%';document.getElementById('progressLabel').textContent=currentQ+' / '+QUESTIONS.length;let html='<div class="q-number">Q'+(currentQ+1)+' / '+QUESTIONS.length+'</div>';html+='<div class="q-level">'+q.level+'</div>';html+='<div class="q-scene">'+q.scene+'</div>';html+='<div class="q-text">'+q.q+'</div>';html+='<div class="options">';q.opts.forEach((opt,i)=>{html+='<button class="opt-btn" id="opt'+i+'" onclick="answer('+i+')">';html+='<div class="opt-label">選択肢 '+'ABC'[i]+'</div>';html+='<div style="white-space:pre-line;font-family:monospace;font-size:0.85rem;color:#a5b4fc;line-height:1.8;">'+opt.text+'</div>';html+='</button>';});html+='</div>';html+='<div class="feedback-box" id="feedbackBox"><div class="fb-title">✦ 解説</div>'+q.feedback+'</div>';html+='<button class="next-btn" id="nextBtn" onclick="nextQuestion()">';html+=(currentQ+1>=QUESTIONS.length)?'結果を見る →':'次の問題 →';html+='</button>';document.getElementById('questionCard').innerHTML=html;answered=false;}function answer(idx){if(answered)return;answered=true;const q=QUESTIONS[currentQ];scores.push({q:'Q'+(currentQ+1),score:q.opts[idx].score,label:q.level});q.opts.forEach((opt,i)=>{const btn=document.getElementById('opt'+i);btn.disabled=true;if(i===q.answer){if(i===idx){btn.classList.add('correct');}else{btn.classList.add('answer-reveal');}}else if(i===idx){btn.classList.add('wrong');}});document.getElementById('feedbackBox').style.display='block';document.getElementById('nextBtn').style.display='block';}function nextQuestion(){currentQ++;if(currentQ>=QUESTIONS.length){showResult();}else{renderQuestion();}}function showResult(){const total=scores.reduce((a,b)=>a+b.score,0);let grade,verdict;if(total>=100){grade="満点！　簿記検定3級は余裕";verdict="全問正解。基礎は完璧だ。このまま2級に進め。仕訳のルールが体に染みついている証拠。あとは本番の試験で時間内に解く練習をすれば合格は近い。";}else if(total>=80){grade="合格圏内　あと少し";verdict="かなりわかっている。ミスした問題だけ復習すれば合格レベルに達する。解説を読んで「なぜ間違えたか」を確認しろ。";}else if(total>=60){grade="もう少し　基礎を固めよ";verdict="半分以上は理解できている。だが仕訳の借方・貸方のルールがまだ曖昧だ。資産・負債・費用・収益のどれが借方でどれが貸方か、表にして覚えろ。";}else if(total>=20){grade="基礎から出直せ";verdict="仕訳の基本ルールが定着していない。まず「資産・負債・純資産・収益・費用」の5要素と、それぞれが借方・貸方どちらに増えるかを完全に覚えること。そこからだ。";}else{grade="要勉強　今すぐテキストを開け";verdict="ゼロからの出発だ。恥ずかしいことではない。今日テキストを買って最初のページから読め。簿記検定3級は正しく勉強すれば3ヶ月で取れる資格だ。";}document.getElementById('resScore').innerHTML=total+'<span>/100</span>';document.getElementById('resGrade').textContent=grade;document.getElementById('resVerdict').textContent=verdict;let rowsHTML='';scores.forEach(s=>{const cls=s.score>0?'full':'zero';const mark=s.score>0?'⭕':'✖';rowsHTML+='<div class="score-row"><div class="score-row-q">'+s.q+'　'+s.label+'</div><div class="score-row-pt '+cls+'">'+mark+' '+s.score+'/20</div></div>';});document.getElementById('scoreRows').innerHTML=rowsHTML;document.getElementById('main').style.display='none';document.getElementById('result').style.display='block';window.scrollTo(0,0);}function showSensei(){document.getElementById('senseiScreen').style.display='flex';}function closeSensei(){document.getElementById('senseiScreen').style.display='none';}function retry(){currentQ=0;scores=[];answered=false;document.getElementById('result').style.display='none';document.getElementById('main').style.display='block';document.getElementById('progressFill').style.width='0%';document.getElementById('progressLabel').textContent='0 / 5';renderQuestion();window.scrollTo(0,0);}renderQuestion();setTimeout(()=>{const s=document.getElementById('splash');s.style.opacity='0';setTimeout(()=>{s.style.display='none';document.getElementById('main').style.display='block';},800);},2200);</script></body></html>
