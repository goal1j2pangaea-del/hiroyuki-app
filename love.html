
<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"><title>ラブ理論検定 by Hiroyuki</title><link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet"><style>:root{--pink:#e8005a;--dark:#08050f;--cream:#f5f0e8;--gold:#c8a84b;--gray:#1e1a2a;}*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}body{background:var(--dark);min-height:100vh;font-family:'Zen Kaku Gothic New',sans-serif;color:var(--cream);overflow-x:hidden;}#splash{position:fixed;inset:0;background:var(--dark);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity 0.8s;}.splash-title{font-family:'Noto Serif JP',serif;font-size:clamp(2rem,9vw,4rem);font-weight:700;color:var(--cream);text-align:center;line-height:1.2;}.splash-title span{color:var(--pink);}.splash-credit{font-size:0.72rem;color:rgba(245,240,232,0.4);letter-spacing:0.2em;margin-top:1rem;text-align:center;line-height:1.8;}.splash-credit strong{color:var(--gold);}.splash-bar{width:200px;height:2px;background:rgba(255,255,255,0.1);border-radius:2px;margin-top:2rem;overflow:hidden;}.splash-fill{height:100%;width:0%;background:var(--pink);border-radius:2px;animation:loadBar 2s ease forwards;}@keyframes loadBar{to{width:100%;}}#main{display:none;min-height:100vh;padding:0 0 4rem;background:var(--dark);}.header{background:var(--pink);padding:1.2rem 1.5rem;position:sticky;top:0;z-index:50;}.header-title{font-family:'Noto Serif JP',serif;font-size:1.1rem;font-weight:700;color:#fff;letter-spacing:0.05em;}.header-sub{font-size:0.62rem;color:rgba(255,255,255,0.85);letter-spacing:0.15em;margin-top:0.2rem;}.progress-wrap{padding:1rem 1.5rem 0;background:var(--dark);}.progress-bar{height:3px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;}.progress-fill{height:100%;background:var(--pink);border-radius:2px;transition:width 0.4s ease;}.progress-label{font-size:0.68rem;color:rgba(245,240,232,0.5);letter-spacing:0.2em;margin-top:0.5rem;text-align:right;}.question-card{padding:1.5rem;background:var(--dark);}.q-number{font-size:0.65rem;color:var(--pink);letter-spacing:0.35em;margin-bottom:0.8rem;}.q-scene{background:var(--gray);border-radius:10px;padding:1.1rem;margin-bottom:1.2rem;font-size:0.85rem;line-height:1.9;color:#fff;border-left:3px solid var(--pink);}.q-text{font-size:1rem;font-weight:700;line-height:1.6;margin-bottom:1.4rem;color:#fff;}.options{display:flex;flex-direction:column;gap:0.7rem;}.opt-btn{background:var(--gray);border:2px solid rgba(255,255,255,0.1);border-radius:10px;padding:1rem 1.1rem;cursor:pointer;text-align:left;font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.88rem;color:#fff;line-height:1.5;transition:all 0.15s;position:relative;}.opt-btn:active{transform:scale(0.98);}.opt-btn.correct{background:rgba(0,200,100,0.15);border-color:#00c864;}.opt-btn.correct::after{content:'⭕ 正解';position:absolute;top:8px;right:10px;color:#00c864;font-size:0.72rem;font-weight:700;}.opt-btn.wrong{background:rgba(232,0,90,0.1);border-color:rgba(232,0,90,0.5);}.opt-btn.wrong::after{content:'✖ 不正解';position:absolute;top:8px;right:10px;color:#ff4477;font-size:0.72rem;font-weight:700;}.opt-btn.partial{background:rgba(200,168,75,0.12);border-color:rgba(200,168,75,0.5);}.opt-btn.partial::after{content:'△ 惜しい';position:absolute;top:8px;right:10px;color:var(--gold);font-size:0.72rem;font-weight:700;}.opt-btn.answer-reveal{background:rgba(0,200,100,0.08);border-color:rgba(0,200,100,0.3);}.opt-btn.answer-reveal::after{content:'⭕ これが正解';position:absolute;top:8px;right:10px;color:#00c864;font-size:0.72rem;font-weight:700;}.opt-label{font-size:0.65rem;color:rgba(245,240,232,0.4);margin-bottom:0.3rem;letter-spacing:0.1em;}.feedback-box{margin-top:1.2rem;padding:1rem 1.2rem;border-radius:10px;background:rgba(200,168,75,0.1);border:1px solid rgba(200,168,75,0.3);font-size:0.85rem;color:#f0d878;line-height:1.85;display:none;}.next-btn{width:100%;padding:1rem;background:var(--pink);border:none;border-radius:10px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:700;color:#fff;cursor:pointer;margin-top:1.2rem;letter-spacing:0.1em;display:none;}#result{display:none;min-height:100vh;background:var(--dark);}.result-header{background:var(--pink);padding:2rem 1.5rem 1.8rem;text-align:center;}.result-label{font-size:0.68rem;letter-spacing:0.4em;color:rgba(255,255,255,0.75);margin-bottom:0.5rem;}.result-score{font-family:'Noto Serif JP',serif;font-size:clamp(4rem,18vw,8rem);font-weight:700;color:#fff;line-height:1;}.result-score span{font-size:clamp(1rem,4vw,2rem);opacity:0.7;}.result-grade{font-size:clamp(1.2rem,5vw,2.2rem);font-weight:700;color:#fff;margin-top:0.4rem;font-family:'Noto Serif JP',serif;}.result-body{padding:1.5rem;background:var(--dark);}.verdict-box{background:var(--gray);border-left:4px solid var(--pink);border-radius:0 10px 10px 0;padding:1.3rem;margin-bottom:1.2rem;}.verdict-title{font-size:0.62rem;letter-spacing:0.35em;color:var(--pink);margin-bottom:0.7rem;}.verdict-text{font-size:0.88rem;line-height:2;color:#fff;}.score-detail{background:var(--gray);border-radius:10px;padding:1.2rem;margin-bottom:1.2rem;}.score-detail-title{font-size:0.62rem;letter-spacing:0.3em;color:rgba(245,240,232,0.4);margin-bottom:1rem;}.score-row{display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0;border-bottom:1px solid rgba(255,255,255,0.06);font-size:0.78rem;}.score-row:last-child{border-bottom:none;}.score-row-q{color:rgba(245,240,232,0.75);flex:1;padding-right:0.5rem;}.score-row-pt{font-weight:700;white-space:nowrap;}.score-row-pt.full{color:#00c864;}.score-row-pt.half{color:var(--gold);}.score-row-pt.zero{color:rgba(245,240,232,0.3);}.by-line{text-align:center;font-size:0.68rem;color:rgba(245,240,232,0.25);letter-spacing:0.25em;margin-top:1.5rem;padding-bottom:0.5rem;line-height:1.8;}.retry-btn{width:100%;padding:1rem;background:transparent;border:1px solid rgba(255,255,255,0.15);border-radius:10px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.85rem;color:rgba(245,240,232,0.5);cursor:pointer;margin-top:0.5rem;}</style></head><body><div id="splash"><div class="splash-title">ラブ理論<span>検定</span></div><div class="splash-credit">水野敬也『LOVE理論』より<br><strong>presented by Hiroyuki</strong></div><div class="splash-bar"><div class="splash-fill"></div></div></div><div id="main"><div class="header"><div class="header-title">ラブ理論検定</div><div class="header-sub">あなたの「モテる行動」を採点する</div></div><div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div><div class="progress-label" id="progressLabel">0 / 10</div></div><div class="question-card" id="questionCard"></div></div><div id="result"><div class="result-header"><div class="result-label">ラブ理論検定　総合スコア</div><div class="result-score" id="resScore">0<span>/100</span></div><div class="result-grade" id="resGrade"></div></div><div class="result-body"><div class="verdict-box"><div class="verdict-title">✦ 総括</div><div class="verdict-text" id="resVerdict"></div></div><div class="score-detail"><div class="score-detail-title">✦ 問題別スコア</div><div id="scoreRows"></div></div><div class="by-line">水野敬也『LOVE理論』より<br>presented by Hiroyuki</div><button class="retry-btn" onclick="retry()">↺ もう一度受ける</button></div></div><script>const QUESTIONS=[{scene:"彼女からLINEが届いた。「今日仕事でミスしちゃって…上司にも怒られたし最悪」",q:"あなたの返信は？",opts:[{text:"「それは上司が悪い。次からはこうすればいいよ」とアドバイスを送る",score:0},{text:"「そっか、辛かったね。大丈夫？」とだけ返す",score:10},{text:"「俺も昔そういうことあってさ、その時は…」と自分の話をする",score:0}],answer:1,feedback:"女性が愚痴を言う時に求めているのは解決策ではなく共感だ。アドバイスも自分語りも「私の話を聞いて」という信号を無視している。正解はただ寄り添うこと。"},{scene:"レストランに入った。テーブルに着こうとしている。",q:"あなたはどう動く？",opts:[{text:"先に座ってメニューを開く",score:0},{text:"椅子を引いて彼女を先に座らせる",score:10},{text:"「どっちに座る？」と彼女に聞く",score:3}],answer:1,feedback:"「聞く」より「やる」が上っ面カインドネスの鉄則。椅子を引くという行為は「私はあなたのことを気にかけている」という無言のメッセージだ。聞いてからでは遅い。"},{scene:"デートで会った瞬間、彼女の髪が短くなっていた。",q:"あなたはどうする？",opts:[{text:"しばらく話してから「あ、髪切った？」と気づいて言う",score:5},{text:"会った瞬間に「髪切った？めちゃくちゃ似合ってる」と言う",score:10},{text:"彼女が言うまで何も言わない",score:0}],answer:1,feedback:"気づくのは最低限。大事なのは「会った瞬間に」言うことだ。後から言うのでは「気にかけてなかったけど一応言った」に聞こえる。即座の反応が「いつもあなたを見ている」を証明する。"},{scene:"食事中、彼女のグラスが空になっていることに気づいた。",q:"あなたはどうする？",opts:[{text:"彼女が頼むまで待つ",score:0},{text:"「何飲む？」と聞いてすぐ注文する",score:10},{text:"自分のグラスも空になったタイミングで一緒に頼む",score:3}],answer:1,feedback:"グラスが空になる前に気づくのが理想。「何飲む？」の一言は「私はあなたを見ている」という積み重ねの1点だ。自分のついでに頼むのは「あなたのため」ではなく「自分のついで」。"},{scene:"彼女が「最近太ったかも…」と呟いた。",q:"あなたはどう返す？",opts:[{text:"「そんなことないよ」とすぐ否定する",score:3},{text:"「どこが？全然わからない」と具体的に否定する",score:10},{text:"「少し運動してみれば？」とアドバイスする",score:0}],answer:1,feedback:"「そんなことない」は曖昧で信頼性がない。「どこが？全然わからない」は具体的な否定で説得力が増す。アドバイスは論外。彼女は解決策を求めていない。"},{scene:"彼女が友人の愚痴を話し始めた。「Aちゃんって本当に自分勝手で…」",q:"あなたはどう聞く？",opts:[{text:"「そいつ最低だな。そんな友達いらないんじゃない？」と言う",score:0},{text:"「それは腹立つよね」「うんうん」と相槌を打ち続ける",score:10},{text:"「でも相手の立場から見ると…」と客観的な意見を言う",score:0}],answer:1,feedback:"愚痴を聞く時のミッションは「共感し続けること」だけだ。解決策も客観的意見も不要。「そいつ最低」も余計な評価。ただ「そうだよね」と言い続けるのが正解。"},{scene:"寒い日のデート。彼女が薄着で来た。",q:"あなたはどうする？",opts:[{text:"何も言わない。彼女が寒いと言ったら対応する",score:0},{text:"「寒くない？」と聞いてジャケットを渡す準備をする",score:10},{text:"「薄着だね」と一言言う",score:2}],answer:1,feedback:"「寒くない？」という一言は「私はあなたの体調を気にかけている」というメッセージだ。言われてから動くのでは遅い。先回りして気にかけることが上っ面カインドネスの本質。"},{scene:"彼女が明らかに落ち込んでいる。「別に…何でもない」と言っている。",q:"あなたはどうする？",opts:[{text:"「なんかあったの？言ってよ」と詰め寄る",score:0},{text:"「そっか。隣にいるよ」と言って黙って寄り添う",score:10},{text:"「元気出して！美味しいもの食べに行こう！」と気分転換を提案する",score:3}],answer:1,feedback:"「言ってよ」は圧力だ。「元気出して」は相手の感情を否定している。「何でもない」と言った時に必要なのは解決でも励ましでもなく、ただそこにいること。沈黙と存在が最強の答え。"},{scene:"彼女が新しい服を着てデートに来た。",q:"あなたはどう反応する？",opts:[{text:"気づいた時に「それ新しい服？」と聞く",score:5},{text:"会った瞬間に「それ新しい服？めちゃくちゃ似合ってる」と言う",score:10},{text:"彼女が「新しい服なんだけど」と言ってから褒める",score:2}],answer:1,feedback:"褒めるタイミングが全てだ。会った瞬間に気づいて言う。それだけで「会う前からあなたのことを楽しみにしていた」が伝わる。聞いてから褒めるのは減点。"},{scene:"帰り道、彼女が荷物をたくさん持って歩いている。",q:"あなたはどうする？",opts:[{text:"彼女が「持って」と言うまで待つ",score:0},{text:"「持とうか？」と一声かけてから持つ",score:7},{text:"何も言わず自然に荷物を手に取る",score:10}],answer:2,feedback:"「持とうか？」と聞くのは悪くない。しかし最上級は聞かずに自然に持つことだ。聞く行為には「持ってほしいと言わせる」という手間がある。無言で動くのが「気が利く男」の証明。"}];let currentQ=0,scores=[],answered=false;function renderQuestion(){const q=QUESTIONS[currentQ];const pct=(currentQ/QUESTIONS.length)*100;document.getElementById('progressFill').style.width=pct+'%';document.getElementById('progressLabel').textContent=currentQ+' / '+QUESTIONS.length;let html='<div class="q-number">Q'+(currentQ+1)+' / '+QUESTIONS.length+'</div>';html+='<div class="q-scene">'+q.scene+'</div>';html+='<div class="q-text">'+q.q+'</div>';html+='<div class="options">';q.opts.forEach((opt,i)=>{html+='<button class="opt-btn" id="opt'+i+'" onclick="answer('+i+')">';html+='<div class="opt-label">選択肢 '+'ABC'[i]+'</div>';html+=opt.text;html+='</button>';});html+='</div>';html+='<div class="feedback-box" id="feedbackBox">'+q.feedback+'</div>';html+='<button class="next-btn" id="nextBtn" onclick="nextQuestion()">';html+=(currentQ+1>=QUESTIONS.length)?'結果を見る →':'次の問題 →';html+='</button>';document.getElementById('questionCard').innerHTML=html;answered=false;}function answer(idx){if(answered)return;answered=true;const q=QUESTIONS[currentQ];const selected=q.opts[idx];scores.push({q:'Q'+(currentQ+1),score:selected.score,max:10,text:q.q.slice(0,15)+'…'});q.opts.forEach((opt,i)=>{const btn=document.getElementById('opt'+i);btn.disabled=true;if(i===q.answer){if(i===idx){btn.classList.add('correct');}else{btn.classList.add('answer-reveal');}}else if(i===idx){if(opt.score>=3){btn.classList.add('partial');}else{btn.classList.add('wrong');}}});document.getElementById('feedbackBox').style.display='block';document.getElementById('nextBtn').style.display='block';}function nextQuestion(){currentQ++;if(currentQ>=QUESTIONS.length){showResult();}else{renderQuestion();}}function showResult(){const total=scores.reduce((a,b)=>a+b.score,0);const max=QUESTIONS.length*10;let grade,verdict;if(total>=90){grade="S級　本物のモテ男";verdict="完璧だ。上っ面カインドネスを完全に体得している。気が利く、先読みする、共感できる。これを無意識にやれているなら女性は確実にあなたを特別扱いする。この水準を維持しろ。";}else if(total>=70){grade="A級　かなりわかってる";verdict="十分に高い。基本的な行動はできている。ただ満点が取れなかった問題をもう一度見ろ。「聞いてからやる」か「黙ってやる」か、「そうだね」だけで終われるか。その差が積み重なって大きくなる。";}else if(total>=50){grade="B級　まだまだ甘い";verdict="半分はわかっているが、半分はまだ「男の論理」で動いている。アドバイスしたくなる、正論を言いたくなる、自分の話をしたくなる。その衝動を全部抑えろ。女性が求めているのは解決策ではなく共感だ。";}else if(total>=30){grade="C級　根本的にズレてる";verdict="正直に言う。あなたはまだ「自分が正しいと思うこと」をしている。女性の感情より自分の論理を優先している。上っ面カインドネスの本質は「女性の自己没頭を満たすこと」だ。あなたの意見は不要。まずそこから理解しろ。";}else{grade="D級　論外";verdict="壊滅的だ。アドバイス、正論、自分語り、反応しない。これを全部やっている。女性の「私を見て」という信号を全て無視している。モテないのは顔のせいでも収入のせいでもない。行動のせいだ。今日からやり直せ。";}document.getElementById('resScore').innerHTML=total+'<span>/'+max+'</span>';document.getElementById('resGrade').textContent=grade;document.getElementById('resVerdict').textContent=verdict;let rowsHTML='';scores.forEach(s=>{const cls=s.score>=10?'full':s.score>=5?'half':'zero';rowsHTML+='<div class="score-row"><div class="score-row-q">'+s.q+'　'+s.text+'</div><div class="score-row-pt '+cls+'">'+s.score+'/10</div></div>';});document.getElementById('scoreRows').innerHTML=rowsHTML;document.getElementById('progressFill').style.width='100%';document.getElementById('progressLabel').textContent=QUESTIONS.length+' / '+QUESTIONS.length;document.getElementById('main').style.display='none';document.getElementById('result').style.display='block';window.scrollTo(0,0);}function retry(){currentQ=0;scores=[];answered=false;document.getElementById('result').style.display='none';document.getElementById('main').style.display='block';document.getElementById('progressFill').style.width='0%';document.getElementById('progressLabel').textContent='0 / 10';renderQuestion();window.scrollTo(0,0);}renderQuestion();setTimeout(()=>{const s=document.getElementById('splash');s.style.opacity='0';setTimeout(()=>{s.style.display='none';document.getElementById('main').style.display='block';},800);},2200);</script></body></html>
