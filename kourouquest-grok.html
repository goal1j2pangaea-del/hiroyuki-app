<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>厚労クエスト Grok Edition - ファミコン風</title>
<style>
  body { 
    background: #000; color: #0f0; font-family: 'Courier New', monospace; 
    text-align: center; image-rendering: pixelated;
  }
  .game { 
    width: 600px; margin: 20px auto; border: 4px solid #fff; 
    background: #111; padding: 10px; box-shadow: 0 0 20px #0f0;
  }
  .screen { 
    background: #222; border: 4px solid #555; height: 320px; 
    position: relative; overflow: hidden; font-size: 18px;
  }
  .enemy { font-size: 48px; position: absolute; top: 60px; right: 80px; }
  .hero { font-size: 40px; position: absolute; bottom: 60px; left: 80px; }
  button { 
    background: #300; color: #0f0; border: 2px solid #0f0; 
    padding: 10px 20px; margin: 5px; font-size: 16px; cursor: pointer;
  }
  button:hover { background: #500; }
  .log { height: 120px; overflow-y: auto; text-align: left; padding: 10px; background: #000; }
</style>
</head>
<body>
<div class="game">
  <h1>◆ 厚労クエスト ◆</h1>
  <div class="screen" id="screen">
    <div style="position:absolute;top:10px;left:10px;color:#ff0;">妖怪 厚生労働省（第1形態）</div>
    <div class="enemy" id="enemy">👹</div>
    <div class="hero" id="hero">🛡️</div>
    <div style="position:absolute;bottom:10px;left:10px;" id="status">HP: 100　LP: 50</div>
  </div>
  
  <div id="message">保険料という名の迷宮…<br>納税者よ、論破せよ！</div>
  
  <div class="log" id="log"></div>
  
  <div id="choices"></div>
</div>

<script>
// 簡易ゲームデータ
let hp = 100;
let lp = 50;
let enemyHp = 120;

const log = document.getElementById('log');
const message = document.getElementById('message');
const choicesDiv = document.getElementById('choices');
const status = document.getElementById('status');

function addLog(text) {
  log.innerHTML += text + '<br>';
  log.scrollTop = log.scrollHeight;
}

function updateStatus() {
  status.textContent = `HP: ${hp}　LP: ${lp}　敵HP: ${enemyHp}`;
}

function attack(power, cost, text) {
  if (lp < cost) {
    addLog("❌ LPが足りない！");
    return;
  }
  lp -= cost;
  enemyHp -= power;
  addLog(`→ ${text} (ダメージ ${power})`);
  
  if (enemyHp <= 0) {
    message.innerHTML = "🎉 妖怪 厚生労働省を論破した！<br>完全勝利！";
    choicesDiv.innerHTML = "";
    return;
  }
  
  // 敵の反撃
  hp -= 12;
  addLog("厚労省「それは誤解です…」 (被ダメージ 12)");
  
  if (hp <= 0) {
    message.innerHTML = "💀 論破され、保険料迷宮に飲み込まれた…";
    choicesDiv.innerHTML = "";
    return;
  }
  
  updateStatus();
  showChoices();
}

function showChoices() {
  choicesDiv.innerHTML = `
    <button onclick="attack(18, 8, 'まあ…負担増は避けられないかも')">1. 弱め反論</button>
    <button onclick="attack(28, 18, '透明性が足りない！データ公開を')">2. 中反論</button>
    <button onclick="attack(45, 32, '実質増税と給付先送りのカラクリを暴け！')">3. 強反論</button>
    <button onclick="addLog('解説: 保険料は現役世代の負担が急増中…')">4. 解説を読む (LP0)</button>
  `;
}

addLog("戦闘開始！");
updateStatus();
showChoices();
</script>
</body>
</html>
