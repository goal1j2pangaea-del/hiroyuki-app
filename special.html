

<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"><title>Special Message by Hiroyuki</title><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300;1,600&display=swap" rel="stylesheet"><style>:root{--gold:#d4a843;--rose:#e8a0a8;--deep:#010208;}*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}body{background:var(--deep);min-height:100vh;font-family:'Cormorant Garamond',serif;overflow-x:hidden;}#screenA{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;position:relative;background:linear-gradient(160deg,#080418 0%,#010208 50%,#0a0514 100%);}#screenA::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 25%,rgba(212,168,67,0.1) 0%,transparent 60%);pointer-events:none;}.input-title-wrap{text-align:center;margin-bottom:2.2rem;}.input-title{font-family:'Cinzel',serif;color:var(--gold);font-size:0.82rem;letter-spacing:0.45em;opacity:1;display:block;text-shadow:0 0 14px rgba(212,168,67,0.6);margin-bottom:0.5rem;}.input-by{font-family:"Cinzel",serif;font-size:0.65rem;color:rgba(212,168,67,0.7);letter-spacing:0.45em;display:block;}.field-group{width:100%;max-width:340px;margin-bottom:1.4rem;}.field-label{display:block;color:rgba(212,168,67,0.9);font-size:0.72rem;letter-spacing:0.25em;text-transform:uppercase;margin-bottom:0.5rem;font-weight:600;}.field-input{width:100%;background:rgba(255,255,255,0.09);border:1px solid rgba(212,168,67,0.5);border-radius:3px;padding:0.85rem 1rem;color:#fff;font-family:'Cormorant Garamond',serif;font-size:1.15rem;outline:none;-webkit-appearance:none;}.field-input::placeholder{color:rgba(245,230,208,0.4);}.photo-upload-area{width:100%;max-width:340px;border:1px dashed rgba(212,168,67,0.5);border-radius:3px;padding:1.2rem;text-align:center;cursor:pointer;margin-bottom:1.4rem;position:relative;}.photo-upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}.upload-icon{font-size:1.8rem;margin-bottom:0.4rem;}.upload-text{color:rgba(212,168,67,0.75);font-size:0.82rem;letter-spacing:0.1em;}#photoPreview{width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);margin:0 auto 0.4rem;display:none;}.lang-group{width:100%;max-width:340px;margin-bottom:2rem;}.lang-row{display:flex;gap:0.6rem;}.lang-btn{flex:1;background:rgba(255,255,255,0.07);border:1px solid rgba(212,168,67,0.4);border-radius:3px;padding:0.6rem;color:rgba(245,230,208,0.7);font-family:'Cormorant Garamond',serif;font-size:0.9rem;cursor:pointer;transition:all 0.2s;}.lang-btn.active{background:rgba(212,168,67,0.2);border-color:var(--gold);color:var(--gold);font-weight:600;}.go-btn{width:100%;max-width:340px;background:linear-gradient(135deg,#c49a2a,#e8c460,#c49a2a);border:none;border-radius:3px;padding:1rem;font-family:'Cinzel',serif;font-size:1rem;letter-spacing:0.3em;color:#1a0e00;cursor:pointer;font-weight:700;box-shadow:0 4px 30px rgba(212,168,67,0.3);}#screenB{display:none;position:fixed;inset:0;background:var(--deep);z-index:100;flex-direction:column;align-items:center;justify-content:center;}.scan-container{position:relative;width:220px;height:220px;}.hex-ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(212,168,67,0.2);animation:spin var(--spd) linear infinite;}.hex-ring:nth-child(1){--spd:3s;border-top-color:var(--gold);}.hex-ring:nth-child(2){inset:20px;--spd:2s;animation-direction:reverse;border-right-color:rgba(232,160,168,0.8);}.hex-ring:nth-child(3){inset:40px;--spd:4s;border-bottom-color:var(--gold);}@keyframes spin{to{transform:rotate(360deg);}}.scan-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}.scan-photo{width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);display:none;}.scan-icon{font-size:2.5rem;display:block;}.scanline{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);top:0;animation:scanDown 1.8s ease-in-out infinite;}@keyframes scanDown{0%{top:0;opacity:1;}100%{top:100%;opacity:0;}}.loading-name{font-family:'Cinzel',serif;color:var(--gold);font-size:1.3rem;letter-spacing:0.2em;margin-top:2rem;}.loading-status{color:rgba(212,168,67,0.5);font-size:0.7rem;letter-spacing:0.3em;margin-top:0.8rem;animation:blink 1.2s ease-in-out infinite;}@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}#screenC{display:none;position:fixed;inset:0;background:var(--deep);overflow:hidden;}#starCanvas{position:absolute;inset:0;width:100%;height:100%;}.moon-photo-wrap{position:absolute;top:12%;left:50%;transform:translateX(-50%);width:110px;height:110px;opacity:0;animation:moonRise 2s cubic-bezier(0.16,1,0.3,1) forwards 0.5s;z-index:20;}@keyframes moonRise{from{opacity:0;transform:translateX(-50%) translateY(30px) scale(0.7);}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}}.moon-photo{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid rgba(212,168,67,0.8);box-shadow:0 0 40px rgba(212,168,67,0.5);}.moon-glow{position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,rgba(212,168,67,0.25) 0%,transparent 70%);animation:glowPulse 3s ease-in-out infinite;}@keyframes glowPulse{0%,100%{transform:scale(1);opacity:0.7;}50%{transform:scale(1.1);opacity:1;}}.star-name-wrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;text-align:center;width:90%;}.star-name{font-family:'Cinzel',serif;font-size:clamp(3rem,14vw,7rem);font-weight:900;color:transparent;background:linear-gradient(180deg,#ffffff 0%,#e8c87a 50%,#d4a843 100%);-webkit-background-clip:text;background-clip:text;opacity:0;filter:blur(20px);animation:starGather 1.8s cubic-bezier(0.16,1,0.3,1) forwards 1.5s;letter-spacing:0.1em;}@keyframes starGather{0%{opacity:0;filter:blur(20px);transform:scale(1.3);}60%{opacity:0.9;filter:blur(2px);}100%{opacity:1;filter:blur(0);transform:scale(1);}}.star-message{position:absolute;bottom:14%;left:50%;transform:translateX(-50%);width:85%;max-width:360px;text-align:center;z-index:20;opacity:0;animation:fadeUp 1.2s ease forwards 3s;}@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(20px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}.star-message p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1rem,3.5vw,1.35rem);color:rgba(240,220,200,0.9);line-height:2;}.star-message .name-hl{color:#ffd87a;font-style:normal;font-weight:600;}.deco-div{width:60%;height:1px;margin:0.8rem auto;background:linear-gradient(90deg,transparent,rgba(212,168,67,0.6),transparent);}.msg-by{font-family:'Cinzel',serif;font-size:0.62rem;color:rgba(212,168,67,0.6);letter-spacing:0.4em;font-style:normal;margin-top:1.2rem;display:block;}.reset-btn{position:absolute;bottom:4%;right:5%;background:transparent;border:1px solid rgba(212,168,67,0.3);color:rgba(212,168,67,0.5);font-family:'Cinzel',serif;font-size:0.65rem;letter-spacing:0.3em;padding:0.6em 1.4em;cursor:pointer;border-radius:2px;z-index:30;opacity:0;animation:fadeUpSimple 0.8s ease forwards 4.5s;}@keyframes fadeUpSimple{from{opacity:0;}to{opacity:1;}}</style></head><body><div id="screenA"><div class="input-title-wrap"><span class="input-title">✦ Special Message ✦</span><span class="input-by">by Hiroyuki</span></div><div class="field-group"><label class="field-label">名前 / Name</label><input class="field-input" id="inputName" type="text" placeholder="Sally" maxlength="20"></div><div class="field-group"><label class="field-label">キーワード（任意）</label><input class="field-input" id="inputKeyword" type="text" placeholder="例: pinakamagandang bituin" maxlength="30"></div><div class="photo-upload-area"><img id="photoPreview" src="" alt=""><div id="uploadPlaceholder"><div class="upload-icon">📷</div><div class="upload-text">写真を追加（任意）<br><small>タップして選ぶ</small></div></div><input type="file" accept="image/*" id="photoInput" onchange="handlePhoto(this)"></div><div class="lang-group"><label class="field-label">メッセージの言語</label><div class="lang-row"><button class="lang-btn active" onclick="setLang('ja',this)">日本語</button><button class="lang-btn" onclick="setLang('en',this)">English</button><button class="lang-btn" onclick="setLang('tl',this)">Tagalog</button></div></div><button class="go-btn" onclick="startReveal()">✦ REVEAL ✦</button></div><div id="screenB"><div class="scan-container"><div class="hex-ring"></div><div class="hex-ring"></div><div class="hex-ring"></div><div class="scanline"></div><div class="scan-center"><img id="scanPhoto" class="scan-photo" src="" alt=""><span class="scan-icon" id="scanIcon">👤</span></div></div><div class="loading-name" id="loadingName">---</div><div class="loading-status" id="loadingStatus">SCANNING...</div></div><div id="screenC"><canvas id="starCanvas"></canvas><div class="moon-photo-wrap" id="moonWrap" style="display:none;"><div class="moon-glow"></div><img class="moon-photo" id="moonPhoto" src="" alt=""></div><div class="star-name-wrap"><div class="star-name" id="starName">SALLY</div></div><div class="star-message" id="starMessage"><div class="deco-div"></div><p id="msgText"></p><div class="deco-div"></div><p id="msgKeyword" style="color:rgba(212,168,67,0.7);font-size:0.8rem;letter-spacing:0.2em;font-style:normal;margin-top:0.5rem;"></p><span class="msg-by" id="msgBy"></span></div><button class="reset-btn" onclick="resetAll()">↺ RESET</button></div><script>let selectedLang='ja';let photoDataUrl=null;function setLang(lang,btn){selectedLang=lang;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}function handlePhoto(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(e){photoDataUrl=e.target.result;const p=document.getElementById('photoPreview');p.src=photoDataUrl;p.style.display='block';document.getElementById('uploadPlaceholder').style.display='none';};reader.onerror=function(){alert('写真の読み込みに失敗しました。');};reader.readAsDataURL(file);}const messages={ja:['{name}、あなたがいるだけで\nこの夜空はもっと美しくなる。','世界中の星を集めても、\n{name}の輝きには敵わない。','今夜、{name}は\n空に浮かぶ星そのもの。','{name}、あなたは\nこの夜で一番の光だ。'],en:['{name}, just by being here,\nthe night sky grows more beautiful.','All the stars cannot outshine {name}.','{name} is the star\nfloating in the sky tonight.','{name}, you are\nthe brightest light this night.'],tl:['{name}, dahil nandito ka,\nmas maganda ang gabi ngayon.','Lahat ng bituin ay hindi kayang talunin\nang liwanag ni {name}.','Ngayong gabi, si {name}\nay isang bituin sa kalangitan.','{name}, ikaw ang\npinakamaliwanag na liwanag ngayong gabi.']};const statusMsgs=['SCANNING UNIQUE AURA...','MAPPING THE STARS...','UNLOCKING THE NIGHT SKY...','GENERATING YOUR UNIVERSE...'];function startReveal(){const name=document.getElementById('inputName').value.trim();if(!name){document.getElementById('inputName').focus();return;}const B=document.getElementById('screenB');B.style.display='flex';document.getElementById('loadingName').textContent=name.toUpperCase();const sp=document.getElementById('scanPhoto'),si=document.getElementById('scanIcon');if(photoDataUrl){sp.src=photoDataUrl;sp.style.display='block';si.style.display='none';}let idx=0;const iv=setInterval(()=>{idx=(idx+1)%statusMsgs.length;document.getElementById('loadingStatus').textContent=statusMsgs[idx];},600);setTimeout(()=>{clearInterval(iv);B.style.display='none';showReveal(name);},3000);}function showReveal(name){const keyword=document.getElementById('inputKeyword').value.trim();const pool=messages[selectedLang];const raw=pool[Math.floor(Math.random()*pool.length)];const msg=raw.replace(/{name}/g,name);const mw=document.getElementById('moonWrap');if(photoDataUrl){document.getElementById('moonPhoto').src=photoDataUrl;mw.style.display='block';}else{mw.style.display='none';}document.getElementById('starName').textContent=name.toUpperCase();document.getElementById('msgText').innerHTML=msg.replace(/\n/g,'<br>').replace(new RegExp(name,'g'),'<span class="name-hl">'+name+'</span>');const kEl=document.getElementById('msgKeyword');kEl.textContent=keyword?'✦ '+keyword+' ✦':'';document.getElementById('msgBy').textContent=selectedLang==='tl'?'ni Hiroyuki':'by Hiroyuki';document.getElementById('screenC').style.display='block';initStarCanvas(!!photoDataUrl);}function initStarCanvas(hasPhoto){const canvas=document.getElementById('starCanvas');const ctx=canvas.getContext('2d');canvas.width=window.innerWidth;canvas.height=window.innerHeight;const W=canvas.width,H=canvas.height;const stars=[];for(let i=0;i<300;i++){stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+0.2,base:Math.random()*0.6+0.2,speed:Math.random()*0.015+0.005,phase:Math.random()*Math.PI*2,color:Math.random()>0.85?'#ffc8d0':Math.random()>0.7?'#d4e8ff':'#ffffff'});}const shootingStars=[];function spawnShoot(){shootingStars.push({x:Math.random()*W*0.7,y:Math.random()*H*0.4,len:Math.random()*120+60,speed:Math.random()*10+8,life:1,decay:Math.random()*0.02+0.015});}spawnShoot();setInterval(spawnShoot,2800);let t=0;function draw(){const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#000510');grad.addColorStop(0.4,'#010a1a');grad.addColorStop(1,'#05010f');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);t+=0.016;stars.forEach(s=>{const alpha=s.base+Math.sin(t*s.speed*10+s.phase)*0.3;ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,alpha));ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();ctx.restore();});for(let i=shootingStars.length-1;i>=0;i--){const ss=shootingStars[i];ctx.save();ctx.globalAlpha=ss.life*0.8;const g=ctx.createLinearGradient(ss.x,ss.y,ss.x+ss.len,ss.y+ss.len*0.4);g.addColorStop(0,'rgba(255,255,220,0)');g.addColorStop(1,'rgba(255,255,220,0.9)');ctx.strokeStyle=g;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(ss.x,ss.y);ctx.lineTo(ss.x+ss.len,ss.y+ss.len*0.4);ctx.stroke();ctx.restore();ss.x+=ss.speed;ss.y+=ss.speed*0.4;ss.life-=ss.decay;if(ss.life<=0)shootingStars.splice(i,1);}requestAnimationFrame(draw);}draw();}function resetAll(){document.getElementById('screenC').style.display='none';document.getElementById('inputName').value='';document.getElementById('inputKeyword').value='';photoDataUrl=null;document.getElementById('photoPreview').style.display='none';document.getElementById('uploadPlaceholder').style.display='block';document.getElementById('photoInput').value='';document.getElementById('scanPhoto').style.display='none';document.getElementById('scanIcon').style.display='block';}</script></body></html>
