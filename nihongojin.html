-bottom:8px">📚</div><div class="logo">日本語教室</div><div class="by" style="margin-top:6px;margin-bottom:24px">by Hiroyuki</div><div style="padding:20px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);margin-bottom:20px"><div style="font-size:13px;color:rgba(232,224,240,.7);line-height:2;margin-bottom:16px">日本語人は現在開発中です。<br>最新情報・お問い合わせはLINEへ！<br><span style="font-size:11px;color:rgba(232,224,240,.4)">Questions & updates via LINE</span></div><div style="background:#fff;border-radius:16px;padding:16px;display:inline-block;margin-bottom:16px"><div id="qrCanvas"></div></div><div style="font-size:11px;color:rgba(232,224,240,.4);margin-bottom:4px">↑ カメラで読み取る / Scan with camera</div></div><a href="https://line.me/ti/p/77qfUAHfF2" target="\_blank" style="text-decoration:none"><button class="btn-primary" style="background:linear-gradient(135deg,#06c755,#00a041)">💬 LINEで連絡する / Contact on LINE</button></a><button class="btn-outline" onclick="go(\'lang\')" style="margin-top:12px">🔄 もう一度テストを受ける</button></div></div>`;setTimeout(generateQR,150);return;}}function goFromLang(){go(lang===\'ja\'?\'nativeWelcome\':\'welcome\');}function generateQR(){const el=document.getElementById(\'qrCanvas\');if(!el)return;el.innerHTML=\'\';new QRCode(el,{text:\'https://line.me/ti/p/77qfUAHfF2\',width:180,height:180,colorDark:\'#000000\',colorLight:\'#ffffff\',correctLevel:QRCode.CorrectLevel.H});}function setLang(code){lang=code;document.querySelectorAll(\'.lang-btn\').forEach(b=>{b.classList.remove(\'selected\');if(b.getAttribute(\'onclick\').includes(`\'${code}'`))b.classList.add('selected');});const btn=document.getElementById('langNextBtn');if(btn)btn.textContent=code==='ja'?'日本語で進む 🗾':'Next →';}function toggleRuby(){showRuby=!showRuby;render();}render();</script></body></html>
