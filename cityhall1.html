<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a18; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    min-height:100vh; font-family:'Courier New',monospace; padding-top:6px; }
  canvas { width:98vw; height:auto; max-height:64vh; border:3px solid #b06cff; box-shadow:0 0 24px #b06cff88;
    image-rendering:auto; touch-action:none; }
  .pad { margin-top:12px; width:96vw; display:flex; justify-content:space-between; align-items:flex-end; }
  .dpad { display:grid; grid-template-columns:repeat(3,58px); grid-template-rows:repeat(3,58px); gap:6px; }
  .dpad button, .act { background:#14081a; color:#b06cff; border:3px solid #b06cff; border-radius:14px;
    font-size:1.4rem; font-weight:bold; cursor:pointer;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:manipulation;
    box-shadow:0 0 10px #b06cff55; }
  .dpad button:active, .act:active { background:#b06cff; color:#0a0a18; }
  .dpad .empty { visibility:hidden; border:none; box-shadow:none; background:none; }
  .act { width:96px; height:96px; font-size:1rem; color:#ff9a3c; border-color:#ff9a3c; box-shadow:0 0 10px #ff9a3c55; }
  .act:active { background:#ff9a3c; color:#0a0a18; }
  .hint { color:#888; font-size:0.7rem; margin-top:10px; text-align:center; }

  /* ===== バトル用パネル ===== */
  #battlePanel { display:none; width:98vw; margin-top:8px; }
  #choices { display:flex; flex-direction:column; gap:7px; }
  .choice {
    background:#14081a; color:#fff; border:2px solid #b06cff; border-radius:10px;
    padding:12px 14px; font-size:0.95rem; font-weight:bold; text-align:left; line-height:1.45;
    font-family:'Courier New',monospace; cursor:pointer;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:manipulation;
    box-shadow:0 0 8px #b06cff44;
  }
  .choice:active { background:#b06cff; color:#0a0a18; }
  .choice.back { border-color:#666; color:#aaa; }
  .choice.danger { border-color:#c0304a; color:#ff8a9a; }
  .choice.next { border-color:#ff9a3c; color:#ff9a3c; text-align:center; }
  #senseiBox {
    display:none; margin-top:10px; background:#1a1020; border:2px solid #ff9a3c;
    border-radius:12px; padding:11px 13px; margin-bottom:16px;
  }
  #senseiTitle { color:#ff9a3c; font-weight:bold; font-size:0.85rem; margin-bottom:6px; }
  #senseiText { color:#ffe0b0; font-size:0.82rem; line-height:1.6; }
</style>
</head>

    <button class="empty"></button><button id="down">▼</button><button class="empty"></button>

// ===== 音（Web Audio API・ファイル不要） =====
let actx=null, bgmTimer=null, bgmStep=0, currentBgm='';
function initAudio(){
  if(actx) return;
  try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
}
function tone(freq,dur,type,vol,when){
  if(!actx) return;
  const t=when||actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(vol||0.08,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur);
}
// のんびり市役所テーマ

const walkLead=[392.0,440.0,523.2,440.0,392.0,349.2,392.0,440.0];
// 緊張感のあるバトルテーマ
const battleBass=[82.4,82.4,92.5,82.4,110.0,110.0,98.0,82.4];
const battleLead=[220.0,246.9,220.0,196.0,220.0,246.9,261.6,246.9];
// 勝利エンドロール用：明るいテーマ
const winBass=[261.6,261.6,349.2,392.0,440.0,392.0,349.2,293.7];
const winLead=[523.2,659.2,784.0,659.2,880.0,784.0,659.2,523.2];
// タイトル用：勇者の冒険テーマ

                 349.2,392.0,440.0,523.2,587.3,523.2,440.0,392.0];

function startBgm(kind){
  if(currentBgm===kind) return;
  currentBgm=kind; bgmStep=0;
  if(bgmTimer) clearInterval(bgmTimer);
  const interval = kind==='battle' ? 150 : (kind==='win' ? 210 : (kind==='title' ? 230 : 260));
  bgmTimer=setInterval(()=>{
    if(!actx) return;
    const t=actx.currentTime;
    if(kind==='walk'){
      tone(walkBass[bgmStep%walkBass.length],0.45,'triangle',0.06,t);
      tone(walkLead[bgmStep%walkLead.length],0.22,'sine',0.05,t);
    } else if(kind==='battle'){
      tone(battleBass[bgmStep%battleBass.length],0.16,'sawtooth',0.09,t);
      tone(battleLead[bgmStep%battleLead.length],0.1,'square',0.05,t);
    } else if(kind==='win'){
      tone(winBass[bgmStep%winBass.length],0.22,'triangle',0.08,t);
      tone(winLead[bgmStep%winLead.length],0.28,'square',0.07,t);
    } else if(kind==='title'){
      tone(titleBass[bgmStep%titleBass.length],0.34,'triangle',0.09,t);
      tone(titleLead[bgmStep%titleLead.length],0.30,'square',0.075,t);
    }
    bgmStep++;
  }, interval);
}
function stopBgm(){ if(bgmTimer) clearInterval(bgmTimer); bgmTimer=null; currentBgm=''; }
function unlockAudioAndStart(){
  initAudio();
  if(actx && actx.state==='suspended') actx.resume();
  startBgm(mode==='title' ? 'title' : 'walk');
}

const keys={up:false,down:false,left:false,right:false};
function bind(id,key){
  const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault(); keys[key]=true;});
  b.addEventListener('pointerup',e=>{e.preventDefault(); keys[key]=false;});
  b.addEventListener('pointerleave',()=>keys[key]=false);
}
bind('up','up'); bind('down','down'); bind('left','left'); bind('right','right');

document.getElementById('talk').addEventListener('pointerdown',e=>{ e.preventDefault(); if(mode==='secret'){ secretTalk(); return; } onTalk(); });
canvas.addEventListener('pointerdown',()=>{
  if(mode==='title'){ mode='walk'; frame=0; setUIMode('map'); startBgm('walk'); return; }
  if(mode==='dialog'){ onTalk(); return; }
  if(mode==='battle' && turnPhase==='auto'){ scIndex++; playScene(); return; }
  if(mode==='credits'){ startSecret(); return; }
  if(mode==='losscredits'){ location.reload(); return; }
  if(mode==='secret' && secretPhase==='dialog' && turnPhase==='auto'){ advanceSecret(); return; }
});

document.addEventListener('keydown',e=>{
  if(mode==='battle') return;
  if(e.key==='ArrowUp') keys.up=true;
  if(e.key==='ArrowDown') keys.down=true;
  if(e.key==='ArrowLeft') keys.left=true;
  if(e.key==='ArrowRight') keys.right=true;
  if(e.key===' '||e.key==='Enter') onTalk();
  if(e.key.startsWith('Arrow')) e.preventDefault();
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowUp') keys.up=false;
  if(e.key==='ArrowDown') keys.down=false;
  if(e.key==='ArrowLeft') keys.left=false;
  if(e.key==='ArrowRight') keys.right=false;
});

function nearClerk(){
  const dx=Math.abs(player.x-clerk.x);
  const dy=Math.abs(player.y-(clerk.y+clerk.h+34));
  return dx<70 && dy<130;
}
function onTalk(){
  if(mode==='walk'){ if(nearClerk()){ mode='dialog'; dialogIndex=0; } }
  else if(mode==='dialog'){ dialogIndex++; if(dialogIndex>=dialogLines.length){ mode='battleIntro'; frame=0; startBgm('battle'); setUIMode('battle'); choicesEl.innerHTML=''; showSensei(''); } }
}

function sfxDamage(){ if(!actx) return; tone(110,0.28,'sawtooth',0.15); }

function stopBgmSafe(){ if(bgmTimer){ clearInterval(bgmTimer); bgmTimer=null; currentBgm=''; } }

const battlePanel=document.getElementById('battlePanel');
const mapPad=document.getElementById('mapPad');
const mapHint=document.getElementById('mapHint');
const choicesEl=document.getElementById('choices');
const senseiBox=document.getElementById('senseiBox');

function setUIMode(m){

  else { mapPad.style.display='flex'; mapHint.style.display='block'; battlePanel.style.display='none'; }
}
function showSensei(text){
  if(text){ senseiBox.style.display='block'; senseiTextEl.textContent=text; }
  else { senseiBox.style.display='none'; }
}
function renderChoices(items){
  choicesEl.innerHTML='';
  items.forEach(it=>{
    const b=document.createElement('button');

function popDmg(text,color,side){ dmgPop={text,color,side,t:40}; }

// バトル開始
function startBattle(){
  pHP=P_HPMAX; eHP=E_HPMAX; scIndex=0;
  pHPview=P_HPMAX; eHPview=E_HPMAX;
  pendingResult=null; resultDelay=0;
  logLine=''; enemyLine=''; hasShindan=false; battleResult='';
  turnPhase='auto';
  setUIMode('battle');
  playScene();
}

// 現在のシーンを再生
function playScene(){
  if(scIndex>=SCENARIO.length){ endBattle('win'); return; }
  const sc=SCENARIO[scIndex];

  if(sc.type==='mono'){
    logLine=sc.text; enemyLine='';
    showSensei(sc.sensei||'');
    turnPhase='auto';
    renderChoices([]);
    return;
  }

  if(sc.type==='enemy'){
    logLine=''; enemyLine=sc.text;
    if(sc.dmg && !(hasShindan && sc.psycho)){
      pHP=Math.max(0,pHP-sc.dmg);
      sfxDamage();
      popDmg('-'+sc.dmg,'#ff4d6d','player');
    }
    showSensei(sc.sensei||'');
    if(pHP<=0){ reserveResult('lose'); return; }
    turnPhase='auto';
    renderChoices([]);
    return;
  }

  if(sc.type==='choice'){
    logLine=''; enemyLine=sc.q;
    showSensei('');
    turnPhase='choice';
    renderChoices(sc.options.map(op=>({
      label:op.label,
      cls: op.good?'':'',
      onTap:()=>pickChoice(op)
    })));
    return;
  }
}

// 選択肢を選んだ
function pickChoice(op){
  logLine = '';
  enemyLine = op.result;
  critFlash = op.critical ? 30 : 0;

  if(op.dmg){
    const d = op.finish ? Math.max(op.dmg, eHP) : op.dmg;  // 切り札は必ず倒しきる
    eHP=Math.max(0,eHP-d); sfxHit(); popDmg('-'+d,'#ffe066','enemy');
  }
  if(op.self){
    const d = op.surrender ? pHP : op.self;
    pHP=Math.max(0,pHP-d);
    sfxDamage();
    popDmg(op.critical?('痛恨！ -'+op.self):('-'+d),'#ff4d6d','player');
  }
  if(op.guard) hasShindan=true;
  showSensei(op.sensei||'');

  // 決着は「予約」だけ。ゲージが0まで減りきってから発火する
  if(op.surrender){ reserveResult('surrender'); return; }
  if(pHP<=0){ reserveResult('lose'); return; }
  if(eHP<=0){ reserveResult('win'); return; }

  turnPhase='auto';
  renderChoices([]);
}

// 決着を予約（ゲージが0になるのを待つ）
function reserveResult(r){
  pendingResult=r;
  turnPhase='draining';
  renderChoices([]);
}

function endBattle(result){
  turnPhase='over'; battleResult=result;
  stopBgmSafe();
  if(result==='win') sfxWin(); else sfxLose();

  // 勝利 → エンドロールへ
  if(result==='win'){
    logLine=''; enemyLine='';
    showSensei('');
    renderChoices([{ label:'▶ エンドロールを見る', cls:'next', onTap:()=>{
      mode='credits'; rollY=0; frame=0; choicesEl.innerHTML=''; showSensei(''); startBgm('win');
    }}]);
    return;
  }

  let msg;
  if(result==='surrender'){
    msg='あなたは、自分から降りた。これが水際作戦の完成だ。役所は一言も「却下」と言っていない。あなたが勝手に諦めただけ——書類上は、そうなる。だが申請権は消えていない。診断書・録音・第三者同行を用意して、必ず戻れ。';
  } else {
    msg='申請意志が折れた。これが水際作戦だ。追い返された人の多くは、二度と窓口に来ない。だが申請権は消えていない。診断書・録音・第三者同行を用意して、必ず戻れ。';
  }
  showSensei(msg);
  renderChoices([{ label:'▶ もう一度 挑む', cls:'next', onTap:()=>{ startBgm('battle'); startBattle(); } }]);
}

function update(){
  frame++;

  // ===== ゲージを滑らかに減らす =====
  const speed = (mode==='secret') ? 2.4 : 1.6;
  if(eHPview > eHP) eHPview = Math.max(eHP, eHPview - speed);
  else if(eHPview < eHP) eHPview = eHP;
  if(pHPview > pHP) pHPview = Math.max(pHP, pHPview - speed);
  else if(pHPview < pHP) pHPview = pHP;

  // ===== ゲージが減りきったら、決着を発火 =====
  if(pendingResult && turnPhase==='draining'){
    const drained = (eHPview<=eHP && pHPview<=pHP);
    if(drained){
      if(resultDelay<=0) resultDelay=24;
      resultDelay--;
      if(resultDelay<=0){
        const r=pendingResult;
        pendingResult=null; resultDelay=0;
        if(mode==='secret') fireSecretOver();
        else endBattle(r);
      }
    }
  }

  if(mode!=='walk' && !(mode==='secret' && secretPhase==='map')) return;
  let dx=0,dy=0;
  if(keys.up){ dy=-player.speed; player.dir='up'; }
  if(keys.down){ dy=player.speed; player.dir='down'; }
  if(keys.left){ dx=-player.speed; player.dir='left'; }
  if(keys.right){ dx=player.speed; player.dir='right'; }
  player.moving=(dx!==0||dy!==0);
  player.x+=dx; player.y+=dy;
  player.x=Math.max(30,Math.min(W-30,player.x));
  player.y=Math.max(230,Math.min(H-30,player.y));
  if(player.moving){ player.stepTimer++; if(player.stepTimer>8){ player.step=(player.step+1)%2; player.stepTimer=0; } }
}

function drawFloor(){
  ctx.fillStyle=FLOOR_COLOR; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(0,0,0,0.06)'; ctx.lineWidth=1;
  for(let x=0;x<=W;x+=TILE){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0;y<=H;y+=TILE){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
}
function drawHall(){
  ctx.fillStyle='#5a6a80'; ctx.fillRect(0,0,W,44);
  ctx.fillStyle='#48566a'; ctx.fillRect(0,40,W,4);
  ctx.fillStyle='#fff'; ctx.font='bold 15px Courier New'; ctx.textAlign='center';
  ctx.fillText('キタ区役所  生活支援課  生活保護窓口',W/2,28); ctx.textAlign='left';
  ctx.strokeStyle='#a06a3c'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(50,230); ctx.lineTo(W-50,230); ctx.stroke();
  ctx.fillStyle='#a06a3c'; ctx.font='bold 12px Courier New'; ctx.textAlign='center';
  ctx.fillText('― 生活支援課 ―',W/2,250); ctx.textAlign='left';
}
function drawClerkMap(){
  const c=clerk;
  if(enemyMapImg.ready){ ctx.drawImage(enemyMapImg,c.x-c.w/2,c.y,c.w,c.h); }
  else { ctx.fillStyle='#2a2a40'; ctx.fillRect(c.x-c.w/2,c.y,c.w,c.h); }
  if(nearClerk() && mode==='walk'){
    ctx.fillStyle='#e04a2a'; ctx.font='bold 26px Courier New'; ctx.textAlign='center';
    if(frame%40<26) ctx.fillText('!',c.x,c.y-22);
    ctx.textAlign='left';
  }
}
function drawPlayer(){
  const p=player;
  const bob=p.moving?(p.step===1?-2:0):0;
  ctx.save();
  ctx.translate(p.x,p.y);
  // 向きで絵を選ぶ
  let im=charaFront, flip=false;
  if(p.dir==='up') im=charaBack;
  else if(p.dir==='down') im=charaFront;
  else if(p.dir==='left'){ im=charaSide; flip=false; }
  else if(p.dir==='right'){ im=charaSide; flip=true; }
  if(im && im.ready){
    if(flip){ ctx.scale(-1,1); }
    ctx.drawImage(im,-p.w/2,-p.h+bob,p.w,p.h);
  } else {
    ctx.fillStyle='#8a3ce0'; ctx.fillRect(-p.w/2,-p.h+bob,p.w,p.h);
  }
  ctx.restore();
}
function wrapText(text,x,y,maxW,lh){
  const chars=[...text]; let line='',yy=y;
  for(const ch of chars){
    if(ctx.measureText(line+ch).width>maxW){ ctx.fillText(line,x,yy); line=ch; yy+=lh; }
    else line+=ch;
  }
  ctx.fillText(line,x,yy);
}
function drawDialog(){
  ctx.fillStyle='rgba(10,10,30,0.92)'; ctx.fillRect(20,H-96,W-40,76);
  ctx.strokeStyle='#b06cff'; ctx.lineWidth=3; ctx.strokeRect(20,H-96,W-40,76);
  ctx.fillStyle='#fff'; ctx.font='bold 14px Courier New';
  wrapText(dialogLines[dialogIndex],34,H-66,W-68,20);
  ctx.fillStyle='#ff9a3c'; ctx.font='bold 11px Courier New'; ctx.textAlign='right';
  ctx.fillText('▶ タップで次へ',W-34,H-28); ctx.textAlign='left';
}

// ===== バトル描画 =====
function drawBattleBG(){

}

  ctx.fillStyle= (frame%60<38) ? '#fff' : 'rgba(255,255,255,0.25)';

function draw(){
  if(mode==='title'){ drawTitle(); return; }
  if(mode==='walk' || mode==='dialog'){
    drawFloor(); drawHall(); drawClerkMap(); drawPlayer();
    if(mode==='dialog') drawDialog();
    return;
  }
  if(mode==='battleIntro'){
    drawBattleBG();
    const p=Math.min(1,frame/40);
    drawBossBattle(0.5+0.5*p,(1-p)*40);
    ctx.textAlign='center';
    if(frame<50){
      ctx.fillStyle='#333'; ctx.font='bold 16px Courier New';
      if(frame%20<14) ctx.fillText('窓口の人 が たちはだかった！',W/2,40);
    } else {
      ctx.fillStyle='#c0304a'; ctx.font='bold 30px Courier New';
      if(frame%20<14) ctx.fillText('⚔ バトル開始！ ⚔',W/2,44);
    }
    ctx.textAlign='left';
    if(frame>90){ mode='battle'; frame=0; startBattle(); }
    return;
  }
  if(mode==='credits'){ drawCredits(); return; }
  if(mode==='losscredits'){ drawLossCredits(); return; }

  if(mode==='secret'){
    if(secretPhase==='map'){
      drawFloor(); drawHall(); drawClerkMapSecret(); drawPlayer();
      ctx.fillStyle='#b06cff'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
      ctx.fillText('― 出会いクエスト ❤️ ―',W/2,H-10); ctx.textAlign='left';
      return;
    }
    // 画面を揺らす（被弾演出）
    const shake = critFlash>0 ? (Math.random()-0.5)*critFlash*0.5 : 0;
    ctx.save();
    ctx.translate(shake, shake*0.6);
    drawBattleBG();
    drawLadyBattle();
    ctx.restore();
    drawSecretHP();
    // 激しい赤の点滅
    if(critFlash>0){
      critFlash--;
      const blink = (critFlash%8<4) ? 0.75 : 0.25;
      ctx.fillStyle='rgba(220,10,40,'+(blink*(critFlash/90))+')';
      ctx.fillRect(0,0,W,H);
      if(critFlash%8<2){ ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.fillRect(0,0,W,H); }
    }
    drawDmgPop();
    if(secretPhase==='over') drawArrest();
    else drawSpeechBox();
    return;
  }

  if(mode==='battle'){
    drawBattleBG();
    drawBossBattle(0.70,0);
    drawHPBars();
    if(critFlash>0){
      critFlash--;
      ctx.fillStyle='rgba(200,20,40,'+(critFlash/30*0.5)+')';
      ctx.fillRect(0,0,W,H);
    }
    drawDmgPop();
    if(turnPhase==='over') drawBattleOver();
    else drawSpeechBox();
  }
}

// ダメージ数字のポップアップ
function drawDmgPop(){
  if(!dmgPop) return;
  dmgPop.t--;
  if(dmgPop.t<=0){ dmgPop=null; return; }
  const rise=(40-dmgPop.t)*0.9;
  const x = dmgPop.side==='enemy' ? W/2 : W-70;
  const y = (dmgPop.side==='enemy' ? 150 : 70) - rise;
  ctx.globalAlpha=Math.min(1,dmgPop.t/18);
  ctx.textAlign='center';
  ctx.font='bold 30px Courier New';
  ctx.lineWidth=4; ctx.strokeStyle='#fff';
  ctx.strokeText(dmgPop.text,x,y);
  ctx.fillStyle=dmgPop.color;

// 折り返して、次のy座標を返す
function wrapTextY(text,x,y,maxW,lh){
  const chars=[...text]; let line='', yy=y;
  for(const ch of chars){
    if(ctx.measureText(line+ch).width>maxW){ ctx.fillText(line,x,yy); line=ch; yy+=lh; }
    else line+=ch;
  }
  if(line) { ctx.fillText(line,x,yy); yy+=lh; }
  return yy;
}

// ===== 出会いクエスト（マップから開始） =====
function startSecret(){
  mode='secret';
  secretPhase='map'; secretDlgIndex=0; secretAngry=false;
  logLine=''; enemyLine=''; critFlash=0; dmgPop=null;
  pHP=P_HPMAX; pHPview=P_HPMAX;    // 信用は満タンから始まる
  pendingResult=null; resultDelay=0;
  player.x=W/2; player.y=H-70; player.dir='up';
  setUIMode('map');
  startBgm('walk');
}

function secretTalk(){
  if(secretPhase==='map'){
    if(nearClerk()){
      secretPhase='dialog'; secretDlgIndex=0;
      setUIMode('battle');
      startBgm('walk');
      showSecretLine();
    }
    return;
  }
}
function showSecretLine(){
  const line=SECRET_DIALOG[secretDlgIndex];
  if(line.startsWith('（')){ logLine=line; enemyLine=''; }
  else { logLine=''; enemyLine=line; }
  showSensei('');
  turnPhase='auto';
  renderChoices([]);
}
function advanceSecret(){
  if(secretPhase!=='dialog') return;
  secretDlgIndex++;
  if(secretDlgIndex>=SECRET_DIALOG.length){
    secretPhase='choice';
    logLine=''; enemyLine='▼ ……あなたは、何をする ▼';
    turnPhase='choice';
    renderChoices(SECRET_CHOICES.map(op=>({ label:op.label, onTap:()=>pickSecret(op) })));
    return;
  }
  showSecretLine();
}
function pickSecret(op){
  // どちらを選んでも、同じ結末
  logLine=''; enemyLine=op.result;
  secretAngry=true; critFlash=90;
  secretOverLine=op.over;
  // 9999 の一撃：ゲージが目の前でゼロまで削られる
  pHP=0;
  sfxDamage();
  popDmg('-9999','#ff2040','player');
  if(actx){ const t=actx.currentTime; [220,180,140,110].forEach((f,i)=>tone(f,0.3,'sawtooth',0.18,t+i*0.1)); }
  showSensei('');
  reserveResult('harass');   // ゲージが0になってから GAME OVER
}

// ゲージが0になった後に呼ばれる（出会いクエスト）
function fireSecretOver(){
  secretPhase='over'; turnPhase='over'; battleResult='harass';
  sfxLose(); stopBgmSafe();
  if(actx){ const t=actx.currentTime; [110,90,70,55].forEach((f,i)=>tone(f,0.5,'sawtooth',0.2,t+i*0.18)); }
  renderChoices([{ label:'▶ …………', cls:'danger', onTap:()=>{
    showSensei(SECRET_SENSEI);
    renderChoices([{ label:'▶ ……それでも、あなたは', cls:'next', onTap:()=>{
      mode='losscredits'; rollY=0; frame=0;
      choicesEl.innerHTML=''; showSensei('');
      startBgm('walk');
    }}]);
  }}]);
}

// 画面いっぱいに絵を敷く（比率を保ち、はみ出す分は切る）
function drawCover(img){
  const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
  if(!iw || !ih) return;
  const scale = Math.max(W/iw, H/ih);
  const dw = iw*scale, dh = ih*scale;
  ctx.drawImage(img, W/2-dw/2, H/2-dh/2, dw, dh);
}

function wrapCenter(text,cx,y,maxW,lh){
  if(!text) return;
  const chars=[...text]; let line='', yy=y;
  for(const ch of chars){
    if(ctx.measureText(line+ch).width>maxW){ ctx.fillText(line,cx,yy); line=ch; yy+=lh; }
    else line+=ch;
  }
  if(line) ctx.fillText(line,cx,yy);
}
